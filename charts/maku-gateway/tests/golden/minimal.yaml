---
# Source: maku-gateway/templates/networkpolicy.yaml
# Default deny on the proxy pods (GW13). In: runs on public and internal, the broker on clients, a
# scraper on 15020. Out: DNS, the controller's xDS, and each provider on its port. The JWKS is not
# here: the controller fetches it, and the proxies receive the keyset over xDS. Probes are node
# traffic, which NetworkPolicy always allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-gateway
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: model-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: agents}
          podSelector:
            matchExpressions:
              # The run-controller's label on every run pod.
              - {key: agents.ogenki.io/run-id, operator: Exists}
      ports:
        - {port: 8080, protocol: TCP}
        - {port: 8081, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: maku}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: room-broker
      ports:
        - {port: 8082, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: maku}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway
      ports: [{port: 9978, protocol: TCP}]
    # provider stub (stub.models.svc.cluster.local)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: models
      ports: [{port: 8080, protocol: TCP}]

---
# Source: maku-gateway/templates/catalog.yaml
# The prices agentgateway merges over its built-in catalog to price each response (the access log's
# `cost`), from the factory's meter.prices rows: edit a price there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-gateway-model-catalog
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
data:
  catalog.json: |
    {
      "providers": {}
    }

---
# Source: maku-gateway/templates/backends.yaml
# tier-light on stub (custom): the model is forced to the alias whatever the
# body says, then mapped to stub-light (GW5): a caller holds no other alias's audience, so it
# cannot reach another model. The key is read from Secret stub-api-key by reference (D14).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: stub-tier-light
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  ai:
    provider:
      custom:
        # The catalog key (the model catalog) and the series' provider label.
        providerOverride: stub
        formats:
          - type: Completions
            path: /v1/chat/completions
      host: stub.models.svc.cluster.local
      port: 8080
  policies:
    auth:
      secretRef:
        name: stub-api-key
        key: apiKey
    ai:
      # Typed routes: the harness, the planner and the classifier speak Chat Completions.
      routes:
        /v1/chat/completions: Completions
      modelAliases:
        tier-light: "stub-light"
      transformations:
        - field: model
          expression: '"tier-light"'

---
# Source: maku-gateway/templates/parameters.yaml
# The generated proxy has no pod seccomp profile, no liveness probe, no limits and a LoadBalancer
# Service by default; these fields are strategic-merge overlays on what the controller renders (its
# container is already non-root, read-only, capabilities dropped). As cnref's parameters.yaml.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: model-gateway
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  # A controller pin change does not re-render the proxy until the Gateway is touched: bump this with
  # the controller, then check the pod's digest.
  image:
    registry: cr.agentgateway.dev
    repository: agentgateway
    tag: "v1.6.0"
    digest: sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
  logging:
    format: json
  # The overlay that prices each response (the access log's `cost`), merged over the built-in catalog.
  modelCatalog:
    sources:
      - configMap:
          name: model-gateway-model-catalog
  # The default (10s/60s) cut a 200s stream; min 10 / max 660 held it through the deletion of every
  # proxy pod (cnref PoC N1). 660 = the 600s request timeout + 60s; the controller sets
  # terminationGracePeriodSeconds from max.
  shutdown:
    min: 10
    max: 660
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  deployment:
    spec:
      replicas: 2
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: model-gateway
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: model-gateway
          containers:
            - name: agentgateway
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
              livenessProbe:
                httpGet:
                  path: /healthz/ready
                  port: 15021
                periodSeconds: 10
                failureThreshold: 6
  service:
    spec:
      # Runs and the broker reach it in-cluster; a LoadBalancer would give their boundary a cloud address.
      type: ClusterIP
  # A drain never takes every in-flight completion. One replica gets no PDB: it would block every drain.
  podDisruptionBudget:
    spec:
      minAvailable: 1

---
# Source: maku-gateway/templates/policies-identity.yaml
# The identity headers are dropped before routing, so no route or backend sees a forged one, even
# where a listener's `set` does not run.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: model-gateway-strip-identity-headers
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  targetRefs:
    -
      group: gateway.networking.k8s.io
      kind: Gateway
      name: model-gateway
  traffic:
    phase: PreRouting
    transformation:
      request:
        remove:
          - x-ar-agent
          - x-ar-human
          - x-ai-gateway-client-id
          - agent-session-id

---
# Source: maku-gateway/templates/policies-identity.yaml
# Listener public: the caller's projected ServiceAccount token, verified offline against this
# cluster's issuer, must carry `exp` and `sub` (a sub-less token would share one rate-limit bucket),
# the subject below, and an audience starting "maku-gateway.public."; each route then
# requires its own audience. Audiences are checked in CEL, not in the provider's audience
# list, which agentgateway caps at eight. The token is removed before any backend (preserveToken
# off), and x-ar-agent is REPLACED with the verified sub.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: model-gateway-listener-public
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  targetRefs:
    -
      group: gateway.networking.k8s.io
      kind: Gateway
      name: model-gateway
      sectionName: public
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: https://kubernetes.default.svc.cluster.local
          jwks:
            remote:
              url: https://issuer.example.test/openid/v1/jwks
          validation:
            requiredClaims:
              - exp
              - sub
    authorization:
      action: Require
      policy:
        matchExpressions:
          - 'jwt.sub.matches("^system:serviceaccount:agents:run-[a-z2-7]{8}$")'
          - 'jwt.aud.exists(a, a.startsWith("maku-gateway.public."))'
    transformation:
      request:
        set:
          - name: x-ar-agent
            value: jwt.sub
      # The gateway's own 429 (a budget a later step adds) comes with an empty body, which the
      # harness would log as a bare RateLimitError: name the cause. Only the gateway's own 429 lacks
      # a content-type; a provider's keeps its body. No response.body read: streams stay unbuffered.
      response:
        body: >-
          response.code == 429 && !("content-type" in response.headers)
          ? {"error": {"type": "rate_limit_error", "code": "gateway_budget_exhausted",
          "message": "the model gateway refused this call: a gateway budget is spent (limit "
          + default(response.headers["x-ratelimit-limit"], "unknown") + ", resets in "
          + default(response.headers["x-ratelimit-reset"], "unknown") + " s). Not retryable."}}
          : null
    # A long completion must not time out.
    timeouts:
      request: 600s

