---
# Source: maku-gateway/templates/policies-identity.yaml
# One frontend policy per Gateway: two would leave the merge to the controller.
# Buffer: 8Mi, as cnref's agent-router (agentgateway's 2 MiB default cuts long agent contexts).
# Telemetry: every identity label is the verified sub, under the names the factory's meter and the
# dashboards read (ar_agent on metrics, x_ar_agent on the access log), with the priced cost.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: model-gateway-frontend
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  targetRefs:
    -
      group: gateway.networking.k8s.io
      kind: Gateway
      name: model-gateway
  frontend:
    http:
      maxBufferSize: 8Mi
    accessLog:
      attributes:
        add:
          - name: x_ar_agent
            expression: jwt.sub
          # The request's priced cost in USD (empty when the catalog has no exact row).
          - name: cost
            expression: flatten(llm.cost)
    metrics:
      attributes:
        add:
          - name: ar_agent
            expression: jwt.sub

---
# Source: maku-gateway/templates/routes.yaml
# The pin (GW5): the listener admits any audience of its class; this route admits only its own.
# A caller that rewrites its path to another alias holds no token for it: 403. The listener's
# subject check is repeated here, so it holds whatever agentgateway's policy merge does (probe P2).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: maku-models-public-tier-light
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: maku-models-public-tier-light
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - '"maku-gateway.public.tier-light" in jwt.aud'
          - 'jwt.sub.matches("^system:serviceaccount:agents:run-[a-z2-7]{8}$")'

---
# Source: maku-gateway/templates/routes.yaml
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: maku-models-public-list
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: maku-models-public-list
  traffic:
    directResponse:
      status: 404
      body: '{"error":"model listing is not served on the model gateway"}'

---
# Source: maku-gateway/templates/gateway.yaml
# The model gateway (D7). One listener per data class, as on cnref's agent-router: an internal run's
# token never reaches a public-only provider, because that provider's routes attach to `public` only.
# `clients` serves the broker's planner and classifier. Routes attach from this namespace only.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: model-gateway
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: public
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
    - name: internal
      protocol: HTTP
      port: 8081
      allowedRoutes:
        namespaces:
          from: Same
    - name: clients
      protocol: HTTP
      port: 8082
      allowedRoutes:
        namespaces:
          from: Same
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: model-gateway

---
# Source: maku-gateway/templates/routes.yaml
# /m/tier-light on public: a caller's base URL is
# http://model-gateway.<namespace>.svc:<port>/m/tier-light/v1; each path is matched exactly and
# rewritten to the backend's typed route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maku-models-public-tier-light
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: model-gateway
      sectionName: public
  rules:
    - matches:
        - path:
            type: Exact
            value: /m/tier-light/v1/chat/completions
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: stub-tier-light

---
# Source: maku-gateway/templates/routes.yaml
# A model listing is answered 404 after the listener's token check, as cnref's agent-router answers
# it: every harness works with that. The Exact match outranks each alias's prefix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maku-models-public-list
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: mgw
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: model-gateway
      sectionName: public
  rules:
    - matches:
        - path:
            type: Exact
            value: /m/tier-light/v1/models
      # Never reached: the policy below answers first.
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: stub-tier-light
