# Probe P7's fake Gemini (fake-gemini.py): Vertex AI and the Gemini API over TLS on 443, with a
# certificate the probe's own CA signs for their hostnames, and the GKE metadata server on 80. The
# CoreDNS override probe.sh writes sends both hostnames here; the proxy finds the metadata server
# through GCE_METADATA_HOST (manifests.yaml's AgentgatewayParameters).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-gemini
  namespace: maku
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fake-gemini}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fake-gemini}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fake
          image: docker.io/library/python:3.15-alpine@sha256:ff4d3c9b1a48f646eedd93182aaea385c7a5452f4c8a8cd7cef686babacf4928
          command: ["python3", "-u", "/app/fake-gemini.py", "8443", "8080", "/tls/tls.crt", "/tls/tls.key"]
          ports: [{name: https, containerPort: 8443}, {name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: app
          configMap: {name: probe-scripts}
        - name: tls
          secret: {secretName: fake-gemini-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-gemini
  namespace: maku
spec:
  selector: {app.kubernetes.io/name: fake-gemini}
  ports:
    - {name: https, port: 443, targetPort: https}
    - {name: http, port: 80, targetPort: http}
