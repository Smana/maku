          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: moonshot-kimi-frontier}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maku-models-public-mistral-light
  namespace: maku
spec:
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: model-gateway, sectionName: public}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /m/mistral-light/}}]
      filters:
