---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maku-models-internal-tier-light
  namespace: maku
spec:
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: model-gateway, sectionName: internal}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /m/tier-light/}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: echo-tier-light}]
---
# One Require per alias route: the token's audience names this listener and this alias (P2's `in`).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: maku-models-public-tier-light
  namespace: maku
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: maku-models-public-tier-light}]
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions: ['"maku-gateway.public.tier-light" in jwt.aud']
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: maku-models-public-tier-frontier
