{{- if .Values.enabled }}
{{- $v := .Values }}
{{- /* Every route: {name, section, prefix, backend, audience}. One HTTPRoute per alias, not one rule
per alias: targeting a rule (sectionName) needs Gateway API v1.4, a route needs v1.2 (probe P6). */}}
{{- $routes := list }}
{{- range $class := list "public" "internal" }}
{{- range $alias, $t := (index $v.aliases $class) | default dict }}
{{- $routes = append $routes (dict "name" (printf "maku-models-%s-%s" $class $alias) "section" $class "prefix" (printf "/m/%s/" $alias) "backend" (printf "%s-%s" $t.provider $alias) "audience" (printf "%s.%s.%s" $v.audiencePrefix $class $alias)) }}
{{- end }}
{{- end }}
{{- range $client := list "planner" "classifier" }}
{{- $c := index $v.clients $client }}
{{- if $c.enabled }}
{{- $routes = append $routes (dict "name" (printf "maku-clients-%s" $client) "section" "clients" "prefix" (printf "/clients/%s/" $client) "backend" (printf "%s-%s" $c.provider $client) "audience" (printf "%s.client.%s" $v.audiencePrefix $client)) }}
{{- end }}
{{- end }}
{{- range $r := $routes }}
---
# {{ $r.prefix }} on {{ $r.section }}: the prefix is rewritten to /, so a caller's base URL is
# http://{{ $v.name }}.<namespace>.svc:<port>{{ $r.prefix }}v1.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $r.name }}
  labels: {{- include "mgw.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.name }}
      sectionName: {{ $r.section }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $r.prefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $r.backend }}
---
# The pin (GW5): the listener admits any audience of its class; this route admits only its own.
# A caller that rewrites its path to another alias holds no token for it: 403.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $r.name }}
  labels: {{- include "mgw.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $r.name }}
  traffic:
    authorization:
      action: Require
      policy:
        matchExpressions:
          - {{ printf "\"%s\" in jwt.aud" $r.audience | squote }}
{{- end }}
{{- range $class := list "public" "internal" }}
{{- $aliases := (index $v.aliases $class) | default dict }}
{{- if $aliases }}
{{- $first := index $aliases (first (keys $aliases | sortAlpha)) }}
---
# A model listing is answered 404 after the listener's token check, as cnref's agent-router answers
# it: every harness works with that. The Exact match outranks each alias's prefix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maku-models-{{ $class }}-list
  labels: {{- include "mgw.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.name }}
      sectionName: {{ $class }}
  rules:
    - matches:
        {{- range $alias := keys $aliases | sortAlpha }}
        - path:
            type: Exact
            value: /m/{{ $alias }}/v1/models
        {{- end }}
      # Never reached: the policy below answers first.
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $first.provider }}-{{ first (keys $aliases | sortAlpha) }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: maku-models-{{ $class }}-list
  labels: {{- include "mgw.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: maku-models-{{ $class }}-list
  traffic:
    directResponse:
      status: 404
      body: '{"error":"model listing is not served on the model gateway"}'
{{- end }}
{{- end }}
{{- end }}
