{{- if .Values.enabled }}
# The model gateway (D7). One listener per data class, as on cnref's agent-router: an internal run's
# token never reaches a public-only provider, because that provider's routes attach to `public` only.
# `clients` serves the broker's planner and classifier. Routes attach from this namespace only.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}
  labels: {{- include "mgw.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    {{- range $l := list "public" "internal" "clients" }}
    - name: {{ $l }}
      protocol: HTTP
      port: {{ index $.Values.listeners $l }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ .Values.name }}
{{- end }}
