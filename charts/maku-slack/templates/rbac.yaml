# The thread map and nothing else (R25): get and update on one named ConfigMap. No create: the chart
# renders it (threads-configmap.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-slack-app
  namespace: {{ .Release.Namespace }}
  labels: {{- include "mslack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [factory-slack-threads]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-slack-app
  namespace: {{ .Release.Namespace }}
  labels: {{- include "mslack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-slack-app
subjects:
  - kind: ServiceAccount
    name: factory-slack-app
    namespace: {{ .Release.Namespace }}
