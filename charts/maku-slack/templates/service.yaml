apiVersion: v1
kind: Service
metadata:
  name: factory-slack-app
  namespace: {{ .Release.Namespace }}
  labels: {{- include "mslack.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: factory-slack-app
  ports:
    # Slack's events and interactivity (public, through expose.slack), the broker's webhooks
    # (cluster only), and the metrics with the probes.
    - {name: events, port: 8080, targetPort: events, protocol: TCP}
    - {name: webhooks, port: 8081, targetPort: webhooks, protocol: TCP}
    - {name: metrics, port: 9090, targetPort: metrics, protocol: TCP}
