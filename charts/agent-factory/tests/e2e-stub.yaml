# Test-only external-service emulator for task chart:intake:k3d. The script builds and imports this
# image, and creates e2e-stub-tls from a one-day throwaway CA before applying this manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-stub
  namespace: e2e
  labels: {app.kubernetes.io/name: e2e-stub}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: e2e-stub}
  template:
    metadata:
      labels: {app.kubernetes.io/name: e2e-stub}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: e2e-stub
          image: ghcr.io/smana/maku-e2e-stub:e2e
          imagePullPolicy: Never
          env:
            - {name: E2E_STUB_TLS_CERT_FILE, value: /etc/e2e-stub/tls/tls.crt}
            - {name: E2E_STUB_TLS_KEY_FILE, value: /etc/e2e-stub/tls/tls.key}
          ports:
            - {name: https, containerPort: 8443, protocol: TCP}
          startupProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tls, mountPath: /etc/e2e-stub/tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: e2e-stub-tls, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-stub
  namespace: e2e
  labels: {app.kubernetes.io/name: e2e-stub}
spec:
  selector: {app.kubernetes.io/name: e2e-stub}
  ports:
    - {name: https, port: 443, targetPort: https, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2e-stub
  namespace: e2e
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: e2e-stub}
  policyTypes: [Ingress]
  ingress:
    # The broker reads OIDC, ZITADEL, GitHub and the planner here; the factory reads GitHub and its
    # model here. Host-originated kubelet probes and kubectl port-forward are admitted by k3s.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: maku}
          podSelector:
            matchLabels: {app.kubernetes.io/name: room-broker}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: maku}
          podSelector:
            matchLabels: {app.kubernetes.io/name: agent-factory}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: agents}
      ports:
        - {protocol: TCP, port: https}
