# Test-only values for task chart:intake:k3d. Every credential and endpoint belongs to the throwaway
# cluster; nothing here changes the chart's demo defaults or names a real external service.
# The runs call the model gateway (the demo's model.mode gateway, step 7 R4): its demo provider is the
# stub too, under its own key Secret (e2e-provider-key), so no demo.model value is set.

maku:
  broker:
    publicURL: https://rooms.e2e.test
    human:
      mode: oidc
      issuer: https://e2e-stub.e2e.svc.cluster.local
      jwksURL: https://e2e-stub.e2e.svc.cluster.local/oauth/v2/keys
      clientIDFile: /etc/e2e/config/client-id
      roomctlClientIDFile: /etc/e2e/config/roomctl-client-id
      projectIDFile: /etc/e2e/config/project-id
      origin: https://rooms.e2e.test
      groups: {admin: agents-admin, member: agents-member}
      access:
        readerFile: /etc/e2e/config/reader.json
      mcp:
        enabled: true
        sessionStart: [owner/repo]
        # The Slack App's principal, which slackIntents names (the classifier is on, in shadow).
        sponsored:
          - {name: slack-app, clientIDFile: /etc/e2e/config/sponsored-client-id}
      # Neither block names a url or a key file: modelGateway derives both, the model gateway's
      # clients listener and the broker's projected token per client (plan v4 step 4, Task 12).
      slackIntents:
        principal: slack-app
        teamID: T0E2ETEST
      intake:
        plan:
          enabled: true
          # The stub's planner answers whatever the effort; the mistral leg proves its preset
          # rewrites this to "none" on the wire.
          reasoningEffort: low
          repositories: [owner/repo]
          maxRounds: 2
          classes:
            docs:
              roles: [scoper, implementer, reviewer]
              ceilingUSD: 1
              source: class:docs
    modelGateway:
      service: model-gateway
    extraEnv:
      - {name: ROOMS_GITHUB_API_URL, value: https://e2e-stub.e2e.svc.cluster.local/}
      - {name: ROOMS_GITHUB_APP_DIR, value: /etc/e2e/github}
      - {name: SSL_CERT_FILE, value: /etc/e2e/ca/ca.crt}
    extraVolumes:
      - name: e2e-config
        secret: {secretName: e2e-broker-config, defaultMode: 0440}
      - name: e2e-ca
        secret: {secretName: e2e-stub-ca, defaultMode: 0440}
      - name: e2e-github
        secret: {secretName: agent-factory-github, defaultMode: 0440}
    extraVolumeMounts:
      - {name: e2e-config, mountPath: /etc/e2e/config, readOnly: true}
      - {name: e2e-ca, mountPath: /etc/e2e/ca, readOnly: true}
      - {name: e2e-github, mountPath: /etc/e2e/github, readOnly: true}

maku-factory:
  # The demo uses one throwaway App for the factory and merger: values-demo.yaml's
  # apps.merger.mode factory points the merger at the factory App's files.
  extraEnv:
    - {name: ROOMS_GITHUB_API_URL, value: https://e2e-stub.e2e.svc.cluster.local/}
    - {name: SSL_CERT_FILE, value: /etc/e2e/ca/ca.crt}
  extraVolumes:
    - name: e2e-ca
      secret: {secretName: e2e-stub-ca, defaultMode: 0440}
  extraVolumeMounts:
    - {name: e2e-ca, mountPath: /etc/e2e/ca, readOnly: true}
  config:
    repositories:
      - name: owner/repo
        maintainers: [dev]
        triggerLabel: factory/ready
        classes:
          docs: {shadow: true, allowedFiles: ['^docs/.+$']}
          docs-links: {shadow: true, allowedFiles: ['^.+\.(md|mdx|adoc|rst)$']}
          revert: {shadow: true, allowedFiles: ['^.+$']}
        merge:
          requiredChecks: [ci]
          verifyChecks: [ci]
          leakScanCheck: ci
          gateStatus: true
          policyBot: false
          approveToMerge: true
          mergerLogin: maku-demo[bot]
          autoMergesPerDay: 5
          fixRuns: 2
          checkReruns: 1
          verifyFor: 30m
          revertWindow: 168h
          breaker: {window: 10, maxReverts: 1}
    loops:
      docs: {scope: scoper, judge: tier-light}
      docs-links: {scope: scoper, judge: tier-light}
      review: {scope: scoper, judge: tier-light}

# The model gateway (plan v4 step 4, Task 12): the upstream controller and maku-gateway, the planner
# and the classifier as clients, the stub as a `custom` provider over plain http. intake.sh sets
# identity.issuer from the cluster.
agentgateway:
  enabled: true
maku-gateway:
  enabled: true
  replicas: 1
  identity:
    jwks: {source: apiserver, allowAnonymousDiscovery: true}
  providers:
    stub:
      preset: custom
      existingSecret: e2e-provider-key
      host: e2e-stub.e2e.svc.cluster.local
      port: 8080
      path: /v1/chat/completions
      tls: false
      egress:
        peers: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: e2e}}, podSelector: {matchLabels: {app.kubernetes.io/name: e2e-stub}}}]
    # values-demo.yaml's provider, which the runs' aliases name: the same stub.
    demo:
      preset: custom
      existingSecret: e2e-provider-key
      key: apiKey
      host: e2e-stub.e2e.svc.cluster.local
      port: 8080
      path: /v1/chat/completions
      tls: false
      egress:
        peers: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: e2e}}, podSelector: {matchLabels: {app.kubernetes.io/name: e2e-stub}}}]
  aliases:
    public:
      agent-default: {provider: stub, model: stub-default}
      tier-light: {provider: stub, model: stub-light}
  clients:
    planner: {enabled: true, provider: stub, model: stub-frontier}
    classifier: {enabled: true, provider: stub, model: stub-light}
