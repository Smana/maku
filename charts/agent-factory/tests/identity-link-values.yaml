# Test-only values for task chart:identity:k3d's GitHub account link leg (v4 D8, step 5 PR C), layered
# on identity-values.yaml: the room-access check from the broker's link alone (no ZITADEL reader),
# the link's OAuth client by Secret, and the e2e stub as GitHub's site, its API and the factory App's
# API. Every id and endpoint belongs to the throwaway cluster.
maku:
  broker:
    githubLink:
      existingSecret: e2e-github-link
      webURL: https://e2e-stub.e2e.svc.cluster.local
    human:
      access: {ttl: 1m}
    extraEnv:
      - {name: SSL_CERT_FILE, value: /etc/e2e/ca/ca.crt}
      - {name: ROOMS_GITHUB_API_URL, value: https://e2e-stub.e2e.svc.cluster.local/}
      - {name: ROOMS_GITHUB_APP_DIR, value: /etc/e2e/github}
    extraVolumes:
      - name: e2e-ca
        secret: {secretName: e2e-stub-ca, defaultMode: 0440}
      - name: e2e-github
        secret: {secretName: agent-factory-github, defaultMode: 0440}
    extraVolumeMounts:
      - {name: e2e-ca, mountPath: /etc/e2e/ca, readOnly: true}
      - {name: e2e-github, mountPath: /etc/e2e/github, readOnly: true}
