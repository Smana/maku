# Source: agent-factory/templates/externalsecrets.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-broker
  namespace: maku
  labels:
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: databaseBroker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: db-broker
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        uri: postgresql://{{ .username }}:{{ .password }}@rooms-rw.db.svc:5432/rooms?sslmode=verify-full&sslrootcert=/etc/room-broker/db-ca/ca.crt
  data:
    - remoteRef:
        key: rooms-cnpg-role-rooms-broker
        property: username
      secretKey: username
    - remoteRef:
        key: rooms-cnpg-role-rooms-broker
        property: password
      secretKey: password
---
# Source: agent-factory/templates/externalsecrets.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-ca
  namespace: maku
  labels:
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: databaseCA
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: db-ca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - remoteRef:
        key: rooms-ca
        property: ca.crt
      secretKey: ca.crt
---
