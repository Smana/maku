apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-owner
  namespace: maku
  labels:
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: databaseOwner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: db-owner
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: maku/rooms-owner
