    resources: [agentruns/finalizers]
    verbs: [update]
  - apiGroups: [maku.ogenki.io]
    resources: [agentruns/status]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [serviceaccounts, configmaps]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: ["agent-model", "agent-git", "agent-git-read"]
