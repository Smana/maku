# Source: agent-factory/charts/maku/templates/agentrun-policies.yaml
# The factory's updates of an AgentRun touch three annotations only: the meter's usage-tokens, the
# pull request and the revoke. Never the spec, never the labels.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: maku-maku-agentrun-factory-patch-limit
  labels:
