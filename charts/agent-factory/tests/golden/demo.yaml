---
# Source: agent-factory/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-factory-api
  namespace: maku
  labels:
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-factory
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: room-broker
      ports:
        - {protocol: TCP, port: 8082}
    # The probes (startup, liveness, readiness) and the metrics are on the named port `ops` (9090):
    # the kubelet and any scraper reach it, so no `from`.
    - ports:
        - {protocol: TCP, port: ops}
    # Port 8080 (intake) is deliberately admitted by no rule: the demo configures no intake.

---
# Source: agent-factory/charts/maku-factory/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-factory
  labels:
    app.kubernetes.io/name: agent-factory
    app.kubernetes.io/version: "0.0.0"
spec:
  minAvailable: 1
  # Readiness ignores GitHub, but a replica can still be unready (caches, a crash loop): a drain
  # must evict it rather than wait for a health that cannot return (#58). Kubernetes 1.27+.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: {app.kubernetes.io/name: agent-factory}

