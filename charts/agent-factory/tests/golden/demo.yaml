apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rooms-db
  namespace: maku
  labels:
    app.kubernetes.io/name: rooms-db
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  serviceName: rooms-db
  selector:
    matchLabels:
      app.kubernetes.io/name: rooms-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rooms-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: rooms-db-passwords, key: postgres}}
            - name: ROOMS_OWNER_PASSWORD
              valueFrom: {secretKeyRef: {name: rooms-db-passwords, key: rooms_owner}}
            - name: ROOMS_BROKER_PASSWORD
              valueFrom: {secretKeyRef: {name: rooms-db-passwords, key: rooms_broker}}
            - name: ROOMS_RETENTION_PASSWORD
              valueFrom: {secretKeyRef: {name: rooms-db-passwords, key: rooms_retention}}
          readinessProbe:
            exec:
              # -h 127.0.0.1: the TCP port, which only the real server opens. Over the socket the
              # entrypoint's init-only server would answer too, and the pod would turn ready early.
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, postgres]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, postgres]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: run
          emptyDir: {}
        - name: init
          configMap:
            name: rooms-db-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

