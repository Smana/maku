# Source: agent-factory/charts/maku-factory/templates/rbac.yaml
# Tasks, their rooms, the stop object, the day ledgers (R50), leader election (§6.5).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-factory
  labels:
    app.kubernetes.io/name: agent-factory
    app.kubernetes.io/version: "0.0.0"
rules:
  - apiGroups: [maku.ogenki.io]
    resources: [tasks]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [maku.ogenki.io]
    resources: [tasks/status]
    verbs: [get, update, patch]
  - apiGroups: [maku.ogenki.io]
    resources: [factories, repositories, mergepolicies]
    verbs: [get, list, watch]
  - apiGroups: [maku.ogenki.io]
    resources: [factories/status, repositories/status, mergepolicies/status]
    verbs: [get, update, patch]
  - apiGroups: [maku.ogenki.io]
    resources: [rooms]
    verbs: [get, list, watch, create, delete]
  # ConfigMaps: the stop object, the meter heartbeat (agent-factory-meter), R50's day ledgers
  # (names carry the date, so resourceNames cannot bound them) and nothing else. The Role's namespace is the bound: the factory can read and
  # write every ConfigMap in it, its own config included, so the namespace holds no ConfigMap it
  # must not touch. watch is for the stop object's cache.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]

