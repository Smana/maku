        roles:
        - implementer
        - reviewer
      trio:
        maxReviewRounds: 2
        roles:
        - implementer
        - reviewer
    tiers:
      frontier:
        model: agent-default
        runMinutes: 90
        runTokens: 4000000
        taskTokens: 8000000
      light:
        model: agent-default
        runMinutes: 20
        runTokens: 300000
        taskTokens: 600000
      standard:
        model: agent-default
