# Source: agent-factory/charts/maku-factory/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-factory
  labels:
    app.kubernetes.io/name: agent-factory
    app.kubernetes.io/version: "0.0.0"
spec:
  minAvailable: 1
  # Readiness ignores GitHub, but a replica can still be unready (caches, a crash loop): a drain
  # must evict it rather than wait for a health that cannot return (#58). Kubernetes 1.27+.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: {app.kubernetes.io/name: agent-factory}

