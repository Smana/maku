# Source: agent-factory/charts/maku/templates/broker-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: room-broker-config
  labels:
    app.kubernetes.io/name: room-broker
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/version: "0.0.0"
data:
  # Strictly decoded by the broker (internal/config): an unknown key fails the rollout. tls is
  # left to its default, /etc/room-broker/tls/tls.{crt,key}, where the Deployment mounts the pair.
  config.yaml: |
    publicURL: "http://localhost:8080"
    runs:
      group: maku.ogenki.io
      namePrefix: run-
      namespace: agents
    runIssuers:
      - subPattern: '^system:serviceaccount:agents:run-([a-z2-7]{8})$'
        mode: tokenreview
    systemIssuer:
      mode: tokenreview
    systemPrincipals:
      system:serviceaccount:maku:agent-factory: system:factory
    factoryURL: "http://agent-factory:8082"
    factoryInsecure: true
    human:
      mode: local
    roomTools:
      auth: tokenreview
      enabled: true
    # The chart's unsafe settings: GET /api/install lists them, and every page shows a banner.
    install:
      unsafe: ["unsafe_allow_runc","network_policy_none"]

