# Source: agent-factory/charts/maku-factory/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-factory-config
  labels:
    app.kubernetes.io/name: agent-factory
    app.kubernetes.io/version: "0.0.0"
data:
  config.yaml: |
    agentsLogin: maku-demo[bot]
    api:
      listen: :8082
    broker:
      caFile: /etc/agent-factory/openbao-ca/ca.crt
      tokenFile: /var/run/secrets/agents/rooms/token
      url: https://room-broker.maku.svc.cluster.local:8443
    caps:
      activeTasks: 3
      awaitingHumanWIP: 5
      concurrentRuns: 2
      maxTextBytes: 14336
      tasksPerDay: 20
    defaults:
      dataClass: public
      predictedClass: review
      template: solo
      tier: standard
    demo: true
    factory: demo
    factoryLogin: maku-demo[bot]
    github:
      appIDFile: /etc/agent-factory-github/app_id
      mergerAppIDFile: /etc/agent-factory-github/app_id
      mergerKeyFile: /etc/agent-factory-github/private_key
      privateKeyFile: /etc/agent-factory-github/private_key
    loops:
      docs-links:
        judge: tier-light
        scope: scoper
      review:
        judge: tier-light
        scope: scoper
    poll:
      issues: 60s
      meter: 30s
      tasks: 30s
    repositories:
    - classes:
        docs-links:
          allowedFiles:
          - ^.+\.(md|mdx|adoc|rst)$
          shadow: true
        revert:
          allowedFiles:
          - ^.+$
          shadow: true
      maintainers:
      - owner
      merge:
        approveToMerge: true
        autoMergesPerDay: 5
        breaker:
          maxReverts: 1
          window: 10
        checkReruns: 1
        fixRuns: 2
        gateStatus: true
        leakScanCheck: ci
        mergerLogin: maku-demo[bot]
        policyBot: false
        requiredChecks:
        - ci
        revertWindow: 168h
        verifyChecks:
        - ci
        verifyFor: 30m
      name: owner/repo
      triggerLabel: factory/ready
    roomsURL: http://localhost:8080
    runs:
      group: maku.ogenki.io
      namePrefix: run-
      namespace: agents
    templates:
      investigate:
        roles:
        - triager
      pair:
        maxReviewRounds: 2
        roles:
        - implementer
        - reviewer
      solo:
        maxReviewRounds: 2
        roles:
        - implementer
        - reviewer
      trio:
        maxReviewRounds: 2
        roles:
        - implementer
        - reviewer
    tiers:
      frontier:
        model: agent-default
        runMinutes: 90
        runTokens: 4000000
        taskTokens: 8000000
      light:
        model: agent-default
        runMinutes: 20
        runTokens: 300000
        taskTokens: 600000
      standard:
        model: agent-default
        runMinutes: 45
        runTokens: 1500000
        taskTokens: 3000000

