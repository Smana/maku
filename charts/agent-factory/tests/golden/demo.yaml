# Source: agent-factory/charts/maku/templates/broker-rbac.yaml
# Exactly the verbs the broker calls: the Room controller reads Rooms, updates their finalizer and
# merge-patches their status; the human API creates (new room, fork); leader election takes a Lease and emits Events.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: room-broker
  labels:
    app.kubernetes.io/name: room-broker
    app.kubernetes.io/part-of: maku
