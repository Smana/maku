    spec:
      serviceAccountName: agent-factory
      automountServiceAccountToken: true  # a controller: it watches Tasks and AgentRuns
      # The factory's drains (manager 20 s, then :9090) fit inside it.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The kubelet gives mounted Secrets this group: with defaultMode 0440 the App key is
        # readable by uid 65532 and nobody else (review C1).
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: agent-factory}}
      containers:
        - name: agent-factory
          image: "ghcr.io/smana/maku-factory:v0.0.0@sha256:0000"
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: FACTORY_CONFIG, value: /etc/agent-factory/config/config.yaml}
          ports:
            - {name: ops, containerPort: 9090, protocol: TCP}
            - {name: api, containerPort: 8082, protocol: TCP}
            - {name: intake, containerPort: 8080, protocol: TCP}
          startupProbe: {httpGet: {path: /startupz, port: ops}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /healthz, port: ops}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: ops}, periodSeconds: 10}
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Sibling mounts, never one inside another's read-only volume.
          volumeMounts:
            - {name: config, mountPath: /etc/agent-factory/config, readOnly: true}
            - {name: broker-ca, mountPath: /etc/agent-factory/openbao-ca, readOnly: true}
            - {name: github, mountPath: /etc/agent-factory-github, readOnly: true}
            - {name: merger, mountPath: /etc/agent-factory-merger, readOnly: true}
            - {name: rooms-token, mountPath: /var/run/secrets/agents/rooms, readOnly: true}
            - {name: intake, mountPath: /etc/agent-factory-intake, readOnly: true}
            - {name: zitadel-reader, mountPath: /etc/agent-factory-zitadel-reader, readOnly: true}
            - {name: sponsored, mountPath: /etc/agent-factory-sponsored, readOnly: true}
      volumes:
        - name: config
          configMap: {name: agent-factory-config}
        - name: broker-ca
          secret: {secretName: openbao-ca, items: [{key: ca.crt, path: ca.crt}]}
        - name: github
          secret: {secretName: agent-factory-github, defaultMode: 0440}
        - name: merger
          # optional: a factory with every class off starts without the merger App (it fails closed); a
          # live or shadow class makes the binary refuse the start when the key is absent: a CrashLoop
          # with a log line, not ContainerCreating (values.yaml: hard prerequisite then).
          secret: {secretName: agent-factory-merger, defaultMode: 0440, optional: true}
        - name: rooms-token
          projected:
            sources:
              - serviceAccountToken: {audience: rooms-system, expirationSeconds: 3600, path: token}
        - name: intake
          # 0440, not the plan's 0400: a 0400 Secret is root-only for uid 65532 — the chart's own
          # render test refuses it (review C1). Group bit plus fsGroup, as the App keys.
          # optional: without the token the intake refuses every request (503), never runs open (#57).
          secret: {secretName: agent-factory-intake, defaultMode: 0440, optional: true}
        - name: zitadel-reader
          # optional: without it the run-request API cannot resolve a caller's GitHub login, and
          # refuses every human run (v2 D4); 0440 with fsGroup, as the other secrets.
          secret: {secretName: agent-factory-zitadel-reader, defaultMode: 0440, optional: true}
        - name: sponsored
          # optional: without it no sponsored client id or project id reads, and every sponsored
          # token is refused; 0440 with fsGroup, as the other secrets.
          secret: {secretName: agent-factory-sponsored, defaultMode: 0440, optional: true}

