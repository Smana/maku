      tokenFile: /var/run/secrets/agents/rooms/token
      url: https://room-broker.maku.svc.cluster.local:8443
    caps:
      activeTasks: 3
      awaitingHumanWIP: 5
      concurrentRuns: 2
      maxTextBytes: 14336
      tasksPerDay: 20
    defaults:
      dataClass: public
      predictedClass: review
      template: solo
      tier: standard
    demo: true
    factory: demo
    factoryLogin: maku-demo[bot]
    github:
      appIDFile: /etc/agent-factory-github/app_id
      mergerAppIDFile: /etc/agent-factory-github/app_id
      mergerKeyFile: /etc/agent-factory-github/private_key
      privateKeyFile: /etc/agent-factory-github/private_key
    loops:
      docs-links:
        judge: tier-light
        scope: scoper
      review:
        judge: tier-light
        scope: scoper
    poll:
      issues: 60s
      meter: 30s
      tasks: 30s
    repositories:
    - classes:
        docs-links:
          allowedFiles:
          - ^.+\.(md|mdx|adoc|rst)$
          shadow: true
