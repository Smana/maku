# Source: agent-factory/charts/maku-factory/templates/rbac.yaml
# AgentRuns: the factory creates them, meters them (annotations only, Kyverno-limited from
# phase 5), and deletes them. Never Secrets, never another namespace's objects, with one exception:
# demo or runTokens.enabled lets the factory keep the run-controller's agent-git and agent-git-read
# Secrets filled with tokens minted from a GitHub App. create cannot be scoped by name in
# Kubernetes; get and update can.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-factory
  namespace: agents
  labels:
    app.kubernetes.io/name: agent-factory
    app.kubernetes.io/version: "0.0.0"
rules:
  - apiGroups: [maku.ogenki.io]
    resources: [agentruns]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [agent-git, agent-git-read]
    verbs: [get, update]

