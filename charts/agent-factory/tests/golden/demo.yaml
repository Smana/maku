              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          image: "cr.agentgateway.dev/controller:v1.6.0@sha256:d84259a7e2d87f8f39bae385d4b032d823c0a4450aecb32e0e31e2258449645b"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9978
              name: grpc-xds-agw
              protocol: TCP
            - containerPort: 9093
              name: health
              protocol: TCP
            - containerPort: 9092
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9093
            initialDelaySeconds: 1
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: 9093
            initialDelaySeconds: 0
            periodSeconds: 1
            
            failureThreshold: 120
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  divisor: "1"
                  resource: limits.memory
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  divisor: "1"
                  resource: limits.cpu
            - name: AGW_PROXY_IMAGE_REGISTRY
              value: cr.agentgateway.dev
            - name: AGW_PROXY_IMAGE_REPOSITORY
              value: agentgateway

            - name: AGW_LOG_LEVEL
              value: "info"
            - name: AGW_XDS_SERVICE_NAME
              value: af-agentgateway
            - name: AGW_AGENTGATEWAY_XDS_SERVICE_PORT
              value: "9978"
            - name: AGW_DISCOVERY_NAMESPACE_SELECTORS
              value: "[]"
            - name: AGW_ENABLE_AGENTGATEWAY_MODELS
              value: "true"
            - name: AGW_XDS_MODE
              value: "tls"
            - name: AGW_GATEWAY_CLASS_PARAMETERS_REFS
              value: "{}"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            limits:
              cpu: "1"
