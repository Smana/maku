            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - {name: config, mountPath: /etc/maku-preflight, readOnly: true}
      volumes:
        - name: config
