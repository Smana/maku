# Source: agent-factory/charts/maku-factory/templates/run-token-policy.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: maku-maku-run-token-secrets
  labels:
    app.kubernetes.io/name: agent-factory
    app.kubernetes.io/version: "0.0.0"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: the-factory
      expression: "request.userInfo.username == 'system:serviceaccount:maku:agent-factory'"
  variables:
    # On DELETE only the old object exists.
    - name: s
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: run
      expression: "variables.s.metadata.name.endsWith('-git') ? variables.s.metadata.name.substring(0, size(variables.s.metadata.name) - 4) : ''"
    - name: labels
      expression: "has(variables.s.metadata.labels) ? variables.s.metadata.labels : {}"
  validations:
    - expression: "variables.s.metadata.name.matches('^run-[a-z2-7]{8}-git$')"
      message: "the factory writes only run token Secrets, <run name>-git (v4 D10)"
    - expression: "variables.labels.exists(k, k == 'app.kubernetes.io/managed-by' && variables.labels[k] == 'maku-factory') && variables.labels.exists(k, k == 'maku.ogenki.io/run' && variables.labels[k] == variables.run)"
      message: "a run token Secret carries the factory's labels"
    - expression: "has(variables.s.metadata.ownerReferences) && variables.s.metadata.ownerReferences.exists(r, r.kind == 'AgentRun' && r.apiVersion.startsWith('maku.ogenki.io/') && r.name == variables.run)"
      message: "a run token Secret is owned by its AgentRun"

