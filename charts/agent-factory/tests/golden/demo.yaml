# (no hostPath), CPU and memory limits on every container, and images from the run-controller's own
# repositories (by digest unless e2e.unpinnedImages). No ephemeral container is ever added (no
# kubectl debug into a run), and a pod's maku.ogenki.io/egress annotation, which the egress proxy
# trusts, never changes after create.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: maku-maku-run-pods
  labels:
    app.kubernetes.io/name: run-controller
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/version: "0.0.0"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: images
      expression: "['ghcr.io/smana/maku-harness', 'ghcr.io/smana/maku-bridge', 'ghcr.io/smana/maku-run-controller']"
    - name: pinned
      expression: "true"
    - name: egress
      expression: "has(object.metadata.annotations) && 'maku.ogenki.io/egress' in object.metadata.annotations ? object.metadata.annotations['maku.ogenki.io/egress'] : ''"
    - name: oldEgress
      expression: "request.operation == 'UPDATE' && has(oldObject.metadata.annotations) && 'maku.ogenki.io/egress' in oldObject.metadata.annotations ? oldObject.metadata.annotations['maku.ogenki.io/egress'] : ''"
  validations:
    - expression: "!has(request.subResource) || request.subResource != 'ephemeralcontainers'"
      message: "a run pod takes no ephemeral container: no kubectl debug into a run"
    - expression: "request.operation != 'CREATE' || request.userInfo.username == 'system:serviceaccount:maku:run-controller'"
      message: "only the run-controller (system:serviceaccount:maku:run-controller) creates pods in agents"
    - expression: "request.operation != 'UPDATE' || variables.egress == variables.oldEgress"
      message: "the maku.ogenki.io/egress annotation is set at create, by the run-controller, and never changes"
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "a run pod sets automountServiceAccountToken: false"
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: "a run pod shares no host namespace: no hostNetwork, hostPID or hostIPC"
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) || has(v.configMap) || has(v.secret) || has(v.projected))
      message: "a run pod mounts only emptyDir, configMap, secret and projected volumes: no hostPath, no persistentVolumeClaim"
    # model.mode gateway (v4 step 4, GW3): a run holds ServiceAccount tokens for the broker, its room
    # tools and the model gateway's aliases only, never one the apiserver or another service accepts,
    # and never the model Secret: no provider key enters the runs namespace.
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) ||
        v.projected.sources.all(s, !has(s.serviceAccountToken) || (has(s.serviceAccountToken.audience) &&
        (s.serviceAccountToken.audience in ['room-broker', 'room-tools'] || s.serviceAccountToken.audience.startsWith('maku-gateway.public.') ||
        s.serviceAccountToken.audience.startsWith('maku-gateway.internal.')))))
      message: "a run pod's projected ServiceAccount tokens are for room-broker, room-tools or maku-gateway.<public|internal>.<alias> only"
    - expression: >-
        (!has(object.spec.volumes) || object.spec.volumes.all(v, (!has(v.secret) || v.secret.secretName != 'agent-model') &&
        (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(p, !has(p.secret) || p.secret.name != 'agent-model')))) &&
        variables.containers.all(c, (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || e.valueFrom.secretKeyRef.name != 'agent-model')) &&
        (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef) || f.secretRef.name != 'agent-model')))
      message: "model.mode gateway: a run pod never reads the model Secret agent-model (volume, projected source, env or envFrom); the gateway holds the keys"
    - expression: "!has(object.spec.ephemeralContainers)"
      message: "a run pod takes no ephemeral container: no kubectl debug into a run"
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)
      message: "a run pod's containers are never privileged"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation)
      message: "every container of a run pod sets allowPrivilegeEscalation: false"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop &&
        (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0))
      message: "every container of a run pod drops ALL capabilities and adds none"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem)
      message: "every container of a run pod sets readOnlyRootFilesystem: true"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) ? c.securityContext.runAsNonRoot :
        has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot)
      message: "every container of a run pod runs as non-root (runAsNonRoot: true)"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.seccompProfile) ?
        c.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost'] :
        has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost'])
      message: "every container of a run pod has a RuntimeDefault or Localhost seccomp profile"
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits) && 'cpu' in c.resources.limits)
      message: "every container of a run pod sets limits.cpu"
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: "every container of a run pod sets limits.memory"
    - expression: >-
        variables.containers.all(c, (c.image.split('@')[0].lastIndexOf(':') > c.image.split('@')[0].lastIndexOf('/') ?
        c.image.split('@')[0].substring(0, c.image.split('@')[0].lastIndexOf(':')) : c.image.split('@')[0]) in variables.images)
      message: "a run pod's images come from ghcr.io/smana/maku-harness, ghcr.io/smana/maku-bridge, ghcr.io/smana/maku-run-controller (runController.images, runController.image, runPodPolicy.extraImages)"
    - expression: "!variables.pinned || variables.containers.all(c, c.image.contains('@sha256:'))"
      message: "a run pod's images are pinned by digest (@sha256:)"

