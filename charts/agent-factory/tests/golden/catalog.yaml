apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: deps-patch
  namespace: maku
  labels:
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
    maku.ogenki.io/catalog: "true"
spec:
  author:
    adopt:
      branches:
        - ^renovate/
      logins:
        - renovate[bot]
