apiVersion: maku.ogenki.io/v1alpha1
kind: Routine
metadata:
  name: dead-links
  namespace: maku
  labels:
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
    maku.ogenki.io/catalog: "true"
spec:
  breaker:
    maxConsecutiveClosed: 3
    maxConsecutiveFailures: 3
    minMergeRate: 0.25
    minSamples: 5
    window: 10
  cooldown: 24h
  dataClass: public
  defaultPrompt: Fix the dead external links listed below, updating or removing broken URLs while keeping documentation accurate. If no links can be verified or fixed cleanly, make no changes.
  description: Fix dead links reported by the link-check oracle.
  maxCostUSD: 1
  maxOpenPRs: 1
  probe:
    kind: dead-links
    maxFindings: 10
    requireConsecutive: 2
  protectedPaths:
    - ^\.github/agent-factory/
  requires:
    - oracleClass
  workflow: quick
---
