apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: factory-slack-events
  namespace: maku
  labels:
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - name: public
      namespace: infra
      sectionName: factory-slack
  hostnames:
    - factory-slack.example.test
  rules:
    # Exactly POST /slack/events: every other path and method on this host is the gateway's 404.
    - matches:
        - path: {type: Exact, value: /slack/events}
          method: POST
      backendRefs:
        - name: factory-slack-app
          port: 8080
