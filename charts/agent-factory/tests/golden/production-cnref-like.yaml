# Source: agent-factory/charts/maku/templates/broker-cnp.yaml
# Default deny; one allow per flow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: room-broker
  labels:
    app.kubernetes.io/name: room-broker
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/version: "0.0.0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: room-broker
  ingress:
    # Run bridges; a run's own CNP opens the matching egress.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents
          matchExpressions:
            - {key: agents.ogenki.io/run-id, operator: Exists}
      toPorts:
        - ports: [{port: "8443", protocol: TCP}]
    # Kubelet's probes.
    - fromEntities: [host]
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
    # The factory's system API calls (its rooms-system token).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agent-factory
            io.kubernetes.pod.namespace: agent-system
      toPorts:
        - ports: [{port: "8443", protocol: TCP}]
    # The human listener, from the web front door alone (the umbrella's rooms-web-proxy): it sets
    # the identity headers the broker reads, so nothing may reach :8080 around it. The Slack App,
    # which calls /mcp with its own bearer, is admitted by maku-slack's room-broker-from-factory-slack-app.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: rooms-web-proxy
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
          rules:
            dns: [{matchPattern: "*"}]
    # The Room and AgentRun watches, the leader lease and token reviews.
    # Cilium applies L4 policy after service translation: kubernetes.default:443 is the control
    # plane's own port (6443 on kind) by then, hence apiServerPorts.
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
          matchExpressions:
            - {key: cnpg.io/cluster, operator: Exists}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
    # start_run: POST /v1/runs to factoryURL.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agent-factory
            io.kubernetes.pod.namespace: agent-system
      toPorts:
        - ports: [{port: "8082", protocol: TCP}]
    # The planner and the classifier: the model gateway's clients listener (broker.modelGateway).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            gateway.networking.k8s.io/gateway-name: model-gateway
      toPorts:
        - ports: [{port: "8082", protocol: TCP}]
    # broker.webhooks (EX9): a cluster subscriber, its URL's port on its pods only.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: factory-slack-app
            io.kubernetes.pod.namespace: agent-system
      toPorts:
        - ports: [{port: "8081", protocol: TCP}]
    # broker.webhooks (EX9): a cluster subscriber, its URL's port on its pods only.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: runlore
            io.kubernetes.pod.namespace: runlore
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
---
