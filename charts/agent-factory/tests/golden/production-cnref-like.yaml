# Source: agent-factory/charts/maku/templates/agentrun-policies.yaml
# The factory's updates of an AgentRun touch three annotations only: the meter's usage-tokens, the
# pull request and the revoke. Never the spec, never the labels.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: maku-agent-system-agentrun-factory-patch-limit
  labels:
    app.kubernetes.io/name: room-broker
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/version: "0.0.0"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["maku.ogenki.io"]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [agentruns]
  matchConditions:
    - name: the-factory
      expression: "request.userInfo.username == 'system:serviceaccount:agent-system:agent-factory'"
  variables:
    - name: allowed
      expression: "['agents.ogenki.io/usage-tokens', 'agents.ogenki.io/pull-request', 'agents.ogenki.io/revoked']"
    - name: new
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: old
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
  validations:
    - expression: "object.spec == oldObject.spec"
      message: "the factory never changes an AgentRun's spec"
    - expression: "(has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})"
      message: "the factory never changes an AgentRun's labels"
    - expression: >-
        variables.new.all(k, k in variables.allowed || (k in variables.old && variables.old[k] == variables.new[k])) && variables.old.all(k, k in variables.allowed || k in variables.new)
      message: "the factory changes only the usage-tokens, pull-request and revoked annotations"
