    resources: [rooms/status]
    verbs: [patch]
  - apiGroups: [maku.ogenki.io]
    resources: [rooms/finalizers]
    verbs: [update]
  # Coordination parents (v4 MR13): the human API reads a parent, its lineage and the day ledgers
