# Source: agent-factory/charts/maku-gateway/templates/policies-identity.yaml
# Listener public: the caller's projected ServiceAccount token, verified offline against this
# cluster's issuer, must carry `exp` and `sub` (a sub-less token would share one rate-limit bucket),
# the subject below, and an audience starting "maku-gateway.public."; each route then
# requires its own audience. Audiences are checked in CEL, not in the provider's audience
# list, which agentgateway caps at eight. The token is removed before any backend (preserveToken
# off), and x-ar-agent is REPLACED with the verified sub.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: model-gateway-listener-public
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: agent-factory
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: model-gateway
      sectionName: public
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: https://container.googleapis.com/v1/projects/p/locations/l/clusters/c
          jwks:
            remote:
              url: https://container.googleapis.com/v1/projects/p/locations/l/clusters/c/jwks
          validation:
            requiredClaims:
              - exp
              - sub
    authorization:
      action: Require
      policy:
        matchExpressions:
          - 'jwt.sub.matches("^system:serviceaccount:agents:xplane-run-[a-z2-7]{8}$")'
          - 'jwt.aud.exists(a, a.startsWith("maku-gateway.public."))'
    transformation:
      request:
        set:
          - name: x-ar-agent
            value: jwt.sub
      # The gateway's own 429 (a budget a later step adds) comes with an empty body, which the
      # harness would log as a bare RateLimitError: name the cause. Only the gateway's own 429 lacks
      # a content-type; a provider's keeps its body. No response.body read: streams stay unbuffered.
      response:
        body: >-
          response.code == 429 && !("content-type" in response.headers) ? {"error": {"type": "rate_limit_error", "code": "gateway_budget_exhausted", "message": "the model gateway refused this call: a gateway budget is spent (limit " + default(response.headers["x-ratelimit-limit"], "unknown") + ", resets in " + default(response.headers["x-ratelimit-reset"], "unknown") + " s). Not retryable."}} : null
    # A long completion must not time out.
    timeouts:
      request: 600s
