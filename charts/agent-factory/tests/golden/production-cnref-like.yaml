# Source: agent-factory/templates/expose.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rooms-web
  namespace: agent-system
  labels:
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - name: platform-tailscale-general
      namespace: infrastructure
      sectionName: https
  hostnames:
    - rooms.priv.example.test
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        # oauth2-proxy sets the identity headers, so a client may not bring its own, nor forwarded
        # headers a proxy might trust. Gateway API's remove takes exact names, no wildcards;
        # oauth2-proxy overwrites the identity headers again behind this route.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Forwarded-Access-Token
              - X-Forwarded-User
              - X-Forwarded-Email
              - X-Forwarded-Groups
              - X-Forwarded-Preferred-Username
              - X-Auth-Request-User
              - X-Auth-Request-Email
              - X-Auth-Request-Preferred-Username
              - X-Auth-Request-Groups
              - X-Auth-Request-Access-Token
              - X-Forwarded-Uri
              - X-Forwarded-Host
              - X-Forwarded-Proto
      backendRefs:
        - name: rooms-web-proxy
          port: 80
      timeouts:
        request: 0s
---
