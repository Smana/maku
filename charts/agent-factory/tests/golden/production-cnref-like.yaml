# Source: agent-factory/charts/maku/templates/broker-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: room-broker-config
  labels:
    app.kubernetes.io/name: room-broker
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/version: "0.0.0"
data:
  # Strictly decoded by the broker (internal/config): an unknown key fails the rollout. tls is
  # left to its default, /etc/room-broker/tls/tls.{crt,key}, where the Deployment mounts the pair.
  config.yaml: |
    publicURL: "https://rooms.priv.example.test"
    runs:
      group: maku.ogenki.io
      namePrefix: xplane-run-
      namespace: agents
    runIssuers:
      - subPattern: '^system:serviceaccount:agents:xplane-run-([a-z2-7]{8})$'
        issuer: "https://container.googleapis.com/v1/projects/p/locations/l/clusters/c"
        jwksURL: "https://container.googleapis.com/v1/projects/p/locations/l/clusters/c/jwks"
    systemIssuer:
      issuer: https://container.googleapis.com/v1/projects/p/locations/l/clusters/c
      jwksURL: https://container.googleapis.com/v1/projects/p/locations/l/clusters/c/jwks
    systemPrincipals:
      system:serviceaccount:agent-system:agent-factory: system:factory
    factoryURL: "http://agent-factory.agent-system.svc.cluster.local:8082"
    factoryInsecure: true
    human:
      access:
        readerFile: /etc/room-broker/zitadel-reader/reader.json
        ttl: 5m
      clientIDFile: /etc/room-broker/oidc/web-client-id
      dashboards:
      - label: Room metrics
        url: https://grafana.priv.example.test/d/agent-room/agent-room?var-room={room}
      - label: Run
        url: https://grafana.priv.example.test/d/agent-run/agent-run?var-run={run}
      groups:
        admin: agents-admin
        member: agents-member
      intake:
        plan:
          apiKeyFile: /var/run/secrets/maku/model-gateway/planner
          classes:
            docs:
              ceilingUSD: 2
              roles:
              - scoper
              - implementer
              - reviewer
              source: class:docs.taskUSD
            docs-links:
              ceilingUSD: 2
              roles:
              - scoper
              - implementer
              - reviewer
              source: class:docs-links.taskUSD
            review:
              ceilingUSD: 2
              roles:
              - implementer
              - reviewer
              source: class:review.taskUSD
            scripts:
              ceilingUSD: 5.1
              roles:
              - scoper
              - implementer
              - reviewer
              source: class:scripts.taskUSD
          dailyPlans: 50
          deadline: 20s
          enabled: true
          fallback: "off"
          reasoningEffort: low
          repositories:
          - Smana/ai-native-ref
          - Smana/runlore-kb
          - Smana/runlore
          - Smana/cloud-native-ref
          url: http://model-gateway.agent-system.svc.cluster.local:8082/clients/planner/v1
      issuer: https://auth.example.test
      jwksURL: https://auth.example.test/oauth/v2/keys
      mcp:
        enabled: true
        sessionStart: []
        sponsored:
        - clientIDFile: /etc/room-broker/sponsored/slack-app-client-id
          name: slack-app
      needs:
        enabled: true
      origin: https://rooms.priv.example.test
      preset: zitadel
      projectIDFile: /etc/room-broker/oidc/project-id
      roomctlClientIDFile: /etc/room-broker/oidc/cli-client-id
      slackDecide:
        principal: slack-app
        teamID: T07J97G2K2P
      slackLink:
        principal: slack-app
        repository: Smana/ai-native-ref
        teamID: T07J97G2K2P
    roomTools:
      enabled: true
    suspend:
      after: 5m
      enabled: true
    policyManagement:
      operators:
      - Smana
      promotion: true
    webhooks:
      - events:
        - room.task_triaged
        - room.waiting_for_human
        - room.pr_opened
        - room.verdict_posted
        - room.merged
        - room.reverted
        - room.budget_reached
        - room.ended
        - room.approval_closed
        generation: 1
        name: slack-app
        network: cluster
        repositories:
        - Smana/ai-native-ref
        - Smana/cloud-native-ref
        - Smana/runlore
        - Smana/runlore-kb
        secretFile: /etc/room-broker/webhooks/slack-app/signing-key
        url: http://factory-slack-app.agent-system.svc.cluster.local:8081/webhooks
      - events:
        - room.task_received
        - room.task_triaged
        - room.run_started
        - room.run_ended
        - room.waiting_for_human
        - room.pr_opened
        - room.verdict_posted
        - room.merged
        - room.reverted
        - room.monitor_verdict
        - room.budget_reached
        - room.ended
        name: runlore
        network: cluster
        repositories:
        - Smana/cloud-native-ref
        secretFile: /etc/room-broker/webhooks/runlore/signing-key
        url: http://runlore.runlore.svc.cluster.local:8080/factory/webhook
