# Source: agent-factory/charts/maku/templates/run-controller-rbac.yaml
# Everything in the runs namespace. A run's pod, ServiceAccount, ConfigMaps and CNP are created
# and read back (the ownership check); the pod is also deleted (revoke); Secrets are read by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: run-controller
  namespace: agents
  labels:
    app.kubernetes.io/name: run-controller
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/version: "0.0.0"
rules:
  - apiGroups: [maku.ogenki.io]
    resources: [agentruns]
    verbs: [get, list, watch]
  # The pod's ownerReference sets blockOwnerDeletion, which OwnerReferencesPermissionEnforcement
  # authorizes as update on the owner's finalizers.
  - apiGroups: [maku.ogenki.io]
    resources: [agentruns/finalizers]
    verbs: [update]
  - apiGroups: [maku.ogenki.io]
    resources: [agentruns/status]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [serviceaccounts, configmaps]
    verbs: [get, create]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: ["agent-git", "agent-git-read"]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
