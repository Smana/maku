# Source: agent-factory/templates/monitoring-rules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: maku
  namespace: agent-system
  labels:
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: maku-rooms
      rules:
        - alert: RoomBrokerDown
          annotations:
            dashboard: /d/agent-room
            description: Runs keep working and their bridges buffer, but nothing reaches the room log. kubectl get pods -n agent-system -l app.kubernetes.io/name=room-broker
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: No room-broker replica is up
          expr: absent(up{job="room-broker", namespace="agent-system"} == 1)
          for: 5m
          labels:
            severity: warning
        - alert: RoomLogAppendErrors
          annotations:
            dashboard: /d/agent-room
            description: 'The rooms database refuses writes the broker sends it. Check the database the broker''s DSN names, and the broker''s log: kubectl logs -n agent-system -l app.kubernetes.io/name=room-broker | grep -i append'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: The room log is refusing appends
          expr: sum(increase(maku_rooms_append_errors_total[10m])) > 0
          for: 10m
          labels:
            severity: warning
        - alert: RoomRedactionsSpike
          annotations:
            dashboard: /d/agent-room
            description: 'An agent is handling credentials. Read the rooms with the newest redactions: SELECT room_id, seq, redactions FROM events WHERE redactions <> ''{}'' ORDER BY ts DESC LIMIT 20'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: More than 20 secrets redacted from room logs in 15 minutes
          expr: sum(increase(maku_rooms_redactions_total[15m])) > 20
          labels:
            severity: warning
        - alert: RoomStalled
          annotations:
            dashboard: /d/agent-room
            description: 'The run is Running but silent, and the room shows AwaitingHuman. Find its run: kubectl get agentrun -n agents -o custom-columns=RUN:.metadata.name,ROOM:.spec.roomRef | grep {{ $labels.room }}, then read its bridge: kubectl logs -n agents <the run''s pod> -c room-bridge'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: Room {{ $labels.room }} has a running run and no event for 30 minutes
          expr: time() - max by (room) (maku_rooms_last_event_timestamp_seconds) > 1800
          labels:
            severity: warning
        - alert: RoomBridgeHarnessStalled
          annotations:
            dashboard: /d/agent-room
            description: 'The bridge''s cursor holds and its room was told a harness_error with code {{ $labels.reason }}, so the transcript stops there. List room runs: kubectl get agentrun -n agents -o custom-columns=RUN:.metadata.name,ROOM:.spec.roomRef, then read the bridge: kubectl logs -n agents <the run''s pod> -c room-bridge'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: A bridge cannot move past the harness log ({{ $labels.reason }})
          expr: sum by (reason) (increase(maku_rooms_bridge_harness_stalls_total[10m])) > 0
          labels:
            severity: warning
        - alert: RoomBridgeItemsRefused
          annotations:
            dashboard: /d/agent-room
            description: 'The broker answered 400 to a lone item: the bridge and the broker disagree on the envelope. Read the broker''s refusals: kubectl logs -n agent-system -l app.kubernetes.io/name=room-broker | grep ''bridge item refused'''
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: The broker refused harness items, kept as stubs in the room log
          expr: sum(increase(maku_rooms_bridge_items_stubbed_total{reason="refused"}[10m])) > 0
          labels:
            severity: warning
        - alert: RoomBridgeItemsUnstorable
          annotations:
            dashboard: /d/agent-room
            description: 'invalid_value: the store rejected a value; key_collision: keys collide once redacted. Neither loses the slot. Read the broker: kubectl logs -n agent-system -l app.kubernetes.io/name=room-broker | grep -E ''payload refused by the database|keys collide once redacted'''
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: Harness items were kept as stubs ({{ $labels.reason }})
          expr: sum by (reason) (increase(maku_rooms_bridge_items_stubbed_total{reason=~"invalid_value|key_collision"}[1h])) > 0
          labels:
            severity: info
        - alert: RoomAuthnJWKSStale
          annotations:
            dashboard: /d/agent-room
            description: 'At 24 hours its held keys stop verifying and every token from that issuer is refused. Check the broker''s egress to the issuer: kubectl logs -n agent-system -l app.kubernetes.io/name=room-broker | grep jwks'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: The broker has not refreshed {{ $labels.issuer }}'s JWKS for 6 hours
          expr: time() - max by (issuer) (maku_rooms_authn_jwks_last_refresh_timestamp_seconds) > 6 * 3600
          for: 5m
          labels:
            severity: warning
        - alert: RoomAuthnHumanIssuerNeverFetched
          annotations:
            dashboard: /d/agent-room
            description: 'Every human is refused until it does. Check the broker''s egress to https://auth.example.test: kubectl logs -n agent-system -l app.kubernetes.io/name=room-broker | grep jwks'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: The broker has never fetched the human issuer's JWKS
          expr: absent(maku_rooms_authn_jwks_last_refresh_timestamp_seconds{issuer="https://auth.example.test"}) and on () (sum(up{job="room-broker", namespace="agent-system"}) > 0)
          for: 30m
          labels:
            severity: warning
        - alert: RoomRejectedActionsSpike
          annotations:
            dashboard: /d/agent-room
            description: 'A client is probing the role matrix, or a UI bug is sending actions a role cannot take. Break down by reason: sum by (reason) (increase(maku_rooms_rejected_actions_total[10m]))'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: The broker refused more than 30 actions in 10 minutes
          expr: sum(increase(maku_rooms_rejected_actions_total[10m])) > 30
          labels:
            severity: warning
        - alert: RoomVerdictsNotReachingGitHub
          annotations:
            dashboard: /d/agent-room
            description: 'They stay in the room and the factory still reads them there. Check the broker''s GitHub App key and its egress to api.github.com, then the broker log: kubectl logs -n agent-system -l app.kubernetes.io/name=room-broker | grep -i verdict'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: Agents' review verdicts have not reached GitHub for 30 minutes
          expr: sum(increase(maku_rooms_verdict_posts_total{result="error"}[20m])) > 0 unless sum(increase(maku_rooms_verdict_posts_total{result="posted"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
        - alert: RoomApprovalPendingTooLong
          annotations:
            dashboard: /d/agent-room
            description: A run is parked, keeping its sandbox and spending no tokens. Open the room and decide; unattended rooms auto-deny at spec.approvals.ttl.
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#room-alerts
            summary: An approval has waited more than 15 minutes
          expr: max(maku_rooms_approvals_oldest_pending_seconds) > 900
          labels:
            severity: warning
        - alert: RoomWebhookDisabled
          annotations:
            dashboard: /d/agent-factory
            description: 'Three deliveries were given up. Fix the receiver (its key, or the service behind it), bump generation on the webhooks entry in the broker''s config and restart the broker: a webhooks change applies only at restart. The events of the disabled window are not replayed.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#webhooks
            summary: 'The broker disabled its webhook subscriber {{ $labels.subscriber }}: its events are not delivered'
          expr: max by (subscriber) (maku_rooms_webhook_disabled) == 1
          for: 1m
          labels:
            severity: warning
        - alert: RoomBrokerSchemaUnverified
          annotations:
            dashboard: /d/agent-room
            description: 'The broker''s role cannot read the migration ledger, so nothing checks that the schema matches the broker''s image. Set broker.database.ownerSecret: the first migrate adopts the Atlas operator''s ledger and this clears. A future release refuses to serve without it.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/database.md#a-ledger-the-broker-cannot-read
            summary: The broker serves a schema whose version it cannot read
          expr: max(maku_rooms_schema_unverified{namespace="agent-system"}) == 1
          for: 15m
          labels:
            severity: warning
    - name: maku-factory
      rules:
        - alert: AgentFactoryIntakeErrors
          annotations:
            dashboard: /d/agent-factory
            description: 'Labelled issues are not becoming tasks. Only the leader polls, so read every replica: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep ''poll failed''. A 401 from GitHub means the factory App key or installation changed.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#factory-alerts
            summary: The agent factory has failed to poll its triggers for 15 minutes
          expr: sum(rate(maku_factory_intake_errors_total[5m])) > 0
          for: 15m
          labels:
            severity: warning
        - alert: AgentFactoryAutoMergeReverted
          annotations:
            dashboard: /d/agent-factory
            description: 'Unless the revert PR carries factory/drill (a drill: the breaker does not count it, and this alert fires on the planned drill too), its class is paused by the breaker until clean mature merges lift it (recoverAfter). Read why on the task: kubectl get task -n agent-system -o wide | grep Reverted'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#factory-alerts
            summary: A merged agent PR was reverted
          expr: sum(increase(maku_factory_pr_outcomes_total{outcome="reverted"}[15m])) > 0
          labels:
            severity: warning
        - alert: AgentFactoryMergeRegression
          annotations:
            dashboard: /d/agent-factory
            description: The class is demoted at its next decision; nothing was reverted. The PR carries factory/monitor:regression and the monitor's comment says which signal.
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#factory-alerts
            summary: The post-merge monitor found a regression after a {{ $labels.class }} merge
          expr: sum by (class, repository) (increase(maku_factory_monitor_verdicts_total{verdict="regression"}[15m])) > 0
          labels:
            severity: warning
        - alert: AgentFactoryClassPausedLong
          annotations:
            dashboard: /d/agent-factory
            description: 'The breaker holds the class. Three clean mature merges lift it (recoverAfter); factory/drill lifts it only if added before factory/revert. Read the window: scripts/shadow-merge-tally.sh --repo {{ $labels.repository }} --class {{ $labels.class }} --outcomes --since <date> in Smana/maku. The gauge keeps its last value, so a class with no monitor can stay at 1 after it recovered, and a shadow or unarmed class''s pause is inert: check the class''s mode and recent PRs before acting.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#factory-alerts
            summary: '{{ $labels.class }} on {{ $labels.repository }} has been paused for 7 days'
          expr: max by (repository, class) (maku_factory_class_paused{class!=""}) == 1
          for: 7d
          labels:
            severity: warning
        - alert: AgentFactoryDailyBudgetHigh
          annotations:
            dashboard: /d/agent-factory
            description: Past the cap, runs are refused (429) or revoked with budget-principal once budgets.enforcePrincipal is on; until then nothing is refused and AgentPersonCapShadowRefusal fires instead. The caps are budgets.factoryDailyUSD and humanDailyUSD. Resets at 00:00 UTC.
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#budget-signals
            summary: '{{ $labels.principal }} has spent more than 80 % of today''s budget in USD'
          expr: maku_factory_budget_spent_usd / maku_factory_budget_cap_usd > 0.8
          for: 5m
          labels:
            severity: warning
        - alert: AgentPersonCapShadowRefusal
          annotations:
            dashboard: /d/agent-factory
            description: 'Shadow only: nothing was refused. It is a false refusal if the run should have been admitted (wrong person charged, or a day filled by reservations the meter later released). Read the day''s ledger, in micro-USD: kubectl get cm -n agent-system agent-factory-ledger-usd-<YYYYMMDD> -o yaml'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#budget-signals
            summary: '{{ $labels.principal }}''s day is spent: a run was admitted that enforcePrincipal would refuse'
          expr: sum by (principal) (increase(maku_factory_run_revocations_total{reason="budget-principal-shadow"}[15m])) > 0
          labels:
            severity: info
        - alert: AgentFactoryTaskStuck
          annotations:
            dashboard: /d/agent-factory
            description: kubectl get task -n agent-system {{ $labels.task }} -o yaml; the factory's logs carry task.id={{ $labels.task }}.
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#factory-alerts
            summary: Agent factory task {{ $labels.task }} has been {{ $labels.phase }} for over 2 hours
          expr: max by (task, phase) (maku_factory_task_phase_seconds{phase=~"Received|Triaged|Implementing|Reviewing|AwaitingCI|AutoMerging|Verifying"}) > 7200
          for: 5m
          labels:
            severity: warning
        - alert: AgentFactoryKillSwitchEngaged
          annotations:
            dashboard: /d/agent-factory
            description: 'Resume: kubectl -n agent-system delete configmap agent-factory-stop, and remove factory/stop from the control issue.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#escalated-tasks-and-the-kill-switch
            summary: The agent factory's stop is engaged
          expr: max(maku_factory_kill_switch_engaged) == 1
          labels:
            severity: info
        - alert: FactoryGitHubUnreachable
          annotations:
            dashboard: /d/agent-factory
            description: 'No task advances while GitHub is unreachable, and the replicas stay Ready. Check githubstatus.com, then the App key: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep -i github. The loops recover by themselves when GitHub returns.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#factory-failures
            summary: Agent factory replica {{ $labels.pod }} has not reached GitHub for 10 minutes
          expr: maku_factory_github_up == 0
          for: 10m
          labels:
            severity: warning
        - alert: AgentFactoryMeterBlind
          annotations:
            dashboard: /d/agent-factory
            description: 'With budgets.enforcePrincipal on, new runs are refused (503 meter_blind) and Queued tasks wait with waiting_meter_blind; active runs continue to their deadline and are revoked on recovery. Read the leader''s logs: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep -i meter'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#budget-signals
            summary: The agent factory's meter has not read token usage for over 5 minutes
          expr: (time() - max(maku_factory_meter_last_success_timestamp_seconds) > 300) or absent(maku_factory_meter_last_success_timestamp_seconds)
          for: 1m
          labels:
            severity: warning
        - alert: AgentFactoryRepositoryNotOwned
          annotations:
            dashboard: /d/agent-factory
            description: 'Its .github/agent-factory.yaml on the default branch is absent, unparsable, or names another factory (a read failing for 15 minutes counts too): no intake, schedules, API runs or merges there. Check the file, then: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep -i fence'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#factory-alerts
            summary: The agent factory does not own {{ $labels.repository }}
          expr: max by (repository) (maku_factory_repository_owned) == 0
          for: 20m
          labels:
            severity: warning
        - alert: AgentFactoryCoordinationRecoveryRequired
          annotations:
            dashboard: /d/agent-factory
            description: The parent proposes exactly one next action and never takes it itself. Open the parent's room page and act on it, or revise the plan. kubectl get task -n agent-system -o wide | grep Coordinating
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#coordination
            summary: A coordination family on {{ $labels.repository }} has waited on its recovery for over 15 minutes
          expr: max by (repository) (maku_factory_coordination_recovery_age_seconds) > 900
          labels:
            severity: warning
        - alert: AgentFactoryCoordinationIntegrationFailed
          annotations:
            dashboard: /d/agent-factory
            description: 'The dependent merge stays held (beforeDependentMerge) or the parent stays incomplete (final); the parent proposes one recovery. checks_failed: the exact heads do not work together. infrastructure_failed: the integration Task escalated, resume it within the plan''s maxRuns. kubectl get task -n agent-system -o wide | grep Coordinating'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#coordination
            summary: A {{ $labels.purpose }} integration run on {{ $labels.repository }} ended {{ $labels.result }}
          expr: sum by (repository, purpose, result) (clamp_min(maku_factory_coordination_integration_runs_total{result=~"checks_failed|infrastructure_failed"} - (maku_factory_coordination_integration_runs_total offset 15m or maku_factory_coordination_integration_runs_total * 0), 0)) > 0
          labels:
            severity: warning
        - alert: AgentFactoryCoordinationAuthorizationLost
          annotations:
            dashboard: /d/agent-factory
            description: New admission there and in its dependents stops; existing per-repository gates still decide current work. Restore the fence, the App installation, the maintainer's write or the class, then a maintainer of {{ $labels.repository }} authorizes the child again (authorize_child), or revise the plan. A refusal at filing (no child Task yet) is a plan that never had the authority. kubectl get task -n agent-system -o wide | grep Coordinating
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#coordination
            summary: 'Coordination on {{ $labels.repository }} was refused: {{ $labels.reason }}'
          expr: sum by (repository, reason) (clamp_min(maku_factory_coordination_admission_refusals_total{reason=~"repository_permission|repository_not_owned|app_unavailable|class_not_allowed|policy_changed"} - (maku_factory_coordination_admission_refusals_total offset 15m or maku_factory_coordination_admission_refusals_total * 0), 0)) > 0
          labels:
            severity: warning
        - alert: AgentFactoryCoordinationStalled
          annotations:
            dashboard: /d/agent-factory
            description: 'A parent is Coordinating with no family filed or done, plan version, integration run or ended wait on that primary in 24 hours. It usually waits on a person: a confirmation, a child authorization or the one recovery the parent page shows. kubectl get task -n agent-system -o wide | grep Coordinating, then the parent''s room page.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#coordination
            summary: No coordination family on {{ $labels.repository }} has changed state for 24 hours
          expr: |
            (sum by (repository) (maku_factory_tasks{phase="Coordinating"}) > 0)
            unless on (repository) (
                 sum by (repository) (clamp_min(maku_factory_coordination_families_total - (maku_factory_coordination_families_total offset 24h or maku_factory_coordination_families_total * 0), 0)) > 0
              or sum by (repository) (clamp_min(maku_factory_coordination_plan_versions_total - (maku_factory_coordination_plan_versions_total offset 24h or maku_factory_coordination_plan_versions_total * 0), 0)) > 0
              or sum by (repository) (clamp_min(maku_factory_coordination_integration_runs_total - (maku_factory_coordination_integration_runs_total offset 24h or maku_factory_coordination_integration_runs_total * 0), 0)) > 0
              or sum by (repository) (clamp_min(maku_factory_coordination_wait_seconds_count - (maku_factory_coordination_wait_seconds_count offset 24h or maku_factory_coordination_wait_seconds_count * 0), 0)) > 0
            )
          for: 15m
          labels:
            severity: warning
        - alert: AgentModelUnpriced
          annotations:
            dashboard: /d/agent-factory
            description: 'Add its row to the factory''s meter.prices, from the provider''s list price (input, cacheRead, output, and cacheWrite where the provider bills it). Until then its runs are capped in tokens. The leader''s log names each run: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep ''without a price'''
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#budget-signals
            summary: Model {{ $labels.model }} served agent runs without a price
          expr: sum by (model) (increase(maku_factory_meter_unpriced_model_runs_total[1h])) > 0
          labels:
            severity: warning
        - alert: AgentMeterInputExcludesCache
          annotations:
            dashboard: /d/agent-factory
            description: 'The meter priced those runs right, as fresh input. Any cost computed from the gateway''s own token counters under-counts them. A gateway path or the provider changed its usage shape. The leader''s log names each run: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep ''without its cache tokens'''
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#budget-signals
            summary: A gateway counted {{ $labels.model }}'s input without its cache tokens
          expr: sum by (model) (clamp_min(maku_factory_meter_input_excludes_cache_runs_total - (maku_factory_meter_input_excludes_cache_runs_total offset 1h or maku_factory_meter_input_excludes_cache_runs_total * 0), 0)) > 0
          labels:
            severity: warning
        - alert: FactoryAgentMerged
          annotations:
            dashboard: /d/agent-factory
            description: Find it in the factory's error log (the agents App merged a pull request), check the ruleset requires maku/merge-gate from the posting App, that the agents App is not one of its bypass actors and that no run holds a person's token, and review the merged change.
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#factory-alerts
            summary: An agent token merged a pull request on {{ $labels.repository }} past the factory's own merge
          expr: sum by (repository) (clamp_min(maku_factory_pr_outcomes_total{outcome="agent_merged"} - (maku_factory_pr_outcomes_total{outcome="agent_merged"} offset 15m or maku_factory_pr_outcomes_total{outcome="agent_merged"} * 0), 0)) > 0
          labels:
            severity: warning
        - alert: FactoryMergeGateNotRequired
          annotations:
            dashboard: /d/agent-factory
            description: 'The default branch no longer requires maku/merge-gate from the App that posts it, so a merge can bypass the factory''s gate. Restore the rule: docs/factory.md, branch protection for the merge gate.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#factory-alerts
            summary: '{{ $labels.repository }}''s ruleset no longer requires maku/merge-gate'
          expr: min by (repository) (maku_factory_merge_gate_required) == 0
          for: 30m
          labels:
            severity: warning
        - alert: AgentFactoryPrivateCodeUnacknowledged
          annotations:
            dashboard: /d/agent-factory
            description: 'A Repository serving private code needs spec.privateCode.acknowledged: true, which states the code is sent to the configured models. Until it is set, the factory starts no new task there; tasks already started finish. Set the field on the Repository, or stop serving it.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/factory.md#private-code
            summary: '{{ $labels.repository }} is private code without spec.privateCode.acknowledged: it is refused new tasks'
          expr: max by (repository) (maku_factory_private_code_unacknowledged) == 1
          for: 15m
          labels:
            severity: warning
        - alert: FactoryMergeGateRulesUnread
          annotations:
            dashboard: /d/agent-factory
            description: 'maku_factory_merge_gate_required is stale meanwhile. The factory''s log names the failed read: the merger App id file, the repository, or the branch rules.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#factory-alerts
            summary: The factory cannot read whether {{ $labels.repository }} requires maku/merge-gate
          expr: sum by (repository) (increase(maku_factory_merge_gate_rules_unread_total[30m])) > 0
          for: 30m
          labels:
            severity: warning
    - name: maku-run-path
      rules:
        - alert: RunControllerPreflightFailing
          annotations:
            dashboard: /d/agent-fleet
            description: 'New runs end Failed (PreflightFailed) or wait Pending until the check passes; runs that already have a pod are untouched. The run-controller logs the check and its fix: kubectl logs -n agent-system -l app.kubernetes.io/name=run-controller | grep ''preflight failed'''
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#the-run-controllers-preflight
            summary: The run-controller's {{ $labels.check }} preflight has refused new runs for 10 minutes
          expr: min by (check) (maku_run_controller_preflight_passed) == 0
          for: 10m
          labels:
            severity: warning
        - alert: RunControllerDown
          annotations:
            dashboard: /d/agent-fleet
            description: No run starts, ends or is cleaned up while it is down; running pods keep running. kubectl get pods -n agent-system -l app.kubernetes.io/name=run-controller
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#run-path-alerts
            summary: The run-controller is not up
          expr: absent(up{job="run-controller", namespace="agent-system"} == 1)
          for: 5m
          labels:
            severity: warning
    - name: maku-slack
      rules:
        - alert: SlackDecisionsSpike
          annotations:
            dashboard: /d/agent-factory
            description: 'The metric carries only {result, decision}, so this aggregate stands in for a per-person clause: six approvals in ten minutes from anywhere is already worth reading. Take the broker''s ''slack decision'' lines for those decisions (team, approval, user, result, decision) and the room log for the approvals they closed. An unexpected burst is the shape of a compromised App pod casting decisions as linked humans. Check the rooms'' policies too: no forge.push approval should be decided from Slack in an unattended room.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#slack-alerts
            summary: More than five forge.push approvals were decided from Slack in ten minutes
          expr: sum(increase(maku_rooms_slack_decisions_total{result="approved"}[10m])) > 5
          labels:
            severity: warning
        - alert: SlackCardUpdatesFailing
          annotations:
            dashboard: /d/agent-factory
            description: 'The cards are then lying about being live. maku_slack_app_requests_total carries {route, outcome} and no approval id, so one flapping card and a hundred failures read the same: take the App''s ''card update failed'' lines (approval, channel, err) to tell them apart. Causes: a revoked chat:write, a removed message, Slack refusing metadata. The decisions themselves still land: the store, not the card, is the fence.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#slack-alerts
            summary: The Slack App has failed an approval-card update for an hour
          expr: sum(rate(maku_slack_app_requests_total{route=~"interactions|webhooks", outcome="error"}[10m])) > 0
          for: 1h
          labels:
            severity: warning
    - name: maku-gateway
      rules:
        - alert: AgentRouterMetricContractBroken
          annotations:
            dashboard: /d/agent-gateway
            description: An agentgateway upgrade renamed a token metric or a token type the factory's meter.query reads. The run meter, the budgets and the run page read zero or misprice until meter.query follows. Compare the gateway's /metrics on :15020 with docs/gateway.md, metering the runs.
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#gateway-alerts
            summary: The model gateway serves model calls the meter's token contract does not see
          expr: (sum(increase(agentgateway_requests_total{job="model-gateway", namespace="agent-system", status="200", route=~".*/maku-(models|clients)-.+", route!~".*/maku-models-[a-z]+-list"}[15m])) > 0 unless sum(increase(agentgateway_gen_ai_client_token_usage_count{job="model-gateway", namespace="agent-system"}[15m])) > 0) or count(agentgateway_gen_ai_client_token_usage_sum{job="model-gateway", namespace="agent-system", gen_ai_token_type!~"input|output|input_cache_read|input_cache_write"}) > 0
          for: 15m
          labels:
            severity: warning
        - alert: AgentGateway5xxRatioHigh
          annotations:
            dashboard: /d/agent-gateway
            description: 'Split by route and reason: sum by (route, reason) (rate(agentgateway_requests_total{status=~"5.."}[10m])). UpstreamFailure or Timeout is the provider, Internal is the proxy.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#gateway-alerts
            summary: The model gateway answers {{ $value | humanizePercentage }} of requests with a 5xx
          expr: sum(rate(agentgateway_requests_total{job="model-gateway", namespace="agent-system", status=~"5.."}[10m])) / sum(rate(agentgateway_requests_total{job="model-gateway", namespace="agent-system"}[10m])) > 0.05 and sum(increase(agentgateway_requests_total{job="model-gateway", namespace="agent-system", status=~"5.."}[10m])) > 5
          for: 10m
          labels:
            severity: warning
        - alert: AgentGatewayModelErrorRatioHigh
          annotations:
            dashboard: /d/agent-gateway
            description: 'The provider is failing or refusing. The access log''s http.status and error fields name the cause: kubectl logs -n agent-system -l gateway.networking.k8s.io/gateway-name=model-gateway'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#gateway-alerts
            summary: '{{ $value | humanizePercentage }} of model calls through the model gateway fail'
          expr: sum(rate(agentgateway_gen_ai_server_request_duration_count{job="model-gateway", namespace="agent-system", error_type=~".+"}[10m])) / sum(rate(agentgateway_gen_ai_server_request_duration_count{job="model-gateway", namespace="agent-system"}[10m])) > 0.1
          for: 10m
          labels:
            severity: warning
        - alert: AgentGatewayUnauthorizedBurst
          annotations:
            dashboard: /d/agent-gateway
            description: 'Invalid tokens, a wrong audience, or a subject outside the runs namespace: replayed or foreign tokens, or a caller whose token projection broke. kubectl logs -n agent-system -l gateway.networking.k8s.io/gateway-name=model-gateway | grep -E ''JwtAuth|Authorization'''
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#gateway-alerts
            summary: The model gateway refused {{ $value }} requests in 5 minutes
          expr: sum(increase(agentgateway_requests_total{job="model-gateway", namespace="agent-system", reason=~"JwtAuth|Authorization"}[5m])) > 20
          labels:
            severity: warning
        - alert: AgentGatewayCostUnpriced
          annotations:
            dashboard: /d/agent-gateway
            description: 'A catalog lookup other than Exact adds nothing to the gateway''s cost counter. Missing or Unpriced: the model has no row in the catalog (maku-factory.config.meter.prices, or maku-gateway.modelCatalog.prices). NoCatalog: the catalog is not mounted on the proxy.'
            runbook_url: https://github.com/Smana/maku/blob/v0.0.0/docs/operations.md#gateway-alerts
            summary: The model gateway could not price {{ $labels.gen_ai_request_model }} ({{ $labels.status }}) for {{ $labels.ar_agent }}
          expr: sum by (ar_agent, gen_ai_request_model, status) (increase(agentgateway_cost_catalog_lookups_total{job="model-gateway", namespace="agent-system", status!="Exact"}[15m])) > 0
          labels:
            severity: warning
