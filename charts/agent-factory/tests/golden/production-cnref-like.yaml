# Source: agent-factory/charts/maku/templates/run-controller-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: run-controller-config
  labels:
    app.kubernetes.io/name: run-controller
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/version: "0.0.0"
data:
  # Strictly decoded by the controller (runctl.LoadConfig). namespace and namePrefix come from
  # `runs` alone, as the broker's do. The broker URL must be the FQDN: the run pod's resolver
  # would otherwise try search-path names its CNP refuses.
  config.yaml: |
    namespace: "agents"
    namePrefix: "xplane-run-"
    runtimeClassName: "gvisor"
    allowUnsandboxed: false
    # Runs call the model gateway with their own projected token (v4 step 4, GW3): no provider key
    # enters the runs namespace, and modelSecret is not read.
    model:
      mode: gateway
      gateway:
        url: "http://model-gateway.agent-system.svc.cluster.local"
        ports: {public: 8080, internal: 8081}
        audiencePrefix: "maku-gateway"
        serviceAccount: {namespace: "agent-system", name: run-controller}
        aliases:
          public: ["agent-default","kimi-frontier","mistral-light","mistral-standard","tier-frontier","tier-light","tier-standard"]
          internal: ["agent-default","tier-frontier","tier-light","tier-standard"]
    gitSecret: "agent-git"
    gitReadSecret: "agent-git-read"
    broker:
      url: "https://room-broker.agent-system.svc.cluster.local:8443"
      namespace: "agent-system"
      # Only the stable selector label: runctl copies every label into each run CNP once, so a
      # version label would cut in-flight runs off from the broker on upgrade.
      labels: {app.kubernetes.io/name: room-broker}
      caSecret: "room-broker-ca"
    images:
      harness: "ghcr.io/smana/maku-harness:v0.0.0@sha256:0000"
      bridge: "ghcr.io/smana/maku-bridge:v0.0.0@sha256:0000"
---
# Source: agent-factory/charts/slack/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-slack-app-config
  namespace: agent-system
  labels:
    app.kubernetes.io/name: factory-slack-app
    app.kubernetes.io/part-of: agent-factory
    app.kubernetes.io/managed-by: Helm
data:
  # Strictly decoded by the App (internal/slackapp): an unknown key fails its start. Read once at
  # start: the Deployment's checksum rolls the pod on a change.
  config.yaml: |
    botTokenFile: /etc/factory-slack-app/slack/bot-token
    botUserIDFile: /etc/factory-slack-app/slack/bot-user-id
    brokerURL: http://room-broker.agent-system.svc.cluster.local:8080
    channels:
      C0123ABCD:
        approvals: true
        maxCostUSD: 2
        repositories:
        - Smana/cloud-native-ref
    clientIDFile: /etc/factory-slack-app/principal/client-id
    clientSecretFile: /etc/factory-slack-app/principal/client-secret
    issuerURL: https://auth.example.test
    namespace: agent-system
    projectIDFile: /etc/factory-slack-app/principal/project-id
    proposals:
      enabled: true
    roomsURL: https://rooms.priv.example.test
    signingSecretFile: /etc/factory-slack-app/slack/signing-secret
    teamID: T07J97G2K2P
    webhookKeyFile: /etc/factory-slack-app/webhook/signing-key
