# Test-only values for render.sh's ExternalSecrets golden (v4 D14): the demo with the bundled
# Postgres off, and an ExternalSecret for each kind of seam. The store names a throwaway.
postgres:
  enabled: false
maku:
  broker:
    database:
      brokerSecret: db-broker
      ownerSecret: db-owner
      caSecret: db-ca
externalSecrets:
  enabled: true
  storeRef: {kind: SecretStore, name: agents-secrets}
  secrets:
    # OpenBao: one property per key.
    intake:
      data:
        - {secretKey: token, remoteRef: {key: maku/runlore-intake, property: token}}
    # CNPG: the role Secret's username and password, assembled into a DSN.
    databaseBroker:
      data:
        - {secretKey: username, remoteRef: {key: rooms-cnpg-role-rooms-broker, property: username}}
        - {secretKey: password, remoteRef: {key: rooms-cnpg-role-rooms-broker, property: password}}
      template:
        data:
          uri: "postgresql://{{ .username }}:{{ .password }}@rooms-rw.db.svc:5432/rooms?sslmode=verify-full&sslrootcert=/etc/room-broker/db-ca/ca.crt"
    databaseOwner:
      dataFrom:
        - extract: {key: maku/rooms-owner}
    databaseCA:
      data:
        - {secretKey: ca.crt, remoteRef: {key: rooms-ca, property: ca.crt}}
      refreshInterval: 24h
