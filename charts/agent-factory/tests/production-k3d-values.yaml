# Test-only values for task chart:production:k3d (identity.sh PROFILE=production; v4 step 6, Task 21),
# layered on identity-values.yaml, identity-link-values.yaml and expose-values.yaml: the production
# defaults on k3d, every seam named. The sandbox is a test-only RuntimeClass gvisor whose handler is runc (no run
# starts), the humans' issuer is the in-cluster e2e stub, Postgres is a plain postgres:16 outside the
# chart, and the factory's GitHub is the stub. Every id, key and endpoint belongs to the throwaway cluster.
maku:
  enabled: true
  # Only the factory creates AgentRuns: it mints a token for every run it can account for (plan PR4).
  agentRunPolicies:
    creators: ["system:serviceaccount:maku:agent-factory"]
    factoryServiceAccount: agent-factory
  sandbox: {runtimeClassName: gvisor}
  # The runs namespace exists before the factory is installed alone (its Role lives there), as on a
  # platform that owns it: the script creates it.
  createRunsNamespace: false
  networkPolicies:
    kubernetes:
      metricsFrom: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  broker:
    # k3s's issuer is not reachable from a pod: the apiserver vouches for the runs and the factory.
    runIssuer: {mode: tokenreview}
    systemIssuer: {mode: tokenreview}
    systemPrincipals:
      "system:serviceaccount:maku:agent-factory": system:factory
    factoryURL: http://agent-factory.maku.svc.cluster.local:8082
    factoryInsecure: true
    database:
      brokerSecret: rooms-broker-dsn
      ownerSecret: rooms-owner-dsn
      retentionSecret: rooms-retention-dsn
      # pg.external-db, outside the release: k3s's pod network.
      egress: {cidrs: [10.42.0.0/16]}
  runController:
    model:
      mode: gateway
      gateway:
        service: model-gateway
        namespace: ai
        aliases: {public: [agent-default], internal: []}
maku-factory:
  enabled: true
  replicas: 1
  apps:
    factory: {existingSecret: agent-factory-github}
    # The agents App mints each run's token (D10, D12): v4 step 8 removed the shared agent-git writer.
    agents: {existingSecret: agent-factory-agents}
    merger: {mode: factory}
  runTokens: {enabled: true, perRun: true}
  extraEnv:
    - {name: ROOMS_GITHUB_API_URL, value: https://e2e-stub.e2e.svc.cluster.local/}
    - {name: SSL_CERT_FILE, value: /etc/e2e/ca/ca.crt}
  extraVolumes:
    - name: e2e-ca
      secret: {secretName: e2e-stub-ca, defaultMode: 0440}
  extraVolumeMounts:
    - {name: e2e-ca, mountPath: /etc/e2e/ca, readOnly: true}
  config:
    factory: production-e2e
    factoryLogin: maku-demo[bot]
    agentsLogin: maku-demo-agents[bot]
    roomsURL: https://rooms.e2e.test
    broker:
      url: https://room-broker.maku.svc.cluster.local:8443
      caFile: /etc/agent-factory/openbao-ca/ca.crt
      tokenFile: /var/run/secrets/agents/rooms/token
    runs: {group: maku.ogenki.io, namespace: agents, namePrefix: run-, gatewayIdentity: true}
    github:
      appIDFile: /etc/agent-factory-github/app_id
      privateKeyFile: /etc/agent-factory-github/private_key
    api:
      listen: ":8082"
      humanIssuer: https://e2e-stub.e2e.svc.cluster.local
      preset: generic
      tokenUse: id
      rolesClaim: groups
      groups: {admin: agents-admin, member: agents-member}
      clientIDFiles: [/etc/agent-factory-oidc/web-client-id, /etc/agent-factory-oidc/cli-client-id]
    poll: {issues: 60s, tasks: 30s, meter: 30s}
    # Outside the demo the factory prices runs from a meter: one that answers nothing here (no run starts).
    meter:
      url: http://vm.monitoring.svc.cluster.local:8428
      query: sum by (ar_agent, gen_ai_request_model, gen_ai_token_type) (gen_ai_client_token_usage_sum)
      throttle:
        promQuery: 'sum(rate(agentgateway_requests_total{status="429"}[2m]))'
    defaults: {template: solo, tier: standard, dataClass: public, predictedClass: review}
    loops:
      review: {scope: scoper, judge: tier-light}
      docs-links: {scope: scoper, judge: tier-light}
    repositories:
      - name: owner/repo
        maintainers: [dev]
        triggerLabel: factory/ready
        classes:
          docs-links: {shadow: true, allowedFiles: ['^.+\.(md|mdx|adoc|rst)$']}
          revert: {shadow: true, allowedFiles: ['^.+$']}
        merge:
          requiredChecks: [ci]
          verifyChecks: [ci]
          leakScanCheck: ci
          gateStatus: true
          policyBot: false
          mergerLogin: maku-demo[bot]
          autoMergesPerDay: 5
          fixRuns: 2
          checkReruns: 1
          verifyFor: 30m
          revertWindow: 168h
          breaker: {window: 10, maxReverts: 1}
    tiers:
      light: {model: agent-default, runTokens: 300000, taskTokens: 600000, runMinutes: 20}
      standard: {model: agent-default, runTokens: 1500000, taskTokens: 3000000, runMinutes: 45}
      frontier: {model: agent-default, runTokens: 4000000, taskTokens: 8000000, runMinutes: 90}
    templates:
      solo: {roles: [implementer, reviewer], maxReviewRounds: 2}
      pair: {roles: [implementer, reviewer], maxReviewRounds: 2}
      trio: {roles: [implementer, reviewer], maxReviewRounds: 2}
      investigate: {roles: [triager]}
    caps: {activeTasks: 3, concurrentRuns: 2, tasksPerDay: 20, maxTextBytes: 14336, awaitingHumanWIP: 5}
monitoring:
  serviceMonitor: {enabled: true}
  prometheusRule: {enabled: true}
  dashboards: {enabled: true}
