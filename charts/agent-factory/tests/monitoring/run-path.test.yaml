# maku-run-path under promtool: one case per rule. The up series carry the job the chart's PodMonitors
# set (run-controller, egress-proxy).
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # RunControllerPreflightFailing: one check refusing for 10 minutes; the others passing.
  - interval: 1m
    input_series:
      - {series: 'maku_run_controller_preflight_passed{check="network", pod="run-controller-0"}', values: '1x5 0x20'}
      - {series: 'maku_run_controller_preflight_passed{check="runtimeClass", pod="run-controller-0"}', values: '1x25'}
    alert_rule_test:
      - {eval_time: 14m, alertname: RunControllerPreflightFailing, exp_alerts: []}
      - {eval_time: 17m, alertname: RunControllerPreflightFailing, exp_alerts: [{exp_labels: {severity: warning, check: network}}]}
  # RunControllerDown and EgressProxyDown: up, then down; pending 5 minutes, then firing.
  - interval: 1m
    input_series:
      - {series: 'up{job="run-controller", namespace="maku", instance="a"}', values: '1x5 0x15'}
      - {series: 'up{job="egress-proxy", namespace="maku", instance="b"}', values: '1x5 0x15'}
      - {series: 'up{job="egress-proxy", namespace="maku", instance="c"}', values: '1x20'}
    alert_rule_test:
      - {eval_time: 9m, alertname: RunControllerDown, exp_alerts: []}
      - {eval_time: 12m, alertname: RunControllerDown, exp_alerts: [{exp_labels: {severity: warning}}]}
      - {eval_time: 12m, alertname: EgressProxyDown, exp_alerts: []}
  - interval: 1m
    input_series:
      - {series: 'up{job="egress-proxy", namespace="maku", instance="b"}', values: '1x5 0x15'}
    alert_rule_test:
      - {eval_time: 9m, alertname: EgressProxyDown, exp_alerts: []}
      - {eval_time: 12m, alertname: EgressProxyDown, exp_alerts: [{exp_labels: {severity: warning}}]}
  # AgentSandboxPodPending: a run pod Pending 15 minutes in the runs namespace; another namespace's
  # pod is not a run.
  - interval: 1m
    input_series:
      - {series: 'kube_pod_status_phase{namespace="agents", pod="run-a", phase="Pending"}', values: '1x30'}
      - {series: 'kube_pod_status_phase{namespace="default", pod="web", phase="Pending"}', values: '1x30'}
    alert_rule_test:
      - {eval_time: 14m, alertname: AgentSandboxPodPending, exp_alerts: []}
      - {eval_time: 16m, alertname: AgentSandboxPodPending, exp_alerts: [{exp_labels: {severity: warning, pod: run-a}}]}
