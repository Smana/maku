# maku-slack under promtool, ported from ai-native-ref's test-agent-factory-slack-alerts.sh at
# 1529b3b. The boundary is exact: a burst that starts from zero inside the window leaves increase()
# nothing to extrapolate on that edge, so five approvals in ten minutes read 5 and stay silent under
# `> 5`, and six read 6 and fire.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - {series: 'maku_rooms_slack_decisions_total{namespace="maku", pod="room-broker-0", result="approved", decision="approve"}', values: '0x10 5x40'}
    alert_rule_test:
      - {eval_time: 10m, alertname: SlackDecisionsSpike, exp_alerts: []}
      - {eval_time: 15m, alertname: SlackDecisionsSpike, exp_alerts: []}
      - {eval_time: 21m, alertname: SlackDecisionsSpike, exp_alerts: []}
  # Six in ten minutes fires, and resolves once the burst has aged out.
  - interval: 1m
    input_series:
      - {series: 'maku_rooms_slack_decisions_total{namespace="maku", pod="room-broker-0", result="approved", decision="approve"}', values: '0x10 6x40'}
    alert_rule_test:
      - {eval_time: 10m, alertname: SlackDecisionsSpike, exp_alerts: []}
      - {eval_time: 15m, alertname: SlackDecisionsSpike, exp_alerts: [{exp_labels: {severity: warning}}]}
      - {eval_time: 22m, alertname: SlackDecisionsSpike, exp_alerts: []}
  # A card update failing: one route's errors hold the alert pending for the hour, so a single
  # flapping card never pages, and an hour of them does.
  - interval: 1m
    input_series:
      - {series: 'maku_slack_app_requests_total{namespace="maku", pod="factory-slack-app-0", route="interactions", outcome="error"}', values: '0x20 1+1x100'}
    alert_rule_test:
      - {eval_time: 19m, alertname: SlackCardUpdatesFailing, exp_alerts: []}
      - {eval_time: 75m, alertname: SlackCardUpdatesFailing, exp_alerts: []}
      - {eval_time: 90m, alertname: SlackCardUpdatesFailing, exp_alerts: [{exp_labels: {severity: warning}}]}
  # The same hour on the webhook route, which the expression's route regex must also cover.
  - interval: 1m
    input_series:
      - {series: 'maku_slack_app_requests_total{namespace="maku", pod="factory-slack-app-0", route="webhooks", outcome="error"}', values: '0x20 1+1x100'}
    alert_rule_test:
      - {eval_time: 75m, alertname: SlackCardUpdatesFailing, exp_alerts: []}
      - {eval_time: 90m, alertname: SlackCardUpdatesFailing, exp_alerts: [{exp_labels: {severity: warning}}]}
  # A route outside the regex (events) never fires.
  - interval: 1m
    input_series:
      - {series: 'maku_slack_app_requests_total{namespace="maku", pod="factory-slack-app-0", route="events", outcome="error"}', values: '0x20 1+1x100'}
    alert_rule_test:
      - {eval_time: 90m, alertname: SlackCardUpdatesFailing, exp_alerts: []}
