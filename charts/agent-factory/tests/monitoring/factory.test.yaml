# maku-factory under promtool, but coordination (coordination.test.yaml). Ported from ai-native-ref at
# 1529b3b: test-agent-factory-budget-alerts.sh, test-agent-merge-regression-alert.sh and
# test-agent-class-paused-alert.sh (now any class but the empty one). The rest is one case per rule.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # AgentFactoryDailyBudgetHigh: the fleet's day, $42.50: $34.00 is exactly 80% and stays silent,
  # $34.01 fires after 5 minutes. A person past their $8.50 (unclamped, 110%) fires. The meter's
  # day-start 0 resolves both.
  - interval: 30s
    input_series:
      - {series: 'maku_factory_budget_cap_usd{namespace="maku", pod="agent-factory-0", principal="system:factory"}', values: '42.5x60'}
      - {series: 'maku_factory_budget_spent_usd{namespace="maku", pod="agent-factory-0", principal="system:factory"}', values: '34x20 34.01x30 0x10'}
      - {series: 'maku_factory_budget_cap_usd{namespace="maku", pod="agent-factory-0", principal="github:alice"}', values: '8.5x60'}
      - {series: 'maku_factory_budget_spent_usd{namespace="maku", pod="agent-factory-0", principal="github:alice"}', values: '2x20 9.35x30 0x10'}
      - {series: 'maku_factory_budget_cap_usd{namespace="maku", pod="agent-factory-0", principal="github:bob"}', values: '8.5x60'}
      - {series: 'maku_factory_budget_spent_usd{namespace="maku", pod="agent-factory-0", principal="github:bob"}', values: '6.8x60'}
    alert_rule_test:
      - {eval_time: 9m, alertname: AgentFactoryDailyBudgetHigh, exp_alerts: []}
      - {eval_time: 14m, alertname: AgentFactoryDailyBudgetHigh, exp_alerts: []}
      - eval_time: 16m
        alertname: AgentFactoryDailyBudgetHigh
        exp_alerts:
          - exp_labels: {severity: warning, namespace: maku, pod: agent-factory-0, principal: "system:factory"}
          - exp_labels: {severity: warning, namespace: maku, pod: agent-factory-0, principal: "github:alice"}
      - {eval_time: 26m, alertname: AgentFactoryDailyBudgetHigh, exp_alerts: []}
  # AgentFactoryMergeRegression: one regression verdict fires; healthy and inconclusive never do.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_monitor_verdicts_total{class="dead-links", repository="o/r", verdict="regression"}', values: '0 0 1 1 1'}
      - {series: 'maku_factory_monitor_verdicts_total{class="dead-links", repository="o/r", verdict="healthy"}', values: '0 1 2 3 4'}
    alert_rule_test:
      - {eval_time: 3m, alertname: AgentFactoryMergeRegression, exp_alerts: [{exp_labels: {severity: warning, class: dead-links, repository: o/r}}]}
  - interval: 1m
    input_series:
      - {series: 'maku_factory_monitor_verdicts_total{class="dead-links", repository="o/r", verdict="inconclusive"}', values: '0 1 2 3 4'}
    alert_rule_test:
      - {eval_time: 3m, alertname: AgentFactoryMergeRegression, exp_alerts: []}
  # AgentFactoryClassPausedLong: any class held 7 days fires, in any repository; the empty class, a
  # class paused under 7 days and one that read clear do not.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_class_paused{repository="o/r", class="docs-links"}', values: '1x10100'}
      - {series: 'maku_factory_class_paused{repository="o/other", class="revert"}', values: '1x10100'}
      - {series: 'maku_factory_class_paused{repository="o/r", class=""}', values: '1x10100'}
      - {series: 'maku_factory_class_paused{repository="o/r", class="tests"}', values: '0x2000 1x8100'}
      - {series: 'maku_factory_class_paused{repository="o/r", class="alert-rules"}', values: '1x5000 0x5100'}
    alert_rule_test:
      - {eval_time: 6d, alertname: AgentFactoryClassPausedLong, exp_alerts: []}
      - eval_time: 7d1m
        alertname: AgentFactoryClassPausedLong
        exp_alerts:
          - exp_labels: {severity: warning, repository: o/r, class: docs-links}
          - exp_labels: {severity: warning, repository: o/other, class: revert}
  # AgentFactoryIntakeErrors: polls failing for 15 minutes.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_intake_errors_total{source="issues"}', values: '0x5 1+1x40'}
    alert_rule_test:
      - {eval_time: 18m, alertname: AgentFactoryIntakeErrors, exp_alerts: []}
      - {eval_time: 25m, alertname: AgentFactoryIntakeErrors, exp_alerts: [{exp_labels: {severity: warning}}]}
  # AgentFactoryAutoMergeReverted: one revert fires; a merge does not.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_pr_outcomes_total{class="revert", repository="o/r", principal="system:factory", outcome="reverted"}', values: '0 0 1 1 1'}
    alert_rule_test:
      - {eval_time: 3m, alertname: AgentFactoryAutoMergeReverted, exp_alerts: [{exp_labels: {severity: warning}}]}
  - interval: 1m
    input_series:
      - {series: 'maku_factory_pr_outcomes_total{class="revert", repository="o/r", principal="system:factory", outcome="auto_merged"}', values: '0 0 1 1 1'}
    alert_rule_test:
      - {eval_time: 3m, alertname: AgentFactoryAutoMergeReverted, exp_alerts: []}
      - {eval_time: 3m, alertname: FactoryAgentMerged, exp_alerts: []}
  # FactoryAgentMerged: the counter is born at its first increment, and that first merge fires
  # (compared with 15 minutes ago, absence read as 0); it resolves once the window has passed.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_pr_outcomes_total{class="", repository="o/r", principal="system:factory", outcome="agent_merged"}', values: '_ _ 1x30'}
    alert_rule_test:
      - {eval_time: 1m, alertname: FactoryAgentMerged, exp_alerts: []}
      - {eval_time: 3m, alertname: FactoryAgentMerged, exp_alerts: [{exp_labels: {severity: warning, repository: o/r}}]}
      - {eval_time: 20m, alertname: FactoryAgentMerged, exp_alerts: []}
  # FactoryMergeGateNotRequired: the rule dropped for 30 minutes; another repository still requires it.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_merge_gate_required{repository="o/r", pod="agent-factory-0"}', values: '1x5 0x40'}
      - {series: 'maku_factory_merge_gate_required{repository="o/other", pod="agent-factory-0"}', values: '1x45'}
    alert_rule_test:
      - {eval_time: 30m, alertname: FactoryMergeGateNotRequired, exp_alerts: []}
      - {eval_time: 37m, alertname: FactoryMergeGateNotRequired, exp_alerts: [{exp_labels: {severity: warning, repository: o/r}}]}
  # FactoryMergeGateRulesUnread: reads failing for 30 minutes.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_merge_gate_rules_unread_total{repository="o/r"}', values: '0x5 1+1x60'}
    alert_rule_test:
      - {eval_time: 34m, alertname: FactoryMergeGateRulesUnread, exp_alerts: []}
      - {eval_time: 40m, alertname: FactoryMergeGateRulesUnread, exp_alerts: [{exp_labels: {severity: warning, repository: o/r}}]}
  # AgentFactoryPrivateCodeUnacknowledged: private code unacknowledged for 15 minutes; an
  # acknowledged or public repository never (v4 D3).
  - interval: 1m
    input_series:
      - {series: 'maku_factory_private_code_unacknowledged{repository="o/r", pod="agent-factory-0"}', values: '0x5 1x30'}
      - {series: 'maku_factory_private_code_unacknowledged{repository="o/public", pod="agent-factory-0"}', values: '0x35'}
    alert_rule_test:
      - {eval_time: 19m, alertname: AgentFactoryPrivateCodeUnacknowledged, exp_alerts: []}
      - {eval_time: 21m, alertname: AgentFactoryPrivateCodeUnacknowledged, exp_alerts: [{exp_labels: {severity: warning, repository: o/r}}]}
  # AgentPersonCapShadowRefusal: a would-be refusal, by principal; an enforced refusal is not one.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_run_revocations_total{principal="github:alice", reason="budget-principal-shadow"}', values: '0 0 1 1'}
      - {series: 'maku_factory_run_revocations_total{principal="github:bob", reason="budget-principal"}', values: '0 0 1 1'}
    alert_rule_test:
      - {eval_time: 3m, alertname: AgentPersonCapShadowRefusal, exp_alerts: [{exp_labels: {severity: info, principal: "github:alice"}}]}
  # AgentFactoryTaskStuck: Implementing past 2 hours for 5 minutes; a waiting phase never.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_task_phase_seconds{task="t1", phase="Implementing"}', values: '7000+100x20'}
      - {series: 'maku_factory_task_phase_seconds{task="t2", phase="AwaitingHuman"}', values: '9000x20'}
    alert_rule_test:
      - {eval_time: 6m, alertname: AgentFactoryTaskStuck, exp_alerts: []}
      - {eval_time: 9m, alertname: AgentFactoryTaskStuck, exp_alerts: [{exp_labels: {severity: warning, task: t1, phase: Implementing}}]}
  # AgentFactoryKillSwitchEngaged.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_kill_switch_engaged{pod="agent-factory-0"}', values: '0 1 1'}
    alert_rule_test:
      - {eval_time: 0m, alertname: AgentFactoryKillSwitchEngaged, exp_alerts: []}
      - {eval_time: 1m, alertname: AgentFactoryKillSwitchEngaged, exp_alerts: [{exp_labels: {severity: info}}]}
  # FactoryGitHubUnreachable: per replica, 10 minutes.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_github_up{pod="agent-factory-0"}', values: '1x5 0x20'}
      - {series: 'maku_factory_github_up{pod="agent-factory-1"}', values: '1x25'}
    alert_rule_test:
      - {eval_time: 14m, alertname: FactoryGitHubUnreachable, exp_alerts: []}
      - {eval_time: 17m, alertname: FactoryGitHubUnreachable, exp_alerts: [{exp_labels: {severity: warning, pod: agent-factory-0}}]}
  # AgentFactoryMeterBlind: a fresh heartbeat is silent; a stale one fires a minute past 5 minutes;
  # no heartbeat at all fires too.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_meter_last_success_timestamp_seconds{pod="agent-factory-0"}', values: '0+60x20'}
    alert_rule_test:
      - {eval_time: 15m, alertname: AgentFactoryMeterBlind, exp_alerts: []}
  - interval: 1m
    input_series:
      - {series: 'maku_factory_meter_last_success_timestamp_seconds{pod="agent-factory-0"}', values: '0x20'}
    alert_rule_test:
      - {eval_time: 5m, alertname: AgentFactoryMeterBlind, exp_alerts: []}
      - {eval_time: 8m, alertname: AgentFactoryMeterBlind, exp_alerts: [{exp_labels: {severity: warning}}]}
  - interval: 1m
    input_series:
      - {series: 'maku_factory_github_up{pod="agent-factory-0"}', values: '1x5'}
    alert_rule_test:
      - {eval_time: 2m, alertname: AgentFactoryMeterBlind, exp_alerts: [{exp_labels: {severity: warning}}]}
  # AgentFactoryRepositoryNotOwned: 20 minutes on every replica; one replica owning it is enough.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_repository_owned{repository="o/r", pod="agent-factory-0"}', values: '0x30'}
      - {series: 'maku_factory_repository_owned{repository="o/other", pod="agent-factory-0"}', values: '0x30'}
      - {series: 'maku_factory_repository_owned{repository="o/other", pod="agent-factory-1"}', values: '1x30'}
    alert_rule_test:
      - {eval_time: 19m, alertname: AgentFactoryRepositoryNotOwned, exp_alerts: []}
      - {eval_time: 21m, alertname: AgentFactoryRepositoryNotOwned, exp_alerts: [{exp_labels: {severity: warning, repository: o/r}}]}
  # AgentModelUnpriced: a run served without a price, by model.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_meter_unpriced_model_runs_total{model="m"}', values: '0 0 1 1'}
    alert_rule_test:
      - {eval_time: 3m, alertname: AgentModelUnpriced, exp_alerts: [{exp_labels: {severity: warning, model: m}}]}
  # AgentMeterInputExcludesCache: born at its first increment, which fires; quiet an hour later.
  - interval: 1m
    input_series:
      - {series: 'maku_factory_meter_input_excludes_cache_runs_total{model="m"}', values: '_ _ 1x80'}
    alert_rule_test:
      - {eval_time: 3m, alertname: AgentMeterInputExcludesCache, exp_alerts: [{exp_labels: {severity: warning, model: m}}]}
      - {eval_time: 70m, alertname: AgentMeterInputExcludesCache, exp_alerts: []}
