{{- include "afumbrella.gate" . -}}
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: rooms-db-init
  namespace: {{ .Release.Namespace }}
  labels: {{- include "afumbrella.labels" . | nindent 4 }}
data:
  # Runs once, on an empty data directory. The migration GRANTs to rooms_broker and rooms_retention,
  # so both must exist first; rooms_owner owns the database and has no CREATEROLE.
  # PG 15+ no longer lets a plain role CREATE in `public`.
  init.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<SQL
    CREATE ROLE rooms_owner LOGIN PASSWORD '${ROOMS_OWNER_PASSWORD}';
    CREATE ROLE rooms_broker LOGIN PASSWORD '${ROOMS_BROKER_PASSWORD}';
    CREATE ROLE rooms_retention LOGIN PASSWORD '${ROOMS_RETENTION_PASSWORD}';
    CREATE DATABASE rooms OWNER rooms_owner;
    SQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname rooms <<SQL
    GRANT CREATE, USAGE ON SCHEMA public TO rooms_owner;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: rooms-db
  namespace: {{ .Release.Namespace }}
  labels: {{- include "afumbrella.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: rooms-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rooms-db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: rooms-db
    {{- include "afumbrella.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: rooms-db
  selector:
    matchLabels:
      app.kubernetes.io/name: rooms-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rooms-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: rooms-db-passwords, key: postgres}}
            - name: ROOMS_OWNER_PASSWORD
              valueFrom: {secretKeyRef: {name: rooms-db-passwords, key: rooms_owner}}
            - name: ROOMS_BROKER_PASSWORD
              valueFrom: {secretKeyRef: {name: rooms-db-passwords, key: rooms_broker}}
            - name: ROOMS_RETENTION_PASSWORD
              valueFrom: {secretKeyRef: {name: rooms-db-passwords, key: rooms_retention}}
          readinessProbe:
            exec:
              # -h 127.0.0.1: the TCP port, which only the real server opens. Over the socket the
              # entrypoint's init-only server would answer too, and the pod would turn ready early.
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, postgres]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, postgres]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: run
          emptyDir: {}
        - name: init
          configMap:
            name: rooms-db-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
# The bundled Postgres's own policy (it was networkPolicies.plain's until v4 step 8): ingress only from
# the broker and its retention CronJob, on a CNI that enforces NetworkPolicy. Egress is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rooms-db
  namespace: {{ .Release.Namespace }}
  labels: {{- include "afumbrella.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rooms-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: room-broker
        {{- if .Values.maku.broker.database.retentionSecret }}
        # The retention CronJob (maku.broker.database.retentionSecret).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: room-broker-retention
        {{- end }}
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
