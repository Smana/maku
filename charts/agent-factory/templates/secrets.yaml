{{- include "afumbrella.profile" . -}}
{{- /* agent-git is not here: the factory writes it. */ -}}
{{- $modelName := $.Values.maku.runController.modelSecret | default "agent-model" -}}
{{- $appName := index $.Values "maku-factory" "githubSecret" | default "agent-factory-github" -}}
{{- with .Values.demo.model }}
{{- if and .existingSecret (ne .existingSecret $modelName) }}
{{- fail (printf "demo.model.existingSecret %q: the run controller reads %q, so the existing Secret must have that name" .existingSecret $modelName) }}
{{- end }}
{{- if not .existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $modelName }}
  namespace: {{ $.Values.maku.runs.namespace }}
  labels: {{- include "afumbrella.labels" $ | nindent 4 }}
type: Opaque
stringData:
  base_url: {{ required "demo.model.baseURL, or demo.model.existingSecret" .baseURL | quote }}
  model: {{ required "demo.model.name, or demo.model.existingSecret" .name | quote }}
  {{- with .judgeName }}
  judge_model: {{ . | quote }}
  {{- end }}
  api_key: {{ required "demo.model.apiKey, or demo.model.existingSecret" .apiKey | quote }}
---
{{- end }}
{{- end }}
{{- with .Values.demo.githubApp }}
{{- if and .existingSecret (ne .existingSecret $appName) }}
{{- fail (printf "demo.githubApp.existingSecret %q: the factory mounts %q, so the existing Secret must have that name" .existingSecret $appName) }}
{{- end }}
{{- if not .existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appName }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "afumbrella.labels" $ | nindent 4 }}
type: Opaque
stringData:
  app_id: {{ required "demo.githubApp.id, or demo.githubApp.existingSecret" .id | quote }}
  private_key: {{ required "demo.githubApp.privateKey, or demo.githubApp.existingSecret" .privateKey | quote }}
{{- end }}
{{- end }}
