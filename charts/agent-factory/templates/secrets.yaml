{{- include "afumbrella.gate" . -}}
{{- /* The demo's alone: a production install brings these Secrets itself (docs/install-secrets.md). */ -}}
{{- if .Values.demoValues -}}
{{- /* agent-git is not here: the factory writes it. */ -}}
{{- $modelName := $.Values.maku.runController.modelSecret | default "agent-model" -}}
{{- $mf := index $.Values "maku-factory" | default dict -}}
{{- $appName := dig "apps" "factory" "existingSecret" "" $mf | default $mf.githubSecret | default "agent-factory-github" -}}
{{- if eq (dig "runController" "model" "mode" "secret" $.Values.maku) "gateway" }}
{{- /* model.mode gateway (plan v4 step 4, Task 10): no provider key enters the runs namespace. The demo's
key becomes its provider's Secret in the release namespace, which maku-gateway.providers.demo names; the
provider's URL and the aliases' models are maku-gateway's values (values-demo.yaml). */}}
{{- with .Values.demo.model }}
{{- range $k := list "existingSecret" "baseURL" "name" "judgeName" }}
{{- if index $.Values.demo.model $k }}
{{- fail (printf "demo.model.%s: with maku.runController.model.mode gateway the runs call maku-gateway, so the provider and its models are maku-gateway.providers and maku-gateway.aliases (values-demo.yaml); set only demo.model.apiKey" $k) }}
{{- end }}
{{- end }}
{{- with .apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: demo-model
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "afumbrella.labels" $ | nindent 4 }}
type: Opaque
stringData:
  apiKey: {{ . | quote }}
---
{{- end }}
{{- end }}
{{- else }}
{{- with .Values.demo.model }}
{{- if and .existingSecret (ne .existingSecret $modelName) }}
{{- fail (printf "demo.model.existingSecret %q: the run controller reads %q, so the existing Secret must have that name" .existingSecret $modelName) }}
{{- end }}
{{- if not .existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $modelName }}
  namespace: {{ $.Values.maku.runs.namespace }}
  labels: {{- include "afumbrella.labels" $ | nindent 4 }}
type: Opaque
stringData:
  base_url: {{ required "demo.model.baseURL, or demo.model.existingSecret" .baseURL | quote }}
  model: {{ required "demo.model.name, or demo.model.existingSecret" .name | quote }}
  {{- with .judgeName }}
  judge_model: {{ . | quote }}
  {{- end }}
  api_key: {{ required "demo.model.apiKey, or demo.model.existingSecret" .apiKey | quote }}
---
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.demo.githubApp }}
{{- if and .existingSecret (ne .existingSecret $appName) }}
{{- fail (printf "demo.githubApp.existingSecret %q: the factory mounts %q, so the existing Secret must have that name" .existingSecret $appName) }}
{{- end }}
{{- if not .existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appName }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "afumbrella.labels" $ | nindent 4 }}
type: Opaque
stringData:
  app_id: {{ required "demo.githubApp.id, or demo.githubApp.existingSecret" .id | quote }}
  private_key: {{ required "demo.githubApp.privateKey, or demo.githubApp.existingSecret" .privateKey | quote }}
{{- end }}
{{- end }}
{{- end }}
