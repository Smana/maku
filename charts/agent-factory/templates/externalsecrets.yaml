{{- include "afumbrella.profile" . -}}
{{- /*
v4 D14 (PR10): an ExternalSecret for each seam externalSecrets.secrets lists, against the store the
values name, never a SecretStore. Each target is the seam's resolved Secret name, so the subcharts keep
reading one name. The seams are internal/install's registry (_seams.tpl, task chart:seams). A render
fails on an unknown seam, a seam whose chart is off, a required key no data entry or template produces
(a dataFrom is trusted), two seams on one Secret, or a Secret this install already writes: the
umbrella's own (the bundled Postgres, its TLS, the demo's model and App), the factory's run tokens
while it writes them, cert-manager's API pair under an issuerRef. One writer per Secret.
*/ -}}
{{- $es := .Values.externalSecrets -}}
{{- if $es.enabled }}
{{- if not $es.storeRef.name -}}
{{- fail "externalSecrets.enabled needs externalSecrets.storeRef.name: the SecretStore or ClusterSecretStore the ExternalSecrets read (docs/install-secrets.md#externalsecrets)" -}}
{{- end -}}
{{- /* The Secrets the umbrella itself writes in this install, by name: one writer per Secret. */ -}}
{{- $written := dict -}}
{{- if .Values.postgres.enabled -}}
{{- range list "rooms-db-passwords" "rooms-broker-dsn" "rooms-owner-dsn" "rooms-retention-dsn" }}{{ $_ := set $written . "the bundled Postgres (postgres.enabled)" }}{{ end -}}
{{- end -}}
{{- /* The broker's TLS pair and both CAs are the demo's alone (tls.yaml): production brings them. */ -}}
{{- if eq .Values.profile "demo" -}}
{{- range list (include "afumbrella.tlsSecret" .) (include "afumbrella.caSecret" .) (include "afumbrella.factoryCASecret" .) }}{{ $_ := set $written . "the umbrella (its broker TLS)" }}{{ end -}}
{{- end -}}
{{- $demo := .Values.demo | default dict -}}
{{- if eq (dig "runController" "model" "mode" "secret" .Values.maku) "gateway" -}}
{{- if dig "model" "apiKey" "" $demo }}{{ $_ := set $written "demo-model" "the umbrella" }}{{ end -}}
{{- else if and $demo.model (not (dig "model" "existingSecret" "" $demo)) -}}
{{- $_ := set $written (.Values.maku.runController.modelSecret | default "agent-model") "the umbrella" -}}
{{- end -}}
{{- if and $demo.githubApp (not (dig "githubApp" "existingSecret" "" $demo)) -}}
{{- $mf := index .Values "maku-factory" | default dict -}}
{{- $_ := set $written (dig "apps" "factory" "existingSecret" "" $mf | default "agent-factory-github") "the demo" -}}
{{- end -}}
{{- $targets := dict -}}
{{- $seams := dict -}}
{{- range (include "afumbrella.seams" . | fromJson).seams -}}
{{- $_ := set $seams .id . -}}
{{- end -}}
{{- range $id := keys ($es.secrets | default dict) | sortAlpha }}
{{- $spec := index $es.secrets $id | default dict -}}
{{- $parts := splitList "." $id -}}
{{- $s := index $seams (first $parts) -}}
{{- if not $s -}}
{{- fail (printf "externalSecrets.secrets.%s: not a seam id (docs/install-secrets.md)" $id) -}}
{{- end -}}
{{- $vals := $.Values -}}
{{- if ne $s.chart "agent-factory" -}}
{{- $key := $s.valuesKey | default $s.chart -}}
{{- $vals = index $.Values $key | default dict -}}
{{- if not $vals.enabled -}}
{{- fail (printf "externalSecrets.secrets.%s: %s.enabled is false: nothing in this release reads it" $id $key) -}}
{{- end -}}
{{- end -}}
{{- $name := "" -}}
{{- $required := list -}}
{{- if $s.instances -}}
{{- if ne (len $parts) 2 -}}
{{- fail (printf "externalSecrets.secrets.%s: name one entry, as %s.<name> (docs/install-secrets.md)" $id $s.id) -}}
{{- end -}}
{{- $entry := index (include "afumbrella.at" (dict "v" $vals "path" $s.value) | fromJson).v (index $parts 1) | default dict -}}
{{- $name = $entry.existingSecret | default "" -}}
{{- $required = list ($entry.key | default (first $s.keys).name) -}}
{{- else -}}
{{- if gt (len $parts) 1 -}}
{{- fail (printf "externalSecrets.secrets.%s: %s has no entries; list it as %s" $id $s.id $s.id) -}}
{{- end -}}
{{- if $s.value }}{{ $name = (include "afumbrella.at" (dict "v" $vals "path" $s.value) | fromJson).v | default "" }}{{ end -}}
{{- $name = $name | default $s.default -}}
{{- if not $s.dynamicKeys -}}
{{- range $s.keys -}}
{{- if .required -}}
{{- $k := .name -}}
{{- if .from }}{{ $k = (include "afumbrella.at" (dict "v" $vals "path" .from) | fromJson).v | default .name }}{{ end -}}
{{- $required = append $required $k -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $name -}}
{{- fail (printf "externalSecrets.secrets.%s: no Secret name: set %s.%s (docs/install-secrets.md)" $id $s.chart $s.value) -}}
{{- end -}}
{{- $writer := index $written $name | default "" -}}
{{- /* The writers at run time: the factory's run-token writer, cert-manager's Certificate. */ -}}
{{- $mf := index $.Values "maku-factory" | default dict -}}
{{- if and (eq $s.generated "factory") $mf.enabled (or (dig "runTokens" "enabled" false $mf) $mf.demo) }}{{ $writer = "the factory" }}{{ end -}}
{{- if and (eq $s.generated "cert-manager") (dig "api" "tls" "issuerRef" "name" "" $mf) }}{{ $writer = "cert-manager (maku-factory.api.tls.issuerRef)" }}{{ end -}}
{{- if $writer -}}
{{- if eq $writer "the demo" -}}
{{- fail (printf "externalSecrets.secrets.%s: the demo writes %s from demo.githubApp: drop one of the two" $id $name) -}}
{{- end -}}
{{- fail (printf "externalSecrets.secrets.%s: %s writes %s: an ExternalSecret of the same name would fight it" $id $writer $name) -}}
{{- end -}}
{{- $ns := ternary $.Values.maku.runs.namespace $.Release.Namespace (eq $s.namespace "runs") -}}
{{- with index $targets (printf "%s/%s" $ns $name) -}}
{{- fail (printf "externalSecrets.secrets.%s and externalSecrets.secrets.%s both target %s: one writer per Secret" $id . $name) -}}
{{- end -}}
{{- $_ := set $targets (printf "%s/%s" $ns $name) $id -}}
{{- if not (or $spec.data $spec.dataFrom) -}}
{{- fail (printf "externalSecrets.secrets.%s: data or dataFrom is required (docs/install-secrets.md)" $id) -}}
{{- end -}}
{{- if not $spec.dataFrom -}}
{{- $produced := list -}}
{{- range $spec.data }}{{ $produced = append $produced .secretKey }}{{ end -}}
{{- range $k, $_ := dig "data" dict ($spec.template | default dict) }}{{ $produced = append $produced $k }}{{ end -}}
{{- if dig "data" nil ($spec.template | default dict) -}}
{{- /* A template's data is the target's whole content: the keys it writes are the ones produced. */ -}}
{{- $produced = keys (dig "data" dict $spec.template) -}}
{{- end -}}
{{- range $required -}}
{{- if not (has . $produced) -}}
{{- fail (printf "externalSecrets.secrets.%s: key %s is required (docs/install-secrets.md)" $id .) -}}
{{- end -}}
{{- end -}}
{{- end }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "afumbrella.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $s.id }}
spec:
  refreshInterval: {{ $spec.refreshInterval | default $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeRef.kind }}
    name: {{ $es.storeRef.name }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- with $spec.template }}
    template: {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $spec.data }}
  data: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.dataFrom }}
  dataFrom: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
