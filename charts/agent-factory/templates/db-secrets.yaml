{{- include "afumbrella.profile" . -}}
{{- if .Values.postgres.enabled }}
{{- /* Passwords: kept across upgrades (`lookup`), else random. The DSNs and the init script both read them. */ -}}
{{- $ns := .Release.Namespace -}}
{{- $existing := lookup "v1" "Secret" $ns "rooms-db-passwords" -}}
{{- $pw := dict -}}
{{- range $u := list "postgres" "rooms_owner" "rooms_broker" "rooms_retention" -}}
{{- if and $existing (hasKey $existing.data $u) -}}
{{- $_ := set $pw $u (index $existing.data $u | b64dec) -}}
{{- else -}}
{{- $_ := set $pw $u (randAlphaNum 32) -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: rooms-db-passwords
  namespace: {{ $ns }}
  labels: {{- include "afumbrella.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $u, $p := $pw }}
  {{ $u }}: {{ $p | quote }}
  {{- end }}
{{- range $name, $user := dict "rooms-broker-dsn" "rooms_broker" "rooms-owner-dsn" "rooms_owner" "rooms-retention-dsn" "rooms_retention" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "afumbrella.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # In-cluster only, no TLS on the database hop: this chart is for a throwaway kind or k3d cluster.
  uri: {{ printf "postgresql://%s:%s@rooms-db.%s.svc:5432/rooms?sslmode=disable" $user (get $pw $user) $ns | quote }}
{{- end }}
{{- end }}
