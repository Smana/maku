{{- /*
The merge policy catalog (merge policies review MR2, MR6): three MergePolicy objects in the factory's
namespace, labelled maku.ogenki.io/catalog. Every Repository the factory serves evaluates each one it
does not bind, in shadow; a binding with mode disabled switches one off for its repository. Each policy
carries its own bound (allowedFiles or a diffShape), since no binding supplies one. mergePolicies.catalog.exclude
leaves out the ones a platform keeps as its own objects. An object of a catalog name that is not the
catalog's fails the render (afumbrella.catalogOwner) rather than the apply.
*/ -}}
{{- $mf := index .Values "maku-factory" -}}
{{- $cat := .Values.mergePolicies.catalog -}}
{{- if and $mf.enabled $cat.enabled -}}
{{- $specs := dict
  "docs-links" (dict "description" "Link targets in Markdown, nothing else." "diffShape" "links-only" "modifyOnly" true "maxModifiedLines" 20 "evidence" "low")
  "deps-patch" (dict "description" "Renovate patch updates, after their release age." "author" (dict "adopt" (dict "logins" (list "renovate[bot]") "branches" (list "^renovate/"))) "diffShape" "semver-patch" "modifyOnly" true "maxPatchFiles" 3 "maxModifiedLines" 10 "releaseAgeCheck" "renovate/stability-days" "maxPerDay" 2 "evidence" "low")
  "docs" (dict "description" "Prose in Markdown files, small changes." "allowedFiles" (list "^.+\\.mdx?$") "maxPatchFiles" 5 "maxModifiedLines" 100 "maxPerDay" 2 "evidence" "standard")
-}}
{{- range $name := list "docs-links" "deps-patch" "docs" }}
{{- if not (has $name ($cat.exclude | default list)) }}
{{- include "afumbrella.catalogOwner" (dict "namespace" $.Release.Namespace "name" $name) }}
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "afumbrella.labels" $ | nindent 4 }}
    maku.ogenki.io/catalog: "true"
spec:
  {{- toYaml (index $specs $name) | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
