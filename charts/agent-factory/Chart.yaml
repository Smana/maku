apiVersion: v2
name: agent-factory
description: "The agent factory on a plain kind or k3d cluster: maku and maku-factory, plus the broker's TLS (generated by Helm) and a single-replica Postgres."
type: application
# Set by `helm package --version` from the tag (release) or the PR pre-release (R20).
version: 0.0.0
appVersion: "0.0.0"
dependencies:
  - name: maku
    version: 0.0.0
    repository: file://../maku
    condition: maku.enabled
  - name: maku-factory
    version: 0.0.0
    repository: file://../maku-factory
    condition: maku-factory.enabled
  # The model gateway (D7): Maku's objects on an agentgateway controller, off by default.
  - name: maku-gateway
    version: 0.0.0
    repository: file://../maku-gateway
    condition: maku-gateway.enabled
  # The upstream controller, off by default and where the cluster already runs one. Vendored by
  # hack/agentgateway-vendor.sh and pinned in hack/agentgateway.sha256 (`task chart:deps`), so
  # building the umbrella needs no network.
  - name: agentgateway
    version: v1.6.0
    repository: file://vendor/agentgateway
    condition: agentgateway.enabled
# The support floor (D26): the ValidatingAdmissionPolicies need 1.30.
kubeVersion: ">=1.30.0-0"
