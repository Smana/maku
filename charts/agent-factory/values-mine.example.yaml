# A values file for a real install of the demo: copy it to values-mine.yaml, change every line
# marked CHANGE, then
#   helm install af charts/agent-factory -n maku --create-namespace -f charts/agent-factory/values-demo.yaml -f values-mine.yaml ...
# Helm replaces a list whole, so `repositories` restates the entire entry from values-demo.yaml.

demo:
  model:
    apiKey: sk-change-me                  # CHANGE: the provider's key, which only the model gateway holds
  githubApp:
    id: "123456"                          # CHANGE: the App's id (or existingSecret: agent-factory-github)
    privateKey: |                         # CHANGE: the App's PEM
      -----BEGIN RSA PRIVATE KEY-----
      change-me
      -----END RSA PRIVATE KEY-----

maku-factory:
  config:
    factoryLogin: my-app[bot]             # CHANGE: the App's slug, as <slug>[bot]
    agentsLogin: my-app[bot]              # CHANGE: the same App
    repositories:
      - name: owner/repo                  # CHANGE: your repository
        maintainers: [owner]              # CHANGE: GitHub logins allowed to file work
        triggerLabel: factory/ready
        classes:
          docs-links: {shadow: true, allowedFiles: ['^.+\.(md|mdx|adoc|rst)$']}
          revert: {shadow: true, allowedFiles: ['^.+$']}
        merge:
          requiredChecks: [ci]            # CHANGE: your CI's check names
          verifyChecks: [ci]              # CHANGE
          leakScanCheck: ci               # CHANGE
          gateStatus: true
          policyBot: false
          approveToMerge: true            # your approval of the current head merges it
          mergerLogin: my-app[bot]        # CHANGE: the App's slug again
          autoMergesPerDay: 5
          fixRuns: 2
          checkReruns: 1
          verifyFor: 30m
          revertWindow: 168h
          breaker: {window: 10, maxReverts: 1}

# The model gateway (step 7 R4): your OpenAI-compatible provider, and the cluster's issuer.
maku-gateway:
  identity:
    issuer: https://kubernetes.default.svc.cluster.local # CHANGE: kubectl get --raw /.well-known/openid-configuration | jq -r .issuer
  providers:
    demo:
      host: api.example.com               # CHANGE: an OpenAI-compatible endpoint's host (443, /v1/chat/completions)
  aliases:
    public:
      agent-default: {provider: demo, model: my-model}   # CHANGE
      tier-light: {provider: demo, model: my-model}      # CHANGE: the judges' (lighter) model
