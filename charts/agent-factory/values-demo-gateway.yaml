# The laptop demo with the model gateway (v4 step 4, docs/gateway.md): runs call agentgateway with
# their own projected token, and no provider key enters the runs namespace. Layer it on the demo:
#   helm install af-crds charts/agent-factory-crds -n maku --create-namespace
#   kubectl apply --server-side -f config/agentgateway   # agentgateway's CRDs (docs/gateway.md)
#   kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
#   helm install af charts/agent-factory -n maku -f charts/agent-factory/values-demo.yaml \
#     -f charts/agent-factory/values-demo-gateway.yaml \
#     --set demo.model.apiKey=... \
#     --set maku-gateway.identity.issuer=$(kubectl get --raw /.well-known/openid-configuration | jq -r .issuer) \
#     --set maku-gateway.providers.demo.host=api.example.com \
#     --set maku-gateway.aliases.public.agent-default.model=<model> --set maku-gateway.aliases.public.tier-light.model=<judge model>
# The provider and its models are the gateway's values: demo.model sets only apiKey here (its baseURL,
# name and judgeName are refused, since nothing would read them). The apiserver must admit anonymous
# requests for the gateway's JWKS fetch: kind and kubeadm do; k3s needs
# --kube-apiserver-arg=anonymous-auth=true.

maku:
  runController:
    model:
      mode: gateway
      gateway:
        # service and namespace empty: this release's model-gateway.
        # The demo's tiers all name agent-default; its loops' judge is tier-light.
        aliases: {public: [agent-default, tier-light], internal: []}

# The upstream controller, in the release namespace.
agentgateway:
  enabled: true

maku-gateway:
  enabled: true
  replicas: 1
  identity:
    issuer: "" # this cluster's ServiceAccount issuer: required
    # kind and k3d's issuer is not reachable from outside: the gateway reads the apiserver's JWKS, which
    # its controller fetches anonymously (public keys only).
    jwks: {source: apiserver, allowAnonymousDiscovery: true}
  providers:
    # The demo's one OpenAI-compatible provider. Its key is demo-model, which the umbrella renders from
    # demo.model.apiKey.
    demo:
      preset: custom
      existingSecret: demo-model
      key: apiKey
      host: "" # e.g. api.example.com
      port: 443
      path: /v1/chat/completions
      tls: true
  aliases:
    public:
      agent-default: {provider: demo, model: ""}
      tier-light: {provider: demo, model: ""}
