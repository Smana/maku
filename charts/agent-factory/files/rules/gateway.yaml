# The model gateway's alerts (group maku-gateway), rendered with maku-gateway.enabled. Ported from
# ai-native-ref's vmrule.yaml (group agent-gateway) and vmrule-agent-factory.yaml (group
# agent-cost-crosscheck) at 1529b3b, on agentgateway's own metric names as v4 step 4 PR D reads them
# (no relabel: agentgateway_gen_ai_client_token_usage_*, token types input, output, input_cache_read,
# input_cache_write). Placeholders as in rooms.yaml, plus __GATEWAY_NAME__ (maku-gateway.name, the job
# the chart's PodMonitor sets) and __RUN_SUBJECT__ (system:serviceaccount:<runs ns>:<namePrefix>,
# regex-escaped: it is read only inside =~ and label_replace). The cross-check reads the factory's
# ledger gauge, so its record and alert render only with maku-factory.enabled.
name: maku-gateway
rules:
  # Step 4's metric contract: the meter reads agentgateway's token series by name and token type. Model
  # calls answered 200 with no token series, or a token type the meter does not price, is the
  # signature of an upstream rename: the meter would read zero or misprice.
  - alert: AgentRouterMetricContractBroken
    expr: (sum(increase(agentgateway_requests_total{job="__GATEWAY_NAME__", namespace="__NAMESPACE__", status="200", route=~".*/maku-(models|clients)-.+", route!~".*/maku-models-[a-z]+-list"}[15m])) > 0 unless sum(increase(agentgateway_gen_ai_client_token_usage_count{job="__GATEWAY_NAME__", namespace="__NAMESPACE__"}[15m])) > 0) or count(agentgateway_gen_ai_client_token_usage_sum{job="__GATEWAY_NAME__", namespace="__NAMESPACE__", gen_ai_token_type!~"input|output|input_cache_read|input_cache_write"}) > 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: "The model gateway serves model calls the meter's token contract does not see"
      description: "An agentgateway upgrade renamed a token metric or a token type the factory's meter.query reads. The run meter, the budgets and the run page read zero or misprice until meter.query follows. Compare the gateway's /metrics on :15020 with docs/gateway.md, metering the runs."
      runbook_url: "__DOCS__/operations.md#gateway-alerts"
      dashboard: "/d/agent-gateway"
  - alert: AgentGateway5xxRatioHigh
    expr: sum(rate(agentgateway_requests_total{job="__GATEWAY_NAME__", namespace="__NAMESPACE__", status=~"5.."}[10m])) / sum(rate(agentgateway_requests_total{job="__GATEWAY_NAME__", namespace="__NAMESPACE__"}[10m])) > 0.05 and sum(increase(agentgateway_requests_total{job="__GATEWAY_NAME__", namespace="__NAMESPACE__", status=~"5.."}[10m])) > 5
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "The model gateway answers {{ $value | humanizePercentage }} of requests with a 5xx"
      description: "Split by route and reason: sum by (route, reason) (rate(agentgateway_requests_total{status=~\"5..\"}[10m])). UpstreamFailure or Timeout is the provider, Internal is the proxy."
      runbook_url: "__DOCS__/operations.md#gateway-alerts"
      dashboard: "/d/agent-gateway"
  # agentgateway sets error_type on every failed model call: a ratio, not a cause.
  - alert: AgentGatewayModelErrorRatioHigh
    expr: sum(rate(agentgateway_gen_ai_server_request_duration_count{job="__GATEWAY_NAME__", namespace="__NAMESPACE__", error_type=~".+"}[10m])) / sum(rate(agentgateway_gen_ai_server_request_duration_count{job="__GATEWAY_NAME__", namespace="__NAMESPACE__"}[10m])) > 0.1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "{{ $value | humanizePercentage }} of model calls through the model gateway fail"
      description: "The provider is failing or refusing. The access log's http.status and error fields name the cause: kubectl logs -n __NAMESPACE__ -l gateway.networking.k8s.io/gateway-name=__GATEWAY_NAME__"
      runbook_url: "__DOCS__/operations.md#gateway-alerts"
      dashboard: "/d/agent-gateway"
  - alert: AgentGatewayUnauthorizedBurst
    expr: sum(increase(agentgateway_requests_total{job="__GATEWAY_NAME__", namespace="__NAMESPACE__", reason=~"JwtAuth|Authorization"}[5m])) > 20
    labels:
      severity: warning
    annotations:
      summary: "The model gateway refused {{ $value }} requests in 5 minutes"
      description: "Invalid tokens, a wrong audience, or a subject outside the runs namespace: replayed or foreign tokens, or a caller whose token projection broke. kubectl logs -n __NAMESPACE__ -l gateway.networking.k8s.io/gateway-name=__GATEWAY_NAME__ | grep -E 'JwtAuth|Authorization'"
      runbook_url: "__DOCS__/operations.md#gateway-alerts"
      dashboard: "/d/agent-gateway"
  # agentgateway prices a response from the catalog (maku-gateway.modelCatalog) and counts the
  # lookup; only Exact adds to the cost counter, so any other status is spend the cross-check cannot
  # see on the gateway side.
  - alert: AgentGatewayCostUnpriced
    expr: sum by (ar_agent, gen_ai_request_model, status) (increase(agentgateway_cost_catalog_lookups_total{job="__GATEWAY_NAME__", namespace="__NAMESPACE__", status!="Exact"}[15m])) > 0
    labels:
      severity: warning
    annotations:
      summary: "The model gateway could not price {{ $labels.gen_ai_request_model }} ({{ $labels.status }}) for {{ $labels.ar_agent }}"
      description: "A catalog lookup other than Exact adds nothing to the gateway's cost counter. Missing or Unpriced: the model has no row in the catalog (maku-factory.config.meter.prices, or maku-gateway.modelCatalog.prices). NoCatalog: the catalog is not mounted on the proxy."
      runbook_url: "__DOCS__/operations.md#gateway-alerts"
      dashboard: "/d/agent-gateway"
  # The cost cross-check: the ledger's total for a run (maku_factory_run_settled_usd, kept 1 h after
  # the run) against the gateway's own priced counter. A mismatch warns, nothing more: the meter stays
  # the authority. 6 h outlasts the longest run cap. increase() reads a few percent low for a run's
  # first samples, well inside the 15 m `for` once the run has stopped spending.
  - record: agent_cost:gateway_run_usd
    expr: sum by (run) (label_replace(increase(agentgateway_gen_ai_client_cost_usd_total{job="__GATEWAY_NAME__", namespace="__NAMESPACE__", ar_agent=~"__RUN_SUBJECT__.+"}[6h]), "run", "$1", "ar_agent", "__RUN_SUBJECT__(.+)"))
  # abs(ledger - gateway) <= max(1% of the gateway, 0.01 USD), judged once the gateway's cost has not
  # moved for 10 m, so a run still spending is silent. Second branch: gateway cost the ledger never
  # saw, only while the run's gauge must still exist (it leaves 1 h after the run ends; the cost last
  # moved under 40 m ago).
  - alert: AgentCostCrossCheckMismatch
    expr: |
      (
        (
          abs(max by (run) (maku_factory_run_settled_usd) - on (run) agent_cost:gateway_run_usd)
            > on (run) clamp_min(0.01 * agent_cost:gateway_run_usd, 0.01)
        )
        or
        (
          (agent_cost:gateway_run_usd > 0.01 unless on (run) maku_factory_run_settled_usd)
            and on (run) (sum by (run) (label_replace(changes(agentgateway_gen_ai_client_cost_usd_total{job="__GATEWAY_NAME__", namespace="__NAMESPACE__", ar_agent=~"__RUN_SUBJECT__.+"}[40m]), "run", "$1", "ar_agent", "__RUN_SUBJECT__(.+)")) > 0)
        )
      )
      and on (run) (sum by (run) (label_replace(changes(agentgateway_gen_ai_client_cost_usd_total{job="__GATEWAY_NAME__", namespace="__NAMESPACE__", ar_agent=~"__RUN_SUBJECT__.+"}[10m]), "run", "$1", "ar_agent", "__RUN_SUBJECT__(.+)")) == 0)
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: "Run {{ $labels.run }}: the ledger and the gateway disagree on its cost"
      description: "The ledger's total for the run and the gateway's priced counter differ by more than max(1 %, 0.01 USD), or the gateway priced spend the ledger never saw. Neither side is presumed right. Suspects: a double charge, a lost ledger write, a catalog price that differs from meter.prices, an unpriced lookup (AgentGatewayCostUnpriced), a scrape gap."
      runbook_url: "__DOCS__/operations.md#gateway-alerts"
      dashboard: "/d/agent-run?var-run={{ $labels.run }}"
