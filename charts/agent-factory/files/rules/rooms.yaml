# The broker's alerts (group maku-rooms), ported from ai-native-ref's vmrule-rooms.yaml and
# vmrule-agent-factory.yaml at 1529b3b. Plain PromQL, read by templates/monitoring-rules.yaml with
# .Files.Get and replace, never tpl: {{ $labels.x }} reaches Prometheus as written. Placeholders:
# __NAMESPACE__ (the release's), __RUNS_NAMESPACE__ (maku.runs.namespace), __HUMAN_ISSUER__
# (maku.broker.human.issuer; its rule is left out without one) and __DOCS__ (monitoring.prometheusRule.docsURL).
# The broker's exporter adds no suffix: every name here is exposed byte for byte.
name: maku-rooms
rules:
  - alert: RoomBrokerDown
    expr: absent(up{job="room-broker", namespace="__NAMESPACE__"} == 1)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "No room-broker replica is up"
      description: "Runs keep working and their bridges buffer, but nothing reaches the room log. kubectl get pods -n __NAMESPACE__ -l app.kubernetes.io/name=room-broker"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  - alert: RoomLogAppendErrors
    expr: sum(increase(maku_rooms_append_errors_total[10m])) > 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "The room log is refusing appends"
      description: "The rooms database refuses writes the broker sends it. Check the database the broker's DSN names, and the broker's log: kubectl logs -n __NAMESPACE__ -l app.kubernetes.io/name=room-broker | grep -i append"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  - alert: RoomRedactionsSpike
    expr: sum(increase(maku_rooms_redactions_total[15m])) > 20
    labels:
      severity: warning
    annotations:
      summary: "More than 20 secrets redacted from room logs in 15 minutes"
      description: "An agent is handling credentials. Read the rooms with the newest redactions: SELECT room_id, seq, redactions FROM events WHERE redactions <> '{}' ORDER BY ts DESC LIMIT 20"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  # The gauge exists for every room with a Running run, whatever its phase: the room turns
  # AwaitingHuman at 30 min silent, and the series must outlive that flip.
  - alert: RoomStalled
    expr: time() - max by (room) (maku_rooms_last_event_timestamp_seconds) > 1800
    labels:
      severity: warning
    annotations:
      summary: "Room {{ $labels.room }} has a running run and no event for 30 minutes"
      description: "The run is Running but silent, and the room shows AwaitingHuman. Find its run: kubectl get agentrun -n __RUNS_NAMESPACE__ -o custom-columns=RUN:.metadata.name,ROOM:.spec.roomRef | grep {{ $labels.room }}, then read its bridge: kubectl logs -n __RUNS_NAMESPACE__ <the run's pod> -c room-bridge"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  # A stall or a 400 is a bridge/harness contract break, not load: alert on any.
  - alert: RoomBridgeHarnessStalled
    expr: sum by (reason) (increase(maku_rooms_bridge_harness_stalls_total[10m])) > 0
    labels:
      severity: warning
    annotations:
      summary: "A bridge cannot move past the harness log ({{ $labels.reason }})"
      description: "The bridge's cursor holds and its room was told a harness_error with code {{ $labels.reason }}, so the transcript stops there. List room runs: kubectl get agentrun -n __RUNS_NAMESPACE__ -o custom-columns=RUN:.metadata.name,ROOM:.spec.roomRef, then read the bridge: kubectl logs -n __RUNS_NAMESPACE__ <the run's pod> -c room-bridge"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  - alert: RoomBridgeItemsRefused
    expr: sum(increase(maku_rooms_bridge_items_stubbed_total{reason="refused"}[10m])) > 0
    labels:
      severity: warning
    annotations:
      summary: "The broker refused harness items, kept as stubs in the room log"
      description: "The broker answered 400 to a lone item: the bridge and the broker disagree on the envelope. Read the broker's refusals: kubectl logs -n __NAMESPACE__ -l app.kubernetes.io/name=room-broker | grep 'bridge item refused'"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  # Harness content the log cannot hold as sent: a value PostgreSQL rejects (a NUL in tool output)
  # or keys that collide once redacted. Expected now and then, so info.
  - alert: RoomBridgeItemsUnstorable
    expr: sum by (reason) (increase(maku_rooms_bridge_items_stubbed_total{reason=~"invalid_value|key_collision"}[1h])) > 0
    labels:
      severity: info
    annotations:
      summary: "Harness items were kept as stubs ({{ $labels.reason }})"
      description: "invalid_value: the store rejected a value; key_collision: keys collide once redacted. Neither loses the slot. Read the broker: kubectl logs -n __NAMESPACE__ -l app.kubernetes.io/name=room-broker | grep -E 'payload refused by the database|keys collide once redacted'"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  # The broker's held keys stop verifying 24h after the last fetch: 6h leaves time to act.
  - alert: RoomAuthnJWKSStale
    expr: time() - max by (issuer) (maku_rooms_authn_jwks_last_refresh_timestamp_seconds) > 6 * 3600
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "The broker has not refreshed {{ $labels.issuer }}'s JWKS for 6 hours"
      description: "At 24 hours its held keys stop verifying and every token from that issuer is refused. Check the broker's egress to the issuer: kubectl logs -n __NAMESPACE__ -l app.kubernetes.io/name=room-broker | grep jwks"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  # The human issuer's verifier is lazy: an IdP unreachable since the broker started leaves no
  # series at all, which the age alert above cannot see.
  - alert: RoomAuthnHumanIssuerNeverFetched
    expr: absent(maku_rooms_authn_jwks_last_refresh_timestamp_seconds{issuer="__HUMAN_ISSUER__"}) and on () (sum(up{job="room-broker", namespace="__NAMESPACE__"}) > 0)
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: "The broker has never fetched the human issuer's JWKS"
      description: "Every human is refused until it does. Check the broker's egress to __HUMAN_ISSUER__: kubectl logs -n __NAMESPACE__ -l app.kubernetes.io/name=room-broker | grep jwks"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  - alert: RoomRejectedActionsSpike
    expr: sum(increase(maku_rooms_rejected_actions_total[10m])) > 30
    labels:
      severity: warning
    annotations:
      summary: "The broker refused more than 30 actions in 10 minutes"
      description: "A client is probing the role matrix, or a UI bug is sending actions a role cannot take. Break down by reason: sum by (reason) (increase(maku_rooms_rejected_actions_total[10m]))"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  # A stuck verdict retries at most every 15 min plus a 15 s tick: the error window must outlast
  # that gap, or every gap resets `for`.
  - alert: RoomVerdictsNotReachingGitHub
    expr: sum(increase(maku_rooms_verdict_posts_total{result="error"}[20m])) > 0 unless sum(increase(maku_rooms_verdict_posts_total{result="posted"}[30m])) > 0
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: "Agents' review verdicts have not reached GitHub for 30 minutes"
      description: "They stay in the room and the factory still reads them there. Check the broker's GitHub App key and its egress to api.github.com, then the broker log: kubectl logs -n __NAMESPACE__ -l app.kubernetes.io/name=room-broker | grep -i verdict"
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  - alert: RoomApprovalPendingTooLong
    expr: max(maku_rooms_approvals_oldest_pending_seconds) > 900
    labels:
      severity: warning
    annotations:
      summary: "An approval has waited more than 15 minutes"
      description: "A run is parked, keeping its sandbox and spending no tokens. Open the room and decide; unattended rooms auto-deny at spec.approvals.ttl."
      runbook_url: "__DOCS__/operations.md#room-alerts"
      dashboard: "/d/agent-room"
  # Three given-up deliveries disable a subscriber until its generation is bumped. The series exists
  # only while the broker's config declares a webhook.
  - alert: RoomWebhookDisabled
    expr: max by (subscriber) (maku_rooms_webhook_disabled) == 1
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "The broker disabled its webhook subscriber {{ $labels.subscriber }}: its events are not delivered"
      description: "Three deliveries were given up. Fix the receiver (its key, or the service behind it), bump generation on the webhooks entry in the broker's config and restart the broker: a webhooks change applies only at restart. The events of the disabled window are not replayed."
      runbook_url: "__DOCS__/operations.md#webhooks"
      dashboard: "/d/agent-factory"
