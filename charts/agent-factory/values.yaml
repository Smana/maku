# The production-safe skeleton. These defaults render nothing on their own: `profile` must be set,
# and values.schema.json rejects unknown or malformed values.
#   - The demo is `-f values-demo.yaml` (profile: demo, with every demo default).
#   - `profile: production` fails closed until its seams arrive (v4 rollout steps 2 to 6).
# Install the agent-factory-crds chart first. Values may still change in 0.x minors until v4.0.0.
profile: ""

# Must equal `maku.clusterDomain` and `maku-factory.clusterDomain`: the broker certificate's SANs
# are built from it.
clusterDomain: cluster.local

# The bundled single-replica Postgres is demo-only (v4 D9): bring your own Postgres 16 or later, create
# its three roles (docs/database.md), and name their DSN Secrets in maku.broker.database. values-demo.yaml
# turns it on; any other profile with it on fails.
postgres:
  enabled: false

# Off in the skeleton: only the umbrella's own templates render, each behind the profile gate, so an
# unset or unready profile fails with the gate's message rather than a subchart's. values-demo.yaml
# turns both on.
maku:
  enabled: false
maku-factory:
  enabled: false

# The model gateway (D7; docs/gateway.md), off by default. maku-gateway renders the Gateway, its
# policies, a backend and a route per model alias; its `runs` must equal maku's, and its broker
# ServiceAccount the broker's (room-broker). agentgateway is the upstream controller (v1.6.0): leave
# it off where the cluster already runs one. Its CRDs are applied first, apart from any Helm release
# (`kubectl apply --server-side -f config/agentgateway`, docs/gateway.md); Gateway API's standard CRDs
# (v1.2 or later) are a cluster prerequisite.
maku-gateway:
  enabled: false
  # GW12: the gateway's price catalog defaults to maku-factory.config.meter.prices, so a price has one
  # source; maku-gateway.modelCatalog.prices, when set, wins.
  modelCatalog: {umbrellaPrices: true}
agentgateway:
  enabled: false
  # As cnref runs it (ANR infrastructure/base/agentgateway): the controller by digest, no Istio
  # permissions, restricted, with limits. The chart has no liveness-probe value.
  controller:
    image:
      tag: "v1.6.0@sha256:d84259a7e2d87f8f39bae385d4b032d823c0a4450aecb32e0e31e2258449645b"
  istio:
    enabled: false
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

# Observability (D21; docs/observability.md), every switch off. Monitoring objects render only when
# asked, never on a guess at the cluster's CRDs, so offline renders (Flux, Argo CD, helm template) are
# deterministic: the prometheus-operator CRDs (monitoring.coreos.com/v1) must exist when one is on.
# The VictoriaMetrics operator converts them.
monitoring:
  # ServiceMonitors for the broker and the factory, PodMonitors for the run-controller, the egress
  # proxy (networkPolicies.mode kubernetes) and the model-gateway proxies (maku-gateway.enabled). The
  # scraper must be admitted wherever a default-deny policy holds the target: in maku's mode
  # kubernetes, maku.networkPolicies.kubernetes.metricsFrom; in its mode cilium, cilium.fromEndpoints
  # below; with maku-gateway's policy on, maku-gateway.metrics.allowFrom. The render fails otherwise.
  # labels: added to each object, for a Prometheus whose selector wants them (e.g. release:
  # kube-prometheus-stack).
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
    # maku's mode cilium: Cilium endpoint selectors of the scraper's pods, e.g.
    # [{matchLabels: {io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus}}].
    # They are admitted on :9090 of the broker and the run-controller (CNP maku-metrics).
    cilium:
      fromEndpoints: []
  # One PrometheusRule, maku, with a group per component, each rendered only with it: maku-rooms
  # (maku), maku-run-path (maku.runController), maku-factory (maku-factory), maku-slack
  # (slack.enabled), maku-gateway (maku-gateway; its cost cross-check also needs maku-factory). docs/operations.md#alerts lists every alert. In PromQL, tested by promtool.
  prometheusRule:
    enabled: false
    labels: {}
    # Alert names to leave out, e.g. one an install keeps its own variant of. A name no group holds
    # fails the render.
    disabled: []
    # The rules that read kube-state-metrics' kube_* series (AgentSandboxPodPending).
    kubeStateMetrics: false
    # Each alert's runbook_url base. Empty: https://github.com/Smana/maku/blob/v<appVersion>/docs.
    docsURL: ""

# The Slack App (D20). Its subchart arrives in a later v4 step 6 PR; until then, true only adds the
# maku-slack alert group, for a Slack App installed outside this chart.
slack:
  enabled: false
