# The umbrella adds what a plain cluster lacks: the broker's TLS (no cert-manager) and a
# single-replica Postgres (no CNPG). Everything under `maku` and `maku-factory` is those charts' own.
maku:
  enabled: true
  broker:
    database:
      brokerSecret: rooms-broker-dsn
      ownerSecret: rooms-owner-dsn
maku-factory:
  enabled: true

# Must equal `maku.clusterDomain`: the broker certificate's SANs are built from it.
clusterDomain: cluster.local

tls:
  # Validity of the generated CA and broker certificate, in days. Both are kept across upgrades.
  days: 3650
  caName: maku-demo-ca

postgres:
  # postgres:17, pinned by digest.
  image: docker.io/library/postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
  storage: 1Gi
  # Empty: the cluster's default StorageClass (kind and k3d both provide one).
  storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
