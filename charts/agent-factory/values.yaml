# The production-safe skeleton. These defaults render nothing on their own: `profile` must be set,
# and values.schema.json rejects unknown or malformed values.
#   - The demo is `-f values-demo.yaml` (profile: demo, with every demo default).
#   - `profile: production` fails closed until its seams arrive (v4 rollout steps 2 to 6).
# Install the agent-factory-crds chart first. Values may still change in 0.x minors until v4.0.0.
profile: ""

# Must equal `maku.clusterDomain` and `maku-factory.clusterDomain`: the broker certificate's SANs
# are built from it.
clusterDomain: cluster.local

# The bundled single-replica Postgres is demo-only (v4 D9): bring your own Postgres 16 or later, create
# its three roles (docs/database.md), and name their DSN Secrets in maku.broker.database. values-demo.yaml
# turns it on; any other profile with it on fails.
postgres:
  enabled: false

# Off in the skeleton: only the umbrella's own templates render, each behind the profile gate, so an
# unset or unready profile fails with the gate's message rather than a subchart's. values-demo.yaml
# turns both on.
maku:
  enabled: false
maku-factory:
  enabled: false

# The model gateway (D7; docs/gateway.md), off by default. maku-gateway renders the Gateway, its
# policies, a backend and a route per model alias; its `runs` must equal maku's, and its broker
# ServiceAccount the broker's (room-broker). agentgateway is the upstream controller (v1.6.0): leave
# it off where the cluster already runs one. Its CRDs are applied first, apart from any Helm release
# (`kubectl apply --server-side -f config/agentgateway`, docs/gateway.md); Gateway API's standard CRDs
# (v1.2 or later) are a cluster prerequisite.
maku-gateway:
  enabled: false
  # GW12: the gateway's price catalog defaults to maku-factory.config.meter.prices, so a price has one
  # source; maku-gateway.modelCatalog.prices, when set, wins.
  modelCatalog: {umbrellaPrices: true}
agentgateway:
  enabled: false
  # As cnref runs it (ANR infrastructure/base/agentgateway): the controller by digest, no Istio
  # permissions, restricted, with limits. The chart has no liveness-probe value.
  controller:
    image:
      tag: "v1.6.0@sha256:d84259a7e2d87f8f39bae385d4b032d823c0a4450aecb32e0e31e2258449645b"
  istio:
    enabled: false
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

# Observability (D21; docs/observability.md), every switch off. Monitoring objects render only when
# asked, never on a guess at the cluster's CRDs, so offline renders (Flux, Argo CD, helm template) are
# deterministic: the prometheus-operator CRDs (monitoring.coreos.com/v1) must exist when one is on.
# The VictoriaMetrics operator converts them.
monitoring:
  # ServiceMonitors for the broker and the factory, PodMonitors for the run-controller, the egress
  # proxy (networkPolicies.mode kubernetes) and the model-gateway proxies (maku-gateway.enabled). The
  # scraper must be admitted wherever a default-deny policy holds the target: in maku's mode
  # kubernetes, maku.networkPolicies.kubernetes.metricsFrom; in its mode cilium, cilium.fromEndpoints
  # below; with maku-gateway's policy on, maku-gateway.metrics.allowFrom. The render fails otherwise.
  # labels: added to each object, for a Prometheus whose selector wants them (e.g. release:
  # kube-prometheus-stack).
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
    # maku's mode cilium: Cilium endpoint selectors of the scraper's pods, e.g.
    # [{matchLabels: {io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus}}].
    # They are admitted on :9090 of the broker and the run-controller (CNP maku-metrics).
    cilium:
      fromEndpoints: []
  # One PrometheusRule, maku, with a group per component, each rendered only with it: maku-rooms
  # (maku), maku-run-path (maku.runController), maku-factory (maku-factory), maku-slack
  # (slack.enabled), maku-gateway (maku-gateway; its cost cross-check also needs maku-factory). docs/operations.md#alerts lists every alert. In PromQL, tested by promtool.
  prometheusRule:
    enabled: false
    labels: {}
    # Alert names to leave out, e.g. one an install keeps its own variant of. A name no group holds
    # fails the render.
    disabled: []
    # The rules that read kube-state-metrics' kube_* series (AgentSandboxPodPending).
    kubeStateMetrics: false
    # Each alert's runbook_url base. Empty: https://github.com/Smana/maku/blob/v<appVersion>/docs.
    docsURL: ""
  # The product dashboards (docs/observability.md#dashboards), one ConfigMap each, maku-dashboard-<uid>,
  # holding <uid>.json: agents-overview, agent-factory, agent-room, agent-run, agent-identity,
  # agent-fleet, and agent-gateway with maku-gateway.enabled. labels: the set Grafana's dashboard
  # sidecar watches; empty, grafana_dashboard: "1". Set, they replace it (they are not merged with
  # it). annotations are added, e.g. {grafana_folder: Agents}. A grafana-operator
  # user points a GrafanaDashboard's configMapRef at each one. The uids are cloud-native-ref's, so
  # broker.human.dashboards links keep resolving.
  dashboards:
    enabled: false
    labels: {}
    annotations: {}

# The Slack App (D20). Its subchart arrives in a later v4 step 6 PR; until then, true only adds the
# maku-slack alert group and the expose.slack route, for a Slack App installed outside this chart
# (its Service factory-slack-app, port 8080).
slack:
  enabled: false

# Exposure (D19; docs/exposure.md), through the Gateway or Ingress the cluster already runs. none, the
# default, renders nothing. Two surfaces, each with its own hosts and its own parentRefs or ingress class,
# so the Slack events path can be public while the web stays on a private gateway:
#   web    the broker's human listener (the rooms UI, /api, /v1/ws, /mcp, /.well-known/roomctl,
#          /link/*), always through the web front door (webProxy, Service rooms-web-proxy);
#   slack  POST /slack/events only, to the Slack App's Service factory-slack-app (with slack.enabled).
# The factory polls GitHub and needs no public path. TLS is the gateway's or the Ingress's: the chart
# issues no certificate. In-cluster hops are plain HTTP inside the default-deny policies.
expose:
  mode: none                # none | httproute | ingress
  httproute:
    # Every surface's parentRefs, unless the surface sets its own: [{name, namespace, sectionName}].
    parentRefs: []
    # Rendered on the web route only when set, e.g. {request: 0s} where the gateway's default
    # request timeout would cut /v1/ws (Envoy-based gateways).
    timeouts: {}
  ingress:
    className: ""
    # Every surface's, e.g. cert-manager.io/cluster-issuer (the chart itself issues nothing).
    annotations: {}
  web:
    enabled: true           # with mode other than none
    hostnames: []
    parentRefs: []          # httproute: replaces expose.httproute.parentRefs for this surface
    className: ""           # ingress: replaces expose.ingress.className
    annotations: {}         # ingress: merged over expose.ingress.annotations
    tls: []                 # ingress only: [{secretName, hosts}], the user's Secret
  slack:
    enabled: true           # with mode other than none and slack.enabled
    hostnames: []
    parentRefs: []
    className: ""
    annotations: {}
    tls: []
  # Who may reach the exposed pods (the web proxy, the Slack App), in maku.networkPolicies' mode.
  networkPolicy:
    # mode kubernetes: NetworkPolicy peers of your gateway's or ingress controller's pods. Required.
    from: []
    cilium:
      # mode cilium: the Cilium identity of the gateway or ingress (Cilium's own Gateway and Ingress
      # are the ingress entity).
      fromEntities: [ingress]

# The web front door (D19, EX4; docs/exposure.md): oauth2-proxy (Deployment, Service and PDB
# rooms-web-proxy, and its policies) in front of the broker's :8080, its arguments derived from
# maku.broker.human: the issuer, the preset's scopes, the roles claim and groups, publicURL's
# callback, and the CLI client (maku.broker.oidc.existingSecret's cli key) as an extra JWT issuer, so
# `maku` bearers pass. It overwrites X-Forwarded-Access-Token on every request and strips it on its
# skip-auth routes (GET /.well-known/roomctl, and GET /link/github/callback with the GitHub account
# link). Required by expose.web in oidc mode; set maku.broker.webProxy to the same value, which opens
# the broker's :8080 to this proxy alone.
webProxy:
  enabled: false
  # oauth2-proxy v7.15.5, the version cloud-native-ref's chart (10.7.1) runs, by digest.
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
  replicas: 2
  # The Secret holding the web client and the cookie secret (D14), keys below. Required. The cookie
  # secret is 32 random bytes, base64url: openssl rand -base64 32 | tr -- '+/' '-_'.
  existingSecret: ""
  keys: {clientID: client-id, clientSecret: client-secret, cookieSecret: cookie-secret}
  # Under the ID token's lifetime: the only path on which oauth2-proxy checks a session's expiry.
  cookieRefresh: 1h
  # strict (the default) keeps the session off every cross-site request. It needs the IdP on the same
  # site as the web host, or the sign-in's return from the IdP arrives without its CSRF cookie: lax
  # for an IdP on another site (the broker still checks each request's Origin).
  cookieSameSite: strict
  metrics: {port: 44180}
  # Appended as --key=value. A key the chart derives may not be set here: the render fails naming it.
  extraArgs: {}
  # e.g. a private IdP CA: SSL_CERT_FILE plus a volume. Secrets only through valueFrom.secretKeyRef.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  networkPolicy:
    # The IdP's egress, on the issuer's port. Empty: in mode cilium, toFQDNs on the issuer's host; in
    # mode kubernetes, every public address (maku.networkPolicies.kubernetes.privateCIDRs excepted).
    # Set: in mode cilium, whole Cilium peers ({toFQDNs: ...}, {toEndpoints: ...}, {toCIDRSet: ...});
    # in mode kubernetes, NetworkPolicy peers (an in-cluster IdP: namespaceSelector, podSelector).
    idp:
      to: []
      port: 0               # 0: the issuer URL's (443 for https); a pod port when it differs
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
