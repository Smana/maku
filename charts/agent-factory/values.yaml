# The production-safe skeleton. These defaults render nothing on their own: `profile` must be set,
# and values.schema.json rejects unknown or malformed values.
#   - The demo is `-f values-demo.yaml` (profile: demo, with every demo default).
#   - `profile: production` fails closed until its seams arrive (v4 rollout steps 2 to 6).
# Install the agent-factory-crds chart first. Values may still change in 0.x minors until v4.0.0.
profile: ""

# Must equal `maku.clusterDomain` and `maku-factory.clusterDomain`: the broker certificate's SANs
# are built from it.
clusterDomain: cluster.local

maku:
  enabled: true
maku-factory:
  enabled: true
