# The laptop demo: kind or k3d, no Cilium, no cert-manager, no CNPG, no OIDC. Runs reach their model
# through the model gateway (step 7 R4; docs/gateway.md): no provider key enters the runs namespace.
# Install the CRD chart, Gateway API's and agentgateway's CRDs first, then:
#   helm install af-crds charts/agent-factory-crds -n maku --create-namespace
#   kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
#   kubectl apply --server-side -f config/agentgateway
#   helm install af charts/agent-factory -n maku -f charts/agent-factory/values-demo.yaml \
#     --set demo.model.apiKey=... --set demo.githubApp.id=... --set-file demo.githubApp.privateKey=... \
#     --set maku-gateway.identity.issuer=$(kubectl get --raw /.well-known/openid-configuration | jq -r .issuer) \
#     --set maku-gateway.providers.demo.host=api.example.com \
#     --set maku-gateway.aliases.public.agent-default.model=<model> --set maku-gateway.aliases.public.tier-light.model=<judge model>
# The apiserver must admit anonymous requests for the gateway's JWKS fetch: kind and kubeadm do; k3s
# needs --kube-apiserver-arg=anonymous-auth=true.
# These were the chart's defaults until v0.4x. They live here because Helm deep-merges maps: a
# production values file layered on demo defaults would inherit demo: true, factoryInsecure,
# unsafeAllowRunc and the rest. values.yaml is the production-safe skeleton.
profile: demo
# The marker the profile gate looks for. `--set profile=demo` without this file fails: a subchart
# reads only the values Helm hands it, so no parent helper can bring back the demo's maku: and
# maku-factory: values.
demoValues: true

# The two Secrets the demo needs, rendered by this chart unless an existing Secret is named.
demo:
  # The provider's key. In model.mode gateway (the demo's), only apiKey is read: it becomes the
  # provider's Secret demo-model in the release namespace, which maku-gateway.providers.demo names, and
  # the provider's URL and models are maku-gateway's values below. The other keys are model.mode
  # secret's (agent-model in the runs namespace: base_url, model, api_key, judge_model), refused in
  # gateway mode.
  model:
    existingSecret: ""
    baseURL: ""
    name: ""
    judgeName: ""
    apiKey: ""
  # agent-factory-github in the release namespace: keys app_id, private_key. ONE GitHub App backs
  # the factory, the merger and the run token (docs/factory.md#demo).
  githubApp:
    existingSecret: ""
    id: ""
    privateKey: ""

maku:
  enabled: true
  # The maku chart's own demo marker (v4 step 8, R4): it admits model.mode secret below.
  demoValues: true
  # The cluster has no Cilium: nothing confines the network. On a CNI that enforces NetworkPolicy
  # (k3s, kind from v0.24), --set maku.networkPolicies.mode=kubernetes confines the runs with plain
  # NetworkPolicies and the egress proxy (v4 D6).
  networkPolicies:
    mode: none
  # No gVisor on a laptop: runs use the node's own runtime (runc), on the install banner (D18).
  sandbox:
    runtimeClassName: ""
    unsafeAllowRunc: true
  runs:
    group: maku.ogenki.io
    namespace: agents
    namePrefix: run-
  broker:
    # One loopback user behind a port-forward, no identity provider.
    human: {mode: local}
    # The :8090 room tools, where a reviewer records its verdict. No gateway stands in front, so the
    # broker verifies each run's own token (audience room-tools) through the apiserver, and the run
    # controller hands the harness http://room-broker.<ns>.svc.<clusterDomain>:8090/mcp: plain HTTP,
    # in-cluster only, acceptable for the demo; production keeps a gateway and its key (auth: key).
    roomTools: {enabled: true, auth: tokenreview}
    # The apiserver vouches for the runs and for the factory (kind's issuer is not reachable).
    runIssuer: {mode: tokenreview}
    systemIssuer: {mode: tokenreview}
    # `{{ .Release.Namespace }}` is rendered by the maku chart.
    systemPrincipals:
      "system:serviceaccount:{{ .Release.Namespace }}:agent-factory": system:factory
    # The factory's API has no TLS in the demo, and nothing reaches it but the broker.
    factoryURL: http://agent-factory:8082
    factoryInsecure: true
    database:
      brokerSecret: rooms-broker-dsn
      ownerSecret: rooms-owner-dsn
      # The daily purge, as rooms_retention (the CronJob room-broker-retention).
      retentionSecret: rooms-retention-dsn
      # The umbrella's Postgres, for the broker's NetworkPolicy in mode kubernetes.
      podLabels: {app.kubernetes.io/name: rooms-db}
    # The certificate is the umbrella's (tls.yaml), not cert-manager's.
    tls:
      issuerRef: {name: ""}
  runController:
    # Runs call this release's model-gateway with their own projected token (D7). model.mode secret,
    # the provider key in the sandbox, stays a demo-only switch (maku.demoValues admits it).
    model:
      mode: gateway
      gateway:
        # service and namespace empty: this release's model-gateway. The demo's tiers all name
        # agent-default; its loops' judge is tier-light.
        aliases: {public: [agent-default, tier-light], internal: []}
    createRuntimeClass: false
    # Each run mounts its own token Secret, <run name>-git, minted by the factory for the run's
    # repository and role (v4 D10), with maku-factory.runTokens.perRun.
    gitTokens: perRun
    gitReadSecret: ""
  # Only the factory creates AgentRuns: it mints a token for every run it can account for, so no
  # other creator may hand it one (plan PR4). Its AgentRun updates touch three annotations only.
  # The demo installs into namespace maku; another release namespace names its own factory here.
  agentRunPolicies:
    creators: ["system:serviceaccount:maku:agent-factory"]
    factoryServiceAccount: agent-factory
maku-factory:
  enabled: true
  demo: true
  replicas: 1
  # Per-run tokens (v4 D10), from the demo's one App: the factory writes each run's own Secret.
  runTokens:
    perRun: true
  # One App (v4 D12): the merger signs with the factory App's files, which the chart writes as
  # config.github.mergerAppIDFile and mergerKeyFile; no merger Secret is mounted.
  apps:
    merger:
      mode: factory
  # The demo's config, passed through `tpl`: `{{ .Release.Namespace }}` and the cluster domain are
  # the release's. Name the repository, the maintainers and the App's three bot logins (the slug of
  # the one App, as `<slug>[bot]`) to match yours, and the check names its CI reports.
  config:
    demo: true
    factory: demo
    factoryLogin: maku-demo[bot]
    agentsLogin: maku-demo[bot]
    roomsURL: http://localhost:8080
    broker:
      url: https://room-broker.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:8443
      caFile: /etc/agent-factory/openbao-ca/ca.crt
      tokenFile: /var/run/secrets/agents/rooms/token
    # The same portable kind as maku.runs.
    # The runs carry a gateway identity, so a meter can price them (GW10). The demo has no meter: set
    # maku-factory.config.meter (url, query, throttle.promQuery and prices) to price runs.
    runs:
      group: maku.ogenki.io
      namespace: agents
      namePrefix: run-
      gatewayIdentity: true
    # One App: apps.merger.mode factory adds the merger's files, the factory's own.
    github:
      appIDFile: /etc/agent-factory-github/app_id
      privateKeyFile: /etc/agent-factory-github/private_key
    poll: {issues: 60s, tasks: 30s, meter: 30s}
    defaults: {template: solo, tier: standard, dataClass: public, predictedClass: review}
    # The loop is scoper, implementer, completion judge, reviewer, gate. Without a row a class has no
    # scope and no judge. `revert` gets none: it is mechanical.
    loops:
      review: {scope: scoper, judge: tier-light}
      docs-links: {scope: scoper, judge: tier-light}
    # A values file replaces this list whole: restate the entire entry (see values-mine.example.yaml)
    # with the name, maintainers, mergerLogin and the three check names changed.
    repositories:
      - name: owner/repo
        maintainers: [owner]
        triggerLabel: factory/ready
        # Shadow: the factory judges and posts the gate's status, and merges nothing on its own. Every
        # class carries allowedFiles, which is what bounds a merge with no policy-bot.
        classes:
          docs-links: {shadow: true, allowedFiles: ['^.+\.(md|mdx|adoc|rst)$']}
          revert: {shadow: true, allowedFiles: ['^.+$']}
        merge:
          requiredChecks: [ci]
          verifyChecks: [ci]
          leakScanCheck: ci
          gateStatus: true
          policyBot: false
          # Approve-to-merge: a maintainer's approval of the current head is the merge, shadow class
          # or not. The merger merges that head as a human merge (factory/approved-merge, no
          # automatic revert); off, the room shows the approval and a maintainer merges on GitHub.
          approveToMerge: true
          mergerLogin: maku-demo[bot]
          autoMergesPerDay: 5
          fixRuns: 2
          checkReruns: 1
          verifyFor: 30m
          revertWindow: 168h
          breaker: {window: 10, maxReverts: 1}
    tiers:
      light: {model: agent-default, runTokens: 300000, taskTokens: 600000, runMinutes: 20}
      standard: {model: agent-default, runTokens: 1500000, taskTokens: 3000000, runMinutes: 45}
      frontier: {model: agent-default, runTokens: 4000000, taskTokens: 8000000, runMinutes: 90}
    templates:
      solo: {roles: [implementer, reviewer], maxReviewRounds: 2}
      pair: {roles: [implementer, reviewer], maxReviewRounds: 2}
      # Triage picks the template by class and tier (its matrix), and `defaults.template` is ignored,
      # so every template triage can choose must exist. `solo` carries the reviewer so the demo loop
      # has one; the tester role is deprecated, so `trio` is a pair here.
      trio: {roles: [implementer, reviewer], maxReviewRounds: 2}
      investigate: {roles: [triager]}
    caps: {activeTasks: 3, concurrentRuns: 2, tasksPerDay: 20, maxTextBytes: 14336, awaitingHumanWIP: 5}
    api:
      listen: ":8082"

# The model gateway (D7; docs/gateway.md): agentgateway's controller and maku-gateway, in the release
# namespace, with the demo's one OpenAI-compatible provider.
agentgateway:
  enabled: true
maku-gateway:
  enabled: true
  replicas: 1
  identity:
    issuer: "" # this cluster's ServiceAccount issuer: required
    # kind and k3d's issuer is not reachable from outside: the gateway reads the apiserver's JWKS, which
    # its controller fetches anonymously (public keys only).
    jwks: {source: apiserver, allowAnonymousDiscovery: true}
  providers:
    # Its key is demo-model, which the umbrella renders from demo.model.apiKey.
    demo:
      preset: custom
      existingSecret: demo-model
      key: apiKey
      host: "" # e.g. api.example.com
      port: 443
      path: /v1/chat/completions
      tls: true
  aliases:
    public:
      agent-default: {provider: demo, model: ""}
      tier-light: {provider: demo, model: ""}

tls:
  # Validity of the generated CA and broker certificate, in days. Both are kept across upgrades.
  days: 3650
  caName: maku-demo-ca

postgres:
  # The bundled Postgres, demo-only (v4 D9). Set false to bring your own: the broker then reads the
  # three DSN Secrets above, which you create (docs/database.md).
  enabled: true
  # postgres:17, pinned by digest.
  image: docker.io/library/postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
  storage: 1Gi
  # Empty: the cluster's default StorageClass (kind and k3d both provide one).
  storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

networkPolicies:
  # Plain Kubernetes NetworkPolicies (no Cilium in the demo): ingress to rooms-db only from the
  # broker, and to the factory's API port only from the broker (its ops/probe port stays open to all, its
  # intake port is closed). Runs keep their egress. Needs a CNI that
  # enforces NetworkPolicy (k3s does; kind from v0.24 with kindnet).
  plain: true
