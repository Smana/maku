---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tasks.maku.ogenki.io
spec:
  group: maku.ogenki.io
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.source.ref
      name: Source
      type: string
    - jsonPath: .spec.predictedClass
      name: Class
      type: string
    - jsonPath: .spec.template
      name: Template
      type: string
    - jsonPath: .status.pullRequest.url
      name: PR
      type: string
    - jsonPath: .status.usage.tokens
      name: Tokens
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Task is one unit of factory work (SP3 §4). The factory creates it at runtime and never
          commits it to Git. Its name derives from the idempotency key, so AlreadyExists is the dedup.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TaskSpec is what the task was asked to do, fixed at admission.
            properties:
              budget:
                description: Budget is the task's tier and caps, resolved at triage.
                properties:
                  model:
                    maxLength: 64
                    type: string
                  runMicroUSD:
                    description: |-
                      The USD caps in micro-dollars (OD-6 (b)): a run's, and the task's in place of TaskTokens
                      while every run of the task is priced. 0: the token caps.
                    format: int64
                    minimum: 0
                    type: integer
                  runMinutes:
                    format: int64
                    maximum: 480
                    type: integer
                  runTokens:
                    description: The per-run cap; SP1's XRD refuses more than the
                      gateway ceiling (C3).
                    format: int64
                    maximum: 5000000
                    type: integer
                  taskMicroUSD:
                    format: int64
                    minimum: 0
                    type: integer
                  taskTokens:
                    format: int64
                    type: integer
                  tier:
                    enum:
                    - light
                    - standard
                    - frontier
                    type: string
                type: object
              coordination:
                description: Coordination is a parent's switch values (MR1, MR16),
                  fixed at creation.
                properties:
                  maxChildren:
                    format: int32
                    type: integer
                    x-kubernetes-validations:
                    - message: maxChildren is 2 in this release (MR1)
                      rule: self == 2
                  publicOnly:
                    type: boolean
                    x-kubernetes-validations:
                    - message: publicOnly is true in this release (MR16)
                      rule: self
                required:
                - maxChildren
                - publicOnly
                type: object
              coordinationArtifacts:
                description: CoordinationArtifacts are the landed references a dependent
                  child was created with (MR7).
                items:
                  description: |-
                    LandedArtifact is a produced file as read at the producer's landed merge commit: the only
                    thing a dependency consumes (MR7).
                  properties:
                    blobSHA:
                      maxLength: 40
                      pattern: ^[0-9a-f]{40}$
                      type: string
                    childID:
                      maxLength: 32
                      type: string
                    contentSHA256:
                      maxLength: 64
                      pattern: ^[0-9a-f]{64}$
                      type: string
                    mergeCommitSHA:
                      maxLength: 40
                      pattern: ^[0-9a-f]{40}$
                      type: string
                    name:
                      maxLength: 64
                      type: string
                    path:
                      maxLength: 512
                      minLength: 1
                      type: string
                    repository:
                      maxLength: 140
                      pattern: ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$
                      type: string
                    sizeBytes:
                      format: int64
                      maximum: 65536
                      minimum: 0
                      type: integer
                  required:
                  - blobSHA
                  - childID
                  - contentSHA256
                  - mergeCommitSHA
                  - name
                  - path
                  - repository
                  - sizeBytes
                  type: object
                maxItems: 8
                type: array
              coordinationParent:
                description: CoordinationParent is a child's or an integration Task's
                  parent (MR2), fixed at creation.
                properties:
                  childID:
                    maxLength: 32
                    pattern: ^[a-z][a-z0-9-]{0,31}$
                    type: string
                  planVersion:
                    format: int32
                    minimum: 1
                    type: integer
                  task:
                    maxLength: 8
                    pattern: ^[a-z2-7]{8}$
                    type: string
                required:
                - planVersion
                - task
                type: object
              dataClass:
                description: Every run of the task gets it as spec.dataClass (C3,
                  OD-13).
                enum:
                - public
                - internal
                type: string
              findings:
                description: |-
                  The findings an oracle class's probe made this task of (merge gate classes MC6): what the
                  run is asked to fix, and what the gate's oracle checks the head no longer holds.
                items:
                  description: Finding is one dead external link two consecutive detector
                    runs on main reported (MC5).
                  properties:
                    archive:
                      description: |-
                        The Wayback Machine's closest snapshot of URL, an https://web.archive.org/web/ URL; empty
                        when it has none.
                      maxLength: 2048
                      pattern: ^https://web\.archive\.org/web/
                      type: string
                    file:
                      description: The Markdown file on main that holds the link.
                      maxLength: 512
                      minLength: 1
                      type: string
                    url:
                      description: The link target, an https URL.
                      maxLength: 2048
                      minLength: 1
                      pattern: ^https://
                      type: string
                  required:
                  - file
                  - url
                  type: object
                maxItems: 16
                type: array
              intake:
                description: |-
                  Intake is what a planned api task brought from intake (P7): the plan's class and the
                  planner's suggested profile, and the sponsor's resolved login. Fixed at creation.
                properties:
                  class:
                    maxLength: 63
                    pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                    type: string
                  login:
                    maxLength: 64
                    type: string
                  profile:
                    description: |-
                      Profile is the profile the plan pinned (P5): a pin only when Login maintains the repository at
                      triage, which checks it again (P6).
                    maxLength: 63
                    pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                    type: string
                  suggested:
                    maxLength: 63
                    pattern: ^[a-z0-9][a-z0-9-]{0,62}$
                    type: string
                type: object
              integration:
                description: Integration is an integration Task's exact subjects (MR10),
                  fixed at creation.
                properties:
                  planHash:
                    maxLength: 64
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  purpose:
                    enum:
                    - beforeDependentMerge
                    - final
                    type: string
                  subjects:
                    items:
                      description: |-
                        IntegrationSubject is one child at an exact commit: a PR head before its merge, or its landed
                        merge commit, never both.
                      properties:
                        childID:
                          maxLength: 32
                          type: string
                        headSHA:
                          maxLength: 40
                          pattern: ^[0-9a-f]{40}$
                          type: string
                        mergeCommitSHA:
                          maxLength: 40
                          pattern: ^[0-9a-f]{40}$
                          type: string
                        repository:
                          maxLength: 140
                          pattern: ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$
                          type: string
                      required:
                      - childID
                      - repository
                      type: object
                      x-kubernetes-validations:
                      - message: an integration subject names exactly one of headSHA
                          or mergeCommitSHA
                        rule: has(self.headSHA) != has(self.mergeCommitSHA)
                    maxItems: 2
                    minItems: 1
                    type: array
                required:
                - planHash
                - purpose
                - subjects
                type: object
              issue:
                description: The issue the factory narrates on; 0 for a task without
                  one (R28).
                minimum: 0
                type: integer
              issueAuthor:
                description: The issue's author on GitHub, for the room list's "mine"
                  filter.
                maxLength: 64
                type: string
              kind:
                description: |-
                  Kind is coordination for a parent and integration for an integration attempt (MR2); absent,
                  the Task is an ordinary work Task, a coordination child included.
                enum:
                - coordination
                - integration
                type: string
              loop:
                description: |-
                  The loop policy its implementer runs get as spec.loop, resolved from loops.<class> at
                  triage so a config change never moves a task already triaged (loops design L2, L3). Unset:
                  the loop is off for the task's class.
                properties:
                  continuations:
                    format: int32
                    maximum: 5
                    minimum: 0
                    type: integer
                  judgeModel:
                    description: |-
                      The judge's alias; empty: no judge. mistral-light, the one provider alias a judge may take
                      (v3 F15, F3), is a public task's only.
                    enum:
                    - agent-default
                    - tier-light
                    - tier-standard
                    - tier-frontier
                    - mistral-light
                    type: string
                  stallSteps:
                    format: int32
                    maximum: 500
                    minimum: 1
                    type: integer
                required:
                - continuations
                - stallSteps
                type: object
              maxMicroUSD:
                description: |-
                  The request's ceiling in micro-USD (F4, R5): triage caps the task and each run under it. Set
                  on api tasks only; 0 elsewhere.
                format: int64
                maximum: 1000000000
                minimum: 0
                type: integer
                x-kubernetes-validations:
                - message: maxMicroUSD never changes
                  rule: self == oldSelf
              origin:
                description: |-
                  Origin is the investigate task whose published issue this task was started from (RunLore
                  agent-to-agent RA9): set by the issue poller from that task's status.published, never from
                  issue text, so nothing a person or an agent writes can forge one.
                maxLength: 8
                pattern: ^[a-z2-7]{8}$
                type: string
                x-kubernetes-validations:
                - message: origin never changes
                  rule: self == oldSelf
              parent:
                description: The parent this task is a part of (SL5), fixed at creation;
                  unset for any other task.
                properties:
                  index:
                    format: int32
                    maximum: 5
                    minimum: 1
                    type: integer
                  issue:
                    minimum: 1
                    type: integer
                  of:
                    format: int32
                    maximum: 5
                    minimum: 2
                    type: integer
                  task:
                    maxLength: 8
                    pattern: ^[a-z2-7]{8}$
                    type: string
                required:
                - index
                - issue
                - of
                - task
                type: object
                x-kubernetes-validations:
                - message: a part's index is at most its count
                  rule: self.index <= self.of
              predictedClass:
                description: 'Intent, not authority: it picks team and budget; only
                  policy-bot merges (§2).'
                maxLength: 64
                type: string
              repository:
                maxLength: 140
                pattern: ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$
                type: string
              scope:
                description: 'This child''s part of its parent''s task (SL5): one
                  scope of the approved split, fixed once set.'
                properties:
                  acceptance:
                    items:
                      description: TaskAcceptance is one acceptance check of a part.
                      properties:
                        check:
                          maxLength: 300
                          minLength: 1
                          type: string
                        proves:
                          maxLength: 200
                          minLength: 1
                          type: string
                      required:
                      - check
                      - proves
                      type: object
                    maxItems: 5
                    minItems: 1
                    type: array
                  assumptions:
                    items:
                      maxLength: 300
                      type: string
                    maxItems: 5
                    type: array
                  leave:
                    items:
                      maxLength: 200
                      type: string
                    maxItems: 10
                    type: array
                  plan:
                    items:
                      maxLength: 300
                      type: string
                    maxItems: 7
                    minItems: 1
                    type: array
                  state:
                    enum:
                    - ready
                    type: string
                  task:
                    maxLength: 1000
                    minLength: 1
                    type: string
                  touches:
                    items:
                      maxLength: 200
                      type: string
                    maxItems: 10
                    minItems: 1
                    type: array
                required:
                - acceptance
                - plan
                - state
                - task
                - touches
                type: object
              scopeMode:
                description: |-
                  The class's scope mode (scoper design SC2), fixed at triage so a config change never moves a
                  task already triaged. Empty: triaged before the scoper existed, which reads as off.
                enum:
                - "off"
                - steering
                - scoper
                type: string
              search:
                description: |-
                  Search offers its implementer runs the search tool (v3 feature 5, ST9), read from
                  loops.<class>.search at triage so a config change never moves a task already triaged; every
                  implementer claim of the task carries spec.loop.search.
                type: boolean
              source:
                description: |-
                  Source is where the task came from and how far its text is trusted. No rule holds the whole
                  source: the splitter's inherit() rewrites contentSHA256 of a re-labelled part, so only the
                  fields F4 adds, and the kind, are held (C1).
                properties:
                  contentSHA256:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  key:
                    maxLength: 512
                    type: string
                  kind:
                    description: |-
                      adopt: another author's pull request the factory decides (merge gate MC10).
                      coordination: a coordination parent or integration Task (MR2); a child is an issue.
                    enum:
                    - issue
                    - runlore
                    - schedule
                    - api
                    - adopt
                    - coordination
                    type: string
                  onBehalfOf:
                    description: 'The external user a link made the sponsor (R9):
                      slack:<team>/<user>.'
                    maxLength: 64
                    pattern: ^slack:T[A-Z0-9]{2,20}/[UW][A-Z0-9]{2,20}$
                    type: string
                  ref:
                    description: Smana/cloud-native-ref#2112 (owner/name#<n>), runlore:<alert>/<resource>,
                      or the schedule name.
                    maxLength: 512
                    type: string
                  requestedBy:
                    description: github:<login> (an adopted pull request's author
                      too), system:runlore or system:scheduler.
                    maxLength: 128
                    type: string
                  sponsor:
                    description: 'The maintainer accountable for an api task, as a
                      ledger key (F4, R8): github:<login>.'
                    maxLength: 46
                    pattern: ^github:[a-z0-9][a-z0-9-]{0,38}$
                    type: string
                  trust:
                    description: untrusted text is fenced as data for the harness
                      (T1).
                    enum:
                    - untrusted
                    - trusted
                    type: string
                required:
                - contentSHA256
                - key
                - kind
                - ref
                - requestedBy
                - trust
                type: object
                x-kubernetes-validations:
                - message: an api task names its sponsor
                  rule: self.kind != 'api' || (has(self.sponsor) && size(self.sponsor)
                    > 0)
                - message: only an api task has a sponsor
                  rule: self.kind == 'api' || (!has(self.sponsor) && !has(self.onBehalfOf))
                - message: a task's source kind never changes
                  rule: self.kind == oldSelf.kind
                - message: source.sponsor never changes
                  rule: has(self.sponsor) == has(oldSelf.sponsor) && (!has(self.sponsor)
                    || self.sponsor == oldSelf.sponsor)
                - message: source.onBehalfOf never changes
                  rule: has(self.onBehalfOf) == has(oldSelf.onBehalfOf) && (!has(self.onBehalfOf)
                    || self.onBehalfOf == oldSelf.onBehalfOf)
              split:
                description: |-
                  The split the scoper may offer (splitter design SL3), recorded at triage when the class's row
                  has one and C7's own tier is frontier; unset: no split offered.
                properties:
                  childTier:
                    enum:
                    - light
                    - standard
                    - frontier
                    type: string
                  familyMicroUSD:
                    description: 'The family''s cap in micro-dollars (SL10): the parent''s
                      and every child''s runs together.'
                    format: int64
                    minimum: 1
                    type: integer
                  maxChildren:
                    format: int32
                    maximum: 5
                    minimum: 2
                    type: integer
                required:
                - childTier
                - familyMicroUSD
                - maxChildren
                type: object
              steering:
                description: The class's steering note, read on the default branch
                  at triage (SC3); unset for none.
                properties:
                  path:
                    maxLength: 256
                    type: string
                  sha:
                    description: The note's git blob sha on the default branch.
                    maxLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  text:
                    maxLength: 2048
                    type: string
                required:
                - path
                - sha
                - text
                type: object
              template:
                enum:
                - solo
                - pair
                - trio
                - investigate
                type: string
              text:
                description: The snapshot. Admission caps it at caps.maxTextBytes
                  (R6); this bound only protects etcd.
                maxLength: 65536
                type: string
            required:
            - dataClass
            - repository
            - source
            - text
            type: object
            x-kubernetes-validations:
            - message: spec.parent is fixed at creation
              rule: has(self.parent) == has(oldSelf.parent) && (!has(self.parent)
                || self.parent == oldSelf.parent)
            - message: spec.origin is fixed at creation
              rule: has(self.origin) == has(oldSelf.origin)
            - message: spec.scope never changes once set
              rule: '!has(oldSelf.scope) || (has(self.scope) && self.scope == oldSelf.scope)'
            - message: spec.intake is fixed at creation
              rule: has(self.intake) == has(oldSelf.intake) && (!has(self.intake)
                || self.intake == oldSelf.intake)
            - message: an api task carries maxMicroUSD
              rule: self.source.kind != 'api' || (has(self.maxMicroUSD) && self.maxMicroUSD
                > 0)
            - message: an api task's budget stays under its ceiling
              rule: self.source.kind != 'api' || !has(self.budget) || (has(self.maxMicroUSD)
                && (!has(self.budget.runMicroUSD) || self.budget.runMicroUSD <= self.maxMicroUSD)
                && (!has(self.budget.taskMicroUSD) || self.budget.taskMicroUSD <=
                self.maxMicroUSD))
            - message: a provider judgeModel is a public task's only
              rule: '!has(self.loop) || !has(self.loop.judgeModel) || self.loop.judgeModel
                != ''mistral-light'' || self.dataClass == ''public'''
            - message: spec.kind is fixed at creation
              rule: has(self.kind) == has(oldSelf.kind) && (!has(self.kind) || self.kind
                == oldSelf.kind)
            - message: spec.coordinationParent is fixed at creation
              rule: has(self.coordinationParent) == has(oldSelf.coordinationParent)
                && (!has(self.coordinationParent) || self.coordinationParent == oldSelf.coordinationParent)
            - message: spec.coordination is fixed at creation
              rule: has(self.coordination) == has(oldSelf.coordination) && (!has(self.coordination)
                || self.coordination == oldSelf.coordination)
            - message: spec.integration is fixed at creation
              rule: has(self.integration) == has(oldSelf.integration) && (!has(self.integration)
                || self.integration == oldSelf.integration)
            - message: spec.coordinationArtifacts are fixed at creation
              rule: has(self.coordinationArtifacts) == has(oldSelf.coordinationArtifacts)
                && (!has(self.coordinationArtifacts) || self.coordinationArtifacts
                == oldSelf.coordinationArtifacts)
            - message: a coordination or integration task, and only one, has source
                kind coordination (MR2)
              rule: has(self.kind) == (self.source.kind == 'coordination')
            - message: a coordination parent, and only one, has spec.coordination
              rule: has(self.coordination) == (has(self.kind) && self.kind == 'coordination')
            - message: an integration task, and only one, has spec.integration
              rule: has(self.integration) == (has(self.kind) && self.kind == 'integration')
            - message: a coordination parent has no template, tier or implementation
                budget (MR2)
              rule: '!has(self.kind) || self.kind != ''coordination'' || (!has(self.template)
                && (!has(self.budget) || (!has(self.budget.tier) && !has(self.budget.model)
                && !has(self.budget.runTokens) && !has(self.budget.taskTokens) &&
                !has(self.budget.runMinutes) && !has(self.budget.runMicroUSD) && !has(self.budget.taskMicroUSD))))'
            - message: a coordination parent has no lineage or scope of its own (MR2)
              rule: '!has(self.kind) || self.kind != ''coordination'' || (!has(self.coordinationParent)
                && !has(self.parent) && !has(self.split) && !has(self.scope))'
            - message: a coordination child names its childID
              rule: '!has(self.coordinationParent) || has(self.kind) || has(self.coordinationParent.childID)'
            - message: 'a coordination child is never a splitter part: no spec.parent,
                no spec.split (MR2)'
              rule: '!has(self.coordinationParent) || has(self.kind) || (!has(self.parent)
                && !has(self.split))'
            - message: a coordination child is an issue task
              rule: '!has(self.coordinationParent) || has(self.kind) || self.source.kind
                == ''issue'''
            - message: an integration task names its parent and no childID (MR10)
              rule: '!has(self.kind) || self.kind != ''integration'' || (has(self.coordinationParent)
                && !has(self.coordinationParent.childID) && !has(self.parent) && !has(self.split)
                && !has(self.scope))'
            - message: only a coordination child consumes landed artifacts (MR7)
              rule: '!has(self.coordinationArtifacts) || (has(self.coordinationParent)
                && !has(self.kind))'
            - message: a coordination family is public only (MR16)
              rule: (!has(self.kind) && !has(self.coordinationParent)) || self.dataClass
                == 'public'
          status:
            description: |-
              TaskStatus is the task's audit record: the whole §4 record, including the fields later
              phases fill.
            properties:
              checkReruns:
                description: |-
                  Re-runs of a cancelled required check, capped by merge.checkReruns. A cancelled check is
                  not a failure, so it never spends a fix run.
                format: int32
                type: integer
              checkRerunsHead:
                description: 'The head CheckReruns counts against: a new head resets
                  it.'
                maxLength: 64
                type: string
              classification:
                description: The C7 answer, recorded as-is (§2).
                properties:
                  classifier:
                    maxLength: 128
                    type: string
                  confidence:
                    description: '0.0–1.0, as a string: CRDs avoid floats.'
                    maxLength: 16
                    type: string
                  control:
                    description: 'OD-14: forced to tier-frontier whatever the classifier
                      said.'
                    type: boolean
                  fallback:
                    enum:
                    - none
                    - default
                    - static
                    type: string
                  fit:
                    description: 'Scored when the task ends (§7): under, over or fit.'
                    maxLength: 16
                    type: string
                  shadow:
                    items:
                      description: 'ShadowVerdict is a classifier consulted in shadow:
                        recorded, never acted on.'
                      properties:
                        classifier:
                          maxLength: 128
                          type: string
                        confidence:
                          maxLength: 16
                          type: string
                        tier:
                          maxLength: 16
                          type: string
                      required:
                      - classifier
                      - tier
                      type: object
                    maxItems: 16
                    type: array
                  tier:
                    enum:
                    - light
                    - standard
                    - frontier
                    type: string
                required:
                - classifier
                - fallback
                - tier
                type: object
              configGenerations:
                description: |-
                  The generations of the factory's resources the task was triaged under (factory resources
                  D5): recorded, not pinned. Unset when every generation is zero (the file served it).
                properties:
                  factory:
                    format: int64
                    type: integer
                  mergePolicy:
                    format: int64
                    type: integer
                  repository:
                    format: int64
                    type: integer
                type: object
              configHash:
                description: 'The config that triaged the task: the circuit breaker
                  resets with a new one (§6.4).'
                maxLength: 64
                type: string
              contract:
                description: |-
                  The test contract (v3 feature 4, TF4, R14): the tester run's commit on agent/<task> as GitHub
                  recorded it, its test files and ids. Set once, when the tester's push is read; every implementer
                  run is held to it and the merge gate requires merge.contractCheck (rows 2b, 2c).
                properties:
                  commit:
                    maxLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  files:
                    items:
                      maxLength: 512
                      type: string
                    maxItems: 50
                    minItems: 1
                    type: array
                  ids:
                    items:
                      maxLength: 512
                      type: string
                    maxItems: 50
                    minItems: 1
                    type: array
                  runId:
                    maxLength: 253
                    type: string
                required:
                - commit
                - files
                - ids
                - runId
                type: object
              coordination:
                description: Coordination is a parent's family record or a child's
                  lineage (MR2).
                properties:
                  acceptance:
                    description: The final integration that let the parent be Done
