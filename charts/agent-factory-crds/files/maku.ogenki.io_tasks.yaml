        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a Task is named with a C2 id: 8 characters of [a-z2-7]'
          rule: self.metadata.name.matches('^[a-z2-7]{8}$')
        - message: a coordination parent has no run, pull request, next role or next
            trigger (MR2)
          rule: '!has(self.spec.kind) || self.spec.kind != ''coordination'' || !has(self.status)
            || (!has(self.status.nextRole) && !has(self.status.nextTrigger) && !has(self.status.pullRequest)
            && !has(self.status.runs))'
        - message: an integration task has no implementation pull request (MR10)
          rule: '!has(self.spec.kind) || self.spec.kind != ''integration'' || !has(self.status)
            || !has(self.status.pullRequest)'
        - message: an integration task runs only triager (MR10, MR17)
          rule: '!has(self.spec.kind) || self.spec.kind != ''integration'' || !has(self.status)
            || !has(self.status.runs) || self.status.runs.all(r, r.role == ''triager'')'
        - message: only a coordination parent is Coordinating
          rule: '!has(self.status) || !has(self.status.phase) || self.status.phase
            != ''Coordinating'' || (has(self.spec.kind) && self.spec.kind == ''coordination'')'
        - message: status.coordination is a parent's record, or a child's lineage
            under its own childID
          rule: '!has(self.status) || !has(self.status.coordination) || (has(self.status.coordination.childID)
            ? (!has(self.spec.kind) && has(self.spec.coordinationParent) && has(self.spec.coordinationParent.childID)
            && self.status.coordination.childID == self.spec.coordinationParent.childID)
            : (has(self.spec.kind) && self.spec.kind == ''coordination''))'
        - message: status.result is an integration task's
          rule: '!has(self.status) || !has(self.status.result) || (has(self.spec.kind)
            && self.spec.kind == ''integration'')'
    served: true
    storage: true
    subresources:
      status: {}
