{{- /* Maku's own copy of two of cloud-native-ref's Kyverno rules (agentrun-one-creator,
agentrun-factory-patch-limit), as in-tree ValidatingAdmissionPolicies (v4 D17), so ANR can delete
its duplicates. Each renders only when its value is set: an install opts in. Not gated on
runController.enabled: the XR install (cloud.ogenki.io) is the one that opts in first. Like the
Kyverno originals they hold every namespace, unless agentRunPolicies.namespaces narrows them. */ -}}
{{- $p := .Values.agentRunPolicies | default dict -}}
{{- define "ap.agentRunBinding" -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .name }}
  labels: {{- include "ap.labels" .root | nindent 4 }}
spec:
  policyName: {{ .name }}
  validationActions: [Deny]
  {{- with .namespaces }}
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: kubernetes.io/metadata.name, operator: In, values: {{ toJson . }}}
  {{- end }}
{{- end -}}
{{- with $p.creators }}
{{- $name := printf "maku-%s-agentrun-creators" $.Release.Namespace }}
{{- $quoted := list }}
{{- range . }}
{{- if or (contains "'" .) (contains "\\" .) }}{{ fail (printf "agentRunPolicies.creators: %q holds a quote or a backslash, which would break out of the CEL string" .) }}{{ end }}
{{- $quoted = append $quoted (printf "'%s'" .) }}
{{- end }}
# Only the listed users (the factory) create AgentRuns (C3).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels: {{- include "ap.labels" $ | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [{{ $.Values.runs.group | quote }}]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [agentruns]
  validations:
    - expression: {{ printf "request.userInfo.username in [%s]" (join ", " $quoted) | quote }}
      message: "only the factory creates AgentRuns (C3): POST /v1/runs, or the room's hand-to-role"
---
{{ include "ap.agentRunBinding" (dict "root" $ "name" $name "namespaces" $p.namespaces) }}
{{- end }}
{{- with $p.factoryServiceAccount }}
{{- $name := printf "maku-%s-agentrun-factory-patch-limit" $.Release.Namespace }}
{{- if $p.creators }}
---
{{- end }}
# The factory's updates of an AgentRun touch three annotations only: the meter's usage-tokens, the
# pull request and the revoke. Never the spec, never the labels.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels: {{- include "ap.labels" $ | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [{{ $.Values.runs.group | quote }}]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [agentruns]
  matchConditions:
    - name: the-factory
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" $.Release.Namespace . | quote }}
  variables:
    - name: allowed
      expression: "['agents.ogenki.io/usage-tokens', 'agents.ogenki.io/pull-request', 'agents.ogenki.io/revoked']"
    - name: new
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: old
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
  validations:
    - expression: "object.spec == oldObject.spec"
      message: "the factory never changes an AgentRun's spec"
    - expression: "(has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})"
      message: "the factory never changes an AgentRun's labels"
    - expression: >-
        variables.new.all(k, k in variables.allowed || (k in variables.old && variables.old[k] == variables.new[k])) &&
        variables.old.all(k, k in variables.allowed || k in variables.new)
      message: "the factory changes only the usage-tokens, pull-request and revoked annotations"
---
{{ include "ap.agentRunBinding" (dict "root" $ "name" $name "namespaces" $p.namespaces) }}
{{- end }}
