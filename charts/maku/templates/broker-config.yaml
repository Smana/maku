{{- $b := .Values.broker -}}
{{- $local := include "ap.local" . -}}
{{- include "ap.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: room-broker-config
  labels: {{- include "ap.labels" . | nindent 4 }}
data:
  # Strictly decoded by the broker (internal/config): an unknown key fails the rollout. tls is
  # left to its default, /etc/room-broker/tls/tls.{crt,key}, where the Deployment mounts the pair.
  config.yaml: |
    {{- if $local }}
    publicURL: {{ $b.publicURL | default "http://localhost:8080" | quote }}
    {{- else if $b.publicURL }}
    publicURL: {{ $b.publicURL | quote }}
    {{- end }}
    runs:
      {{- toYaml .Values.runs | nindent 6 }}
    runIssuers:
      - subPattern: '{{ include "ap.runSubPattern" . }}'
        {{- if eq $b.runIssuer.mode "tokenreview" }}
        mode: tokenreview
        {{- else }}
        issuer: {{ required "broker.runIssuer.issuer is required in jwks mode" $b.runIssuer.issuer | quote }}
        jwksURL: {{ required "broker.runIssuer.jwksURL is required in jwks mode" $b.runIssuer.jwksURL | quote }}
        {{- end }}
    {{- with $b.systemIssuer }}
    systemIssuer:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $b.systemPrincipals }}
    systemPrincipals:
      {{- tpl (toYaml .) $ | nindent 6 }}
    {{- end }}
    {{- with $b.factoryURL }}
    factoryURL: {{ . | quote }}
    {{- end }}
    {{- if $b.factoryInsecure }}
    factoryInsecure: true
    {{- end }}
    {{- if $b.factoryCA.secretName }}
    factoryCAFile: /etc/room-broker/factory-ca/ca.crt
    {{- end }}
    {{- if $local }}
    human:
      mode: local
    {{- else }}
    human:
      {{- include "ap.human" . | nindent 6 }}
    {{- end }}
    {{- with $b.roomTools }}
    roomTools:
      {{- toYaml . | nindent 6 }}
      {{- if dig "hardening" "forgeRead" "audience" "" $b }}
      {{- if not $b.factoryURL }}{{ fail "broker.hardening.forgeRead.audience needs broker.factoryURL: forge_read posts to the factory" }}{{ end }}
      forgeReadTokenFile: /var/run/secrets/maku/factory/token
      {{- end }}
    {{- end }}
    {{- with include "ap.unsafe" . | fromJsonArray }}
    # The chart's unsafe settings: GET /api/install lists them, and every page shows a banner.
    install:
      unsafe: {{ toJson . }}
    {{- end }}
