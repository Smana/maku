{{- $class := (include "ap.sandbox" . | fromJson).class -}}
{{- with .Values.runController }}
{{- if and .enabled .createRuntimeClass $class }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ $class }}
handler: {{ required "runController.runtimeHandler is required to render the RuntimeClass" .runtimeHandler }}
{{- end }}
{{- end }}
