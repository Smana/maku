{{- if eq (include "ap.netMode" .) "cilium" }}
{{- /* S-4: the factory's flows, keyed on factoryURL. Cilium matches L4 after service translation,
so the port is factoryURL's own, which must be the factory pod's (its chart maps 8082 to 8082). */}}
{{- $factory := dict -}}
{{- with .Values.broker.factoryURL -}}
{{- $u := urlParse . -}}
{{- $port := ternary "443" "80" (eq $u.scheme "https") -}}
{{- if regexMatch ":[0-9]+$" $u.host }}{{ $port = regexFind "[0-9]+$" $u.host }}{{ end -}}
{{- $labels := merge (deepCopy $.Values.broker.factoryPodLabels) (dict "io.kubernetes.pod.namespace" $.Release.Namespace) -}}
{{- $factory = dict "port" $port "labels" $labels -}}
{{- end -}}
# Default deny; one allow per flow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: room-broker
  labels: {{- include "ap.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: room-broker
  ingress:
    # Run bridges; a run's own CNP opens the matching egress.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .Values.runs.namespace }}
          matchExpressions:
            - {key: agents.ogenki.io/run-id, operator: Exists}
      toPorts:
        - ports: [{port: "8443", protocol: TCP}]
    {{- if include "ap.roomToolsTokenReview" . }}
    # The runs' harnesses call the room tools with their own token (roomTools.auth tokenreview).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .Values.runs.namespace }}
          matchExpressions:
            - {key: agents.ogenki.io/run-id, operator: Exists}
      toPorts:
        - ports: [{port: "8090", protocol: TCP}]
    {{- end }}
    # Kubelet's probes.
    - fromEntities: [host]
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
    {{- with $factory }}
    # The factory's system API calls (its rooms-system token).
    - fromEndpoints:
        - matchLabels: {{- toYaml .labels | nindent 12 }}
      toPorts:
        - ports: [{port: "8443", protocol: TCP}]
    {{- end }}
    {{- with .Values.broker.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
          rules:
            dns: [{matchPattern: "*"}]
    # The Room and AgentRun watches, the leader lease and token reviews.
    # Cilium applies L4 policy after service translation: kubernetes.default:443 is the control
    # plane's own port (6443 on kind) by then, hence apiServerPorts.
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            {{- range .Values.apiServerPorts }}
            - {port: {{ . | quote }}, protocol: TCP}
            {{- end }}
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
          matchExpressions:
            - {key: {{ .Values.broker.database.podLabel }}, operator: Exists}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
    {{- with $factory }}
    # start_run: POST /v1/runs to factoryURL.
    - toEndpoints:
        - matchLabels: {{- toYaml .labels | nindent 12 }}
      toPorts:
        - ports: [{port: {{ .port | quote }}, protocol: TCP}]
    {{- end }}
    {{- with include "ap.modelGateway" . | fromJson }}
    # The planner and the classifier: the model gateway's clients listener (broker.modelGateway).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .namespace }}
            gateway.networking.k8s.io/gateway-name: {{ .service }}
      toPorts:
        - ports: [{port: {{ .port | quote }}, protocol: TCP}]
    {{- end }}
    {{- with include "ap.githubLinkHosts" . | fromJsonArray }}
    # The GitHub account link (v4 D8): the code exchange on GitHub's site, GET /user and the token's
    # revocation on its API.
    - toFQDNs:
        {{- range . }}
        - matchName: {{ . }}
        {{- end }}
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
    {{- end }}
    {{- with .Values.broker.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
