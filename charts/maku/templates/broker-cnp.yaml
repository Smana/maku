{{- if eq (include "ap.netMode" .) "cilium" }}
{{- /* S-4: the factory's flows, keyed on factoryURL. Cilium matches L4 after service translation,
so the port is factoryURL's own, which must be the factory pod's (its chart maps 8082 to 8082). */}}
{{- $factory := dict -}}
{{- with .Values.broker.factoryURL -}}
{{- $u := urlParse . -}}
{{- $port := ternary "443" "80" (eq $u.scheme "https") -}}
{{- if regexMatch ":[0-9]+$" $u.host }}{{ $port = regexFind "[0-9]+$" $u.host }}{{ end -}}
{{- $labels := merge (deepCopy $.Values.broker.factoryPodLabels) (dict "io.kubernetes.pod.namespace" $.Release.Namespace) -}}
{{- $factory = dict "port" $port "labels" $labels -}}
{{- end -}}
# Default deny; one allow per flow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: room-broker
  labels: {{- include "ap.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: room-broker
  ingress:
    # Run bridges; a run's own CNP opens the matching egress.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .Values.runs.namespace }}
          matchExpressions:
            - {key: agents.ogenki.io/run-id, operator: Exists}
      toPorts:
        - ports: [{port: "8443", protocol: TCP}]
    {{- if include "ap.roomToolsTokenReview" . }}
    # The runs' harnesses call the room tools with their own token (roomTools.auth tokenreview).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .Values.runs.namespace }}
          matchExpressions:
            - {key: agents.ogenki.io/run-id, operator: Exists}
      toPorts:
        - ports: [{port: "8090", protocol: TCP}]
    {{- end }}
    # Kubelet's probes.
    - fromEntities: [host]
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
    {{- with $factory }}
    # The factory's system API calls (its rooms-system token).
    - fromEndpoints:
        - matchLabels: {{- toYaml .labels | nindent 12 }}
      toPorts:
        - ports: [{port: "8443", protocol: TCP}]
    {{- end }}
    {{- if .Values.broker.webProxy }}
    # The human listener, from the web front door alone (the umbrella's rooms-web-proxy): it sets
    # the identity headers the broker reads, so nothing may reach :8080 around it. The Slack App,
    # which calls /mcp with its own bearer, is admitted by maku-slack's room-broker-from-factory-slack-app.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            app.kubernetes.io/name: rooms-web-proxy
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
    {{- end }}
    {{- if .Values.preflight.enabled }}
    # The install's preflight collects /preflight on the ops port (v4 D24).
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: preflight}
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
    {{- end }}
    {{- with .Values.broker.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
          rules:
            dns: [{matchPattern: "*"}]
    # The Room and AgentRun watches, the leader lease and token reviews.
    # Cilium applies L4 policy after service translation: kubernetes.default:443 is the control
    # plane's own port (6443 on kind) by then, hence apiServerPorts.
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            {{- range .Values.apiServerPorts }}
            - {port: {{ . | quote }}, protocol: TCP}
            {{- end }}
    {{- include "ap.cnpDatabase" . | nindent 4 }}
    {{- with $factory }}
    # start_run: POST /v1/runs to factoryURL.
    - toEndpoints:
        - matchLabels: {{- toYaml .labels | nindent 12 }}
      toPorts:
        - ports: [{port: {{ .port | quote }}, protocol: TCP}]
    {{- end }}
    {{- with include "ap.modelGateway" . | fromJson }}
    # The planner and the classifier: the model gateway's clients listener (broker.modelGateway).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .namespace }}
            gateway.networking.k8s.io/gateway-name: {{ .service }}
      toPorts:
        - ports: [{port: {{ .port | quote }}, protocol: TCP}]
    {{- end }}
    {{- with include "ap.githubLinkHosts" . | fromJsonArray }}
    # The GitHub account link (v4 D8): the code exchange on GitHub's site, GET /user and the token's
    # revocation on its API.
    - toFQDNs:
        {{- range . }}
        - matchName: {{ . }}
        {{- end }}
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
    {{- end }}
    {{- with include "ap.knowledge" . | fromJson }}
    {{- $kport := .port }}
    {{- $selectors := list }}
    {{- $peers := list }}
    {{- range .to }}
    {{- if or (hasKey . "toFQDNs") (hasKey . "toCIDR") (hasKey . "toCIDRSet") (hasKey . "toEntities") (hasKey . "toEndpoints") }}
    {{- $peers = append $peers . }}
    {{- else }}
    {{- $selectors = append $selectors . }}
    {{- end }}
    {{- end }}
    {{- with $selectors }}
    # The knowledge MCP endpoint (broker.roomTools.knowledge): its port, to the named endpoints only.
    - toEndpoints: {{- toYaml . | nindent 8 }}
      toPorts:
        - ports: [{port: {{ $kport | quote }}, protocol: TCP}]
    {{- end }}
    {{- range $peers }}
    # The knowledge MCP endpoint (broker.roomTools.knowledge): its port, to this peer only.
    - {{- toYaml . | nindent 6 }}
      toPorts:
        - ports: [{port: {{ $kport | quote }}, protocol: TCP}]
    {{- end }}
    {{- end }}
    {{- range (include "ap.webhooks" . | fromJson).egress }}
    {{- $wport := .port }}
    {{- if .internet }}
    # broker.webhooks[{{ .name }}] (EX9): an internet subscriber, its host on its port.
    - toFQDNs: [{matchName: {{ .host }}}]
      toPorts:
        - ports: [{port: {{ $wport | quote }}, protocol: TCP}]
    {{- else }}
    {{- $selectors := list }}
    {{- $peers := list }}
    {{- range .to }}
    {{- if or (hasKey . "toFQDNs") (hasKey . "toCIDR") (hasKey . "toCIDRSet") (hasKey . "toEntities") (hasKey . "toEndpoints") }}
    {{- $peers = append $peers . }}
    {{- else }}
    {{- $selectors = append $selectors . }}
    {{- end }}
    {{- end }}
    {{- with $selectors }}
    # broker.webhooks (EX9): a cluster subscriber, its URL's port on its pods only.
    - toEndpoints: {{- toYaml . | nindent 8 }}
      toPorts:
        - ports: [{port: {{ $wport | quote }}, protocol: TCP}]
    {{- end }}
    {{- range $peers }}
    - {{- toYaml . | nindent 6 }}
      toPorts:
        - ports: [{port: {{ $wport | quote }}, protocol: TCP}]
    {{- end }}
    {{- end }}
    {{- end }}
    {{- with .Values.broker.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.broker.database.retentionSecret }}
---
# The retention job (retention-cronjob.yaml): no ingress, and egress to DNS and the database only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: room-broker-retention
  labels: {{- include "ap.labelsFor" (dict "root" . "name" "room-broker-retention") | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: room-broker-retention
  ingress: [{}]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
          rules:
            dns: [{matchPattern: "*"}]
    {{- include "ap.cnpDatabase" . | nindent 4 }}
{{- end }}
{{- end }}
