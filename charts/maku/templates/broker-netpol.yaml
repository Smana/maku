{{- if eq (include "ap.netMode" .) "kubernetes" }}
{{- $k := .Values.networkPolicies.kubernetes -}}
{{- /* The factory's flows, keyed on factoryURL, as broker-cnp.yaml's. factoryPodLabels may name the
factory's namespace with io.kubernetes.pod.namespace (Cilium's label); here it becomes the
namespaceSelector, and the other labels the podSelector. */ -}}
{{- $factory := dict -}}
{{- with .Values.broker.factoryURL -}}
{{- $u := urlParse . -}}
{{- $port := ternary "443" "80" (eq $u.scheme "https") -}}
{{- if regexMatch ":[0-9]+$" $u.host }}{{ $port = regexFind "[0-9]+$" $u.host }}{{ end -}}
{{- $labels := deepCopy $.Values.broker.factoryPodLabels -}}
{{- $ns := get $labels "io.kubernetes.pod.namespace" | default $.Release.Namespace -}}
{{- $_ := unset $labels "io.kubernetes.pod.namespace" -}}
{{- $factory = dict "port" $port "labels" $labels "namespace" $ns -}}
{{- end -}}
# The broker's NetworkPolicy in networkPolicies.mode kubernetes, mirroring broker-cnp.yaml: default
# deny, one allow per flow. broker.networkPolicy.extraIngress and extraEgress are rendered verbatim
# here, so in this mode they are NetworkPolicy rules (from/to, ports), not Cilium's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: room-broker
  labels: {{- include "ap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: room-broker
  policyTypes: [Ingress, Egress]
  ingress:
    # Run bridges (and, under roomTools.auth tokenreview, the harnesses' room tools).
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.runs.namespace }}}
          podSelector:
            matchExpressions:
              - {key: agents.ogenki.io/run-id, operator: Exists}
      ports:
        - {port: 8443, protocol: TCP}
        {{- if include "ap.roomToolsTokenReview" . }}
        - {port: 8090, protocol: TCP}
        {{- end }}
    {{- with $factory }}
    # The factory's system API calls (its rooms-system token).
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .namespace }}}
          podSelector:
            matchLabels: {{- toYaml .labels | nindent 14 }}
      ports: [{port: 8443, protocol: TCP}]
    {{- end }}
    {{- with $k.metricsFrom }}
    - from: {{- toYaml . | nindent 8 }}
      ports: [{port: 9090, protocol: TCP}]
    {{- end }}
    {{- if .Values.broker.webProxy }}
    # The human listener, from the web front door alone (the umbrella's rooms-web-proxy): it sets
    # the identity headers the broker reads, so nothing may reach :8080 around it. The Slack App,
    # which calls /mcp with its own bearer, is admitted by maku-slack's room-broker-from-factory-slack-app.
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: rooms-web-proxy}
      ports: [{port: 8080, protocol: TCP}]
    {{- end }}
    {{- if .Values.preflight.enabled }}
    # The install's preflight collects /preflight on the ops port (v4 D24).
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: preflight}
      ports: [{port: 9090, protocol: TCP}]
    {{- end }}
    {{- with .Values.broker.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- include "ap.npDNSAndAPIServer" . | nindent 4 }}
    {{- include "ap.npDatabase" . | nindent 4 }}
    {{- with $factory }}
    # start_run: POST /v1/runs to factoryURL.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .namespace }}}
          podSelector:
            matchLabels: {{- toYaml .labels | nindent 14 }}
      ports: [{port: {{ .port }}, protocol: TCP}]
    {{- end }}
    {{- with include "ap.modelGateway" . | fromJson }}
    # The planner and the classifier: the model gateway's clients listener (broker.modelGateway).
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .namespace }}}
          podSelector:
            matchLabels: {gateway.networking.k8s.io/gateway-name: {{ .service }}}
      ports: [{port: {{ .port }}, protocol: TCP}]
    {{- end }}
    {{- if include "ap.githubLinkHosts" . | fromJsonArray }}
    # The GitHub account link (v4 D8): GitHub's site and API on 443. A NetworkPolicy names no host,
    # so this is any public address on 443, the cluster's own ranges excluded.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml $k.privateCIDRs | nindent 14 }}
      ports: [{port: 443, protocol: TCP}]
    {{- end }}
    {{- with include "ap.knowledge" . | fromJson }}
    # The knowledge MCP endpoint (broker.roomTools.knowledge): its port, to the named peers only.
    - to: {{- toYaml .to | nindent 8 }}
      ports: [{port: {{ .port }}, protocol: TCP}]
    {{- end }}
    {{- range (include "ap.webhooks" . | fromJson).egress }}
    # broker.webhooks[{{ .name }}] (EX9): {{ if .internet }}an internet subscriber, public addresses{{ else }}a cluster subscriber's pods{{ end }} on its port.
    - to:
        {{- if .internet }}
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml $k.privateCIDRs | nindent 14 }}
        {{- else }}
        {{- toYaml .to | nindent 8 }}
        {{- end }}
      ports: [{port: {{ .port }}, protocol: TCP}]
    {{- end }}
    {{- with .Values.broker.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.broker.database.retentionSecret }}
---
# The retention job (retention-cronjob.yaml): no ingress, and egress to DNS and the database only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: room-broker-retention
  labels: {{- include "ap.labelsFor" (dict "root" . "name" "room-broker-retention") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: room-broker-retention
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $k.dns.namespace }}}
          podSelector:
            matchLabels: {{- toYaml $k.dns.labels | nindent 14 }}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- include "ap.npDatabase" . | nindent 4 }}
{{- end }}
{{- end }}
