{{- if and .Values.runController.enabled (eq (include "ap.netMode" .) "cilium") }}
# Default deny; the controller talks to the apiserver and DNS only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: run-controller
  labels: {{- include "ap.labelsFor" (dict "root" . "name" "run-controller") | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: run-controller
  ingress:
    # Kubelet's probes.
    - fromEntities: [host]
      toPorts:
        - ports: [{port: "9091", protocol: TCP}]
    {{- if .Values.preflight.enabled }}
    # The install's preflight collects /preflight on the ops port (v4 D24).
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: preflight}
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
    {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
          rules:
            dns: [{matchPattern: "*"}]
    # After service translation, as the broker's: see apiServerPorts.
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            {{- range .Values.apiServerPorts }}
            - {port: {{ . | quote }}, protocol: TCP}
            {{- end }}
{{- end }}
