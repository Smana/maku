{{- $b := .Values.broker -}}
{{- $local := include "ap.local" . -}}
{{- $img := include "ap.image" (dict "root" . "image" $b.image) -}}
{{- $mg := include "ap.modelGateway" . | fromJson -}}
{{- $dbKey := $b.database.secretKey | default "uri" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-broker
  labels: {{- include "ap.labels" . | nindent 4 }}
  {{- if $b.reloader }}
  {{- $dsns := compact (list $b.database.brokerSecret $b.database.ownerSecret) }}
  {{- if not $dsns }}{{ fail "broker.reloader: no DSN Secret to watch: set broker.database.brokerSecret" }}{{ end }}
  annotations:
    # Stakater Reloader rolls the broker when a DSN Secret changes: the broker reads them once, at start.
    secret.reloader.stakater.com/reload: {{ join "," $dsns | quote }}
  {{- end }}
spec:
  replicas: {{ $b.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: room-broker
  template:
    metadata:
      labels: {{- include "ap.labels" . | nindent 8 }}
      annotations:
        # The broker reads its config once at start: a changed config must roll the pods.
        checksum/config: {{ include (print $.Template.BasePath "/broker-config.yaml") . | sha256sum }}
    spec:
      # No runtimeClassName, ever: kubectl port-forward, local mode's only way in, cannot reach a runsc pod.
      serviceAccountName: room-broker
      automountServiceAccountToken: true # the Room and AgentRun watches, the leader lease
      terminationGracePeriodSeconds: 30 # the broker's shutdown drains fit 23 s of it
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Lets the nonroot broker read a 0400 Secret; also makes the optional oidc files readable.
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- if $b.database.ownerSecret }}
      initContainers:
        # The schema, applied as the owner role before the broker starts; the broker's own role
        # cannot alter it, so this container takes the owner's Secret and nothing else. Its
        # variable is deliberately not ROOMS_DATABASE_URL: the two DSNs never share a name.
        - name: migrate
          image: {{ $img }}
          {{- include "ap.pullPolicy" . | nindent 10 }}
          args: [migrate]
          env:
            - name: ROOMS_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $b.database.ownerSecret }}, key: {{ $dbKey }}}
          securityContext: {{- include "ap.containerSecurityContext" . | nindent 12 }}
          {{- if $b.database.caSecret }}
          volumeMounts:
            - {name: db-ca, mountPath: /etc/room-broker/db-ca, readOnly: true}
          {{- end }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
      {{- end }}
      containers:
        - name: room-broker
          image: {{ $img }}
          {{- include "ap.pullPolicy" . | nindent 10 }}
          env:
            - name: ROOMS_CONFIG
              value: /etc/room-broker/config/config.yaml
            {{- if $b.database.brokerSecret }}
            - name: ROOMS_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $b.database.brokerSecret }}, key: {{ $dbKey }}}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            {{- with $b.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: bridge, containerPort: 8443}
            - {name: human, containerPort: 8080}
            - {name: ops, containerPort: 9090}
          # Probes are on the ops port: the broker answers them there for the kubelet only.
          startupProbe:
            httpGet: {path: /startupz, port: 9090}
            periodSeconds: 5
            failureThreshold: 120 # a first start waits for PostgreSQL and the migration
          livenessProbe:
            httpGet: {path: /healthz, port: 9090}
          readinessProbe:
            httpGet: {path: /readyz, port: 9090}
          securityContext: {{- include "ap.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml $b.resources | nindent 12 }}
          volumeMounts:
            # The config sits beside the TLS pair, not above it: a mount nested in a read-only
            # ConfigMap mount cannot create its mount point.
            - {name: config, mountPath: /etc/room-broker/config, readOnly: true}
            - {name: tls, mountPath: /etc/room-broker/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $b.factoryCA.secretName }}
            - {name: factory-ca, mountPath: /etc/room-broker/factory-ca, readOnly: true}
            {{- end }}
            {{- if dig "githubLink" "existingSecret" "" $b }}
            - {name: github-link, mountPath: /etc/room-broker/github-link, readOnly: true}
            {{- end }}
            {{- if dig "oidc" "existingSecret" "" $b }}
            - {name: oidc, mountPath: /etc/room-broker/oidc, readOnly: true}
            {{- end }}
            {{- if $b.database.caSecret }}
            - {name: db-ca, mountPath: /etc/room-broker/db-ca, readOnly: true}
            {{- end }}
            {{- with $mg.tokens }}
            - {name: model-gateway, mountPath: {{ . }}, readOnly: true}
            {{- end }}
            {{- if dig "hardening" "forgeRead" "audience" "" $b }}
            - {name: factory-token, mountPath: /var/run/secrets/maku/factory, readOnly: true}
            {{- end }}
            {{- with $b.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: room-broker-config}
        - name: tls
          secret: {secretName: {{ $b.tls.secretName }}}
        - name: tmp
          emptyDir: {}
        {{- if $b.factoryCA.secretName }}
        - name: factory-ca
          secret: {secretName: {{ $b.factoryCA.secretName }}, items: [{key: ca.crt, path: ca.crt}]}
        {{- end }}
        {{- with dig "githubLink" "existingSecret" "" $b }}
        # The GitHub account link's OAuth client (v4 D8), read at use: a rotated Secret needs no restart.
        - name: github-link
          secret: {secretName: {{ . }}, defaultMode: 0440}
        {{- end }}
        {{- with dig "oidc" "existingSecret" "" $b }}
        # The OIDC client ids (v4 D8), read at use: a rotated Secret needs no restart.
        - name: oidc
          secret: {secretName: {{ . }}, defaultMode: 0440}
        {{- end }}
        {{- with $b.database.caSecret }}
        # The database's CA (broker.database.caSecret), for sslmode=verify-full in the DSNs.
        - name: db-ca
          secret: {secretName: {{ . }}, items: [{key: ca.crt, path: ca.crt}]}
        {{- end }}
        {{- if $mg.service }}
        # The model gateway's clients (GW8): one token per client, each audience its own route's, so
        # the planner's token cannot call the classifier's route or the reverse. The broker reads the
        # file at each call, so the kubelet's rotation reaches it with no restart.
        - name: model-gateway
          projected:
            sources:
              - serviceAccountToken: {audience: {{ $mg.audiencePrefix }}.client.planner, expirationSeconds: 3600, path: planner}
              - serviceAccountToken: {audience: {{ $mg.audiencePrefix }}.client.classifier, expirationSeconds: 3600, path: classifier}
        {{- end }}
        {{- with dig "hardening" "forgeRead" "audience" "" $b }}
        # forge_read (hardening H4, HR35): the broker's token for the factory's system audience,
        # which api.systemPrincipals maps to system:broker. Re-read at each call.
        - name: factory-token
          projected:
            sources:
              - serviceAccountToken: {audience: {{ . }}, expirationSeconds: 3600, path: token}
        {{- end }}
        {{- with $b.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
