{{- if .Values.preflight.enabled }}
{{- $sb := include "ap.sandbox" . | fromJson -}}
{{- /* The six maku CRDs at the version this chart serves, then the values' extra ones. */ -}}
{{- $crds := list -}}
{{- range list "agentruns" "factories" "mergepolicies" "repositories" "rooms" "tasks" -}}
{{- $crds = append $crds (dict "name" (printf "%s.maku.ogenki.io" .) "version" "v1alpha1") -}}
{{- end -}}
{{- $crds = concat $crds .Values.preflight.extraCRDs -}}
{{- /* The components whose /preflight it collects (IN3): each checks its own path on its ops port. */ -}}
{{- $svc := printf "svc.%s:9090" .Values.clusterDomain -}}
{{- $components := list (dict "name" "broker" "url" (printf "http://room-broker.%s.%s" .Release.Namespace $svc)) -}}
{{- if .Values.runController.enabled -}}
{{- $components = append $components (dict "name" "run-controller" "url" (printf "http://run-controller.%s.%s" .Release.Namespace $svc)) -}}
{{- end -}}
{{- with .Values.broker.factoryURL -}}
{{- $components = append $components (dict "name" "factory" "url" (printf "http://%s:9090" (urlParse .).hostname)) -}}
{{- end -}}
{{- $cfg := dict "cluster" (dict "minKubernetes" "1.30" "crds" $crds "runtimeClass" $sb.class "unsafeAllowRunc" $sb.allowUnsandboxed
  "secrets" (include "ap.preflightSecrets" . | fromJson).secrets) "components" $components "timeout" (printf "%ds" (include "ap.preflightSeconds" . | int)) -}}
# The preflight's checks (v4 D24): the cluster's, against this release's values. maku-run-controller
# preflight reads it strictly, so the chart and the image move together.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-preflight
  labels: {{- include "ap.labelsFor" (dict "root" . "name" "preflight") | nindent 4 }}
data:
  config.json: {{ toJson $cfg | quote }}
{{- end }}
{{- if and .Values.preflight.enabled .Values.runController.enabled }}
---
# The run-controller's ops port, for the preflight's collector only: /preflight beside /metrics.
apiVersion: v1
kind: Service
metadata:
  name: run-controller
  labels: {{- include "ap.labelsFor" (dict "root" . "name" "run-controller") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: run-controller
  ports:
    - {name: metrics, port: 9090, targetPort: metrics}
{{- end }}
