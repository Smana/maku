{{- if .Values.runController.enabled }}
{{- $c := .Values.runController -}}
{{- $l := include "ap.labelsFor" (dict "root" . "name" "run-controller") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: run-controller
  labels: {{- $l | nindent 4 }}
---
# Everything in the runs namespace. A run's pod, ServiceAccount, ConfigMaps and CNP are created
# and read back (the ownership check); the pod is also deleted (revoke); Secrets are read by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: run-controller
  namespace: {{ .Values.runs.namespace }}
  labels: {{- $l | nindent 4 }}
rules:
  - apiGroups: [{{ .Values.runs.group }}]
    resources: [agentruns]
    verbs: [get, list, watch]
  # The pod's ownerReference sets blockOwnerDeletion, which OwnerReferencesPermissionEnforcement
  # authorizes as update on the owner's finalizers.
  - apiGroups: [{{ .Values.runs.group }}]
    resources: [agentruns/finalizers]
    verbs: [update]
  - apiGroups: [{{ .Values.runs.group }}]
    resources: [agentruns/status]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [serviceaccounts, configmaps]
    verbs: [get, create]
  {{- if eq (include "ap.netMode" .) "cilium" }}
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, create]
  {{- else if eq (include "ap.netMode" .) "kubernetes" }}
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create]
  {{- end }}
  {{- if eq ($c.gitTokens | default "shared") "perRun" }}
  # gitTokens perRun: each run's own <run name>-git, a name not known in advance. get alone, never
  # list or watch; the controller already creates pods that mount any Secret here (plan PR3).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  {{- else }}
  - apiGroups: [""]
    resources: [secrets]
    {{- /* model.mode gateway reads no model Secret: the gateway holds the keys. */}}
    resourceNames: [{{ if not (include "ap.runModelGateway" . | fromJson) }}{{ $c.modelSecret | quote }}, {{ end }}{{ $c.gitSecret | quote }}{{ if not $c.unsafeSharedGitToken }}, {{ $c.gitReadSecret | quote }}{{ end }}]
    verbs: [get]
  {{- end }}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    {{- /* list: in kubernetes mode, the preflight names the last event of a probe pod that did not start. */}}
    verbs: [create, patch{{ if eq (include "ap.netMode" .) "kubernetes" }}, list{{ end }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: run-controller
  namespace: {{ .Values.runs.namespace }}
  labels: {{- $l | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: run-controller}
subjects:
  - {kind: ServiceAccount, name: run-controller, namespace: {{ .Release.Namespace }}}
---
# The broker's CA, copied into each run: the one Secret it reads outside the runs namespace, and
# ca.crt only: never broker.tls.secretName, whose tls.key would let the controller impersonate the broker.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: run-controller-ca
  labels: {{- $l | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.broker.tls.caSecretName | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: run-controller-ca
  labels: {{- $l | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: run-controller-ca}
subjects:
  - {kind: ServiceAccount, name: run-controller, namespace: {{ .Release.Namespace }}}
{{- if include "ap.runModelGateway" . | fromJson }}
---
# The gateway-token-ttl preflight (v4 step 4, GW9) requests one token for this ServiceAccount at the
# longest run's lifetime, to learn whether the apiserver caps token expiry under it. Its own name only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: run-controller-token
  labels: {{- $l | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [run-controller]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: run-controller-token
  labels: {{- $l | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: run-controller-token}
subjects:
  - {kind: ServiceAccount, name: run-controller, namespace: {{ .Release.Namespace }}}
{{- end }}
{{- with (include "ap.sandbox" . | fromJson).class }}
{{- $crName := printf "maku-%s-run-controller-runtimeclass" $.Release.Namespace }}
---
# The preflight (v4 D18) proves the sandbox RuntimeClass exists before any run starts. It reads it
# uncached, by name: get on that one cluster-scoped object, never a list or watch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $crName }}
  labels: {{- $l | nindent 4 }}
rules:
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    resourceNames: [{{ . | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $crName }}
  labels: {{- $l | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $crName }}}
subjects:
  - {kind: ServiceAccount, name: run-controller, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
