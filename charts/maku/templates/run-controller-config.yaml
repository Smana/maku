{{- if .Values.runController.enabled }}
{{- $c := .Values.runController -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: run-controller-config
  labels: {{- include "ap.labelsFor" (dict "root" . "name" "run-controller") | nindent 4 }}
data:
  # Strictly decoded by the controller (runctl.LoadConfig). namespace and namePrefix come from
  # `runs` alone, as the broker's do. The broker URL must be the FQDN: the run pod's resolver
  # would otherwise try search-path names its CNP refuses.
  config.yaml: |
    namespace: {{ .Values.runs.namespace | quote }}
    namePrefix: {{ .Values.runs.namePrefix | quote }}
    {{- $sb := include "ap.sandbox" . | fromJson }}
    {{- with $sb.class }}
    runtimeClassName: {{ . | quote }}
    {{- end }}
    allowUnsandboxed: {{ $sb.allowUnsandboxed }}
    {{- $mode := include "ap.netMode" . }}
    {{- if eq $mode "none" }}
    # No Cilium: the controller creates no CiliumNetworkPolicy per run.
    networkPolicy: none
    {{- else if eq $mode "kubernetes" }}
    # A NetworkPolicy per run; the harness reaches the web only through the egress proxy (v4 D6).
    networkPolicy: kubernetes
    {{- $k := .Values.networkPolicies.kubernetes }}
    egressProxy:
      url: {{ include "ap.egressProxyURL" . | quote }}
      namespace: {{ .Release.Namespace | quote }}
      labels: {app.kubernetes.io/name: egress-proxy}
      {{- with $k.privateCIDRs }}
      denyCIDRs: {{- toYaml . | nindent 8 }}
      {{- end }}
    dns:
      namespace: {{ $k.dns.namespace | quote }}
      labels: {{- toYaml $k.dns.labels | nindent 8 }}
    {{- end }}
    {{- $gw := include "ap.runModelGateway" . | fromJson }}
    {{- if $gw }}
    # Runs call the model gateway with their own projected token (v4 step 4, GW3): no provider key
    # enters the runs namespace, and modelSecret is not read.
    model:
      mode: gateway
      gateway:
        url: {{ $gw.url | quote }}
        ports: {public: {{ $gw.ports.public }}, internal: {{ $gw.ports.internal }}}
        audiencePrefix: {{ $gw.audiencePrefix | quote }}
        serviceAccount: {namespace: {{ .Release.Namespace | quote }}, name: run-controller}
        aliases:
          public: {{ $gw.aliases.public | toJson }}
          internal: {{ $gw.aliases.internal | toJson }}
    {{- else }}
    modelSecret: {{ required "runController.modelSecret is required" $c.modelSecret | quote }}
    {{- end }}
    {{- if eq ($c.gitTokens | default "shared") "perRun" }}
    {{- if $c.unsafeSharedGitToken }}
    {{- fail "runController.gitTokens perRun and runController.unsafeSharedGitToken: choose one" }}
    {{- end }}
    {{- if $c.gitReadSecret }}
    {{- fail "runController.gitTokens perRun and runController.gitReadSecret: choose one (set gitReadSecret to \"\"): each run mounts its own Secret, minted for its role" }}
    {{- end }}
    # Each run mounts its own Secret, <run name>-git, minted by the factory (D10).
    gitTokens: perRun
    {{- else }}
    gitSecret: {{ required "runController.gitSecret is required" $c.gitSecret | quote }}
    {{- if $c.unsafeSharedGitToken }}
    # Every role mounts gitSecret: a reviewer or triager could push (a laptop's one PAT).
    unsafeSharedGitToken: true
    {{- else if $c.gitReadSecret }}
    gitReadSecret: {{ $c.gitReadSecret | quote }}
    {{- else }}
    {{- fail "runController.gitReadSecret is empty and runController.unsafeSharedGitToken is false: reviewer and triager runs need a read-only token; name its Secret, or share gitSecret on a laptop" }}
    {{- end }}
    {{- end }}
    broker:
      url: {{ printf "https://room-broker.%s.svc.%s:8443" .Release.Namespace .Values.clusterDomain | quote }}
      namespace: {{ .Release.Namespace | quote }}
      # Only the stable selector label: runctl copies every label into each run CNP once, so a
      # version label would cut in-flight runs off from the broker on upgrade.
      labels: {app.kubernetes.io/name: room-broker}
      caSecret: {{ required "broker.tls.caSecretName is required" .Values.broker.tls.caSecretName | quote }}
    {{- if include "ap.roomToolsTokenReview" . }}
    # The broker verifies each run's own token on :8090 (roomTools.auth tokenreview). Plain HTTP:
    # in-cluster, broker to run pod, with no TLS on that listener.
    roomToolsURL: {{ printf "http://room-broker.%s.svc.%s:8090/mcp" .Release.Namespace .Values.clusterDomain | quote }}
    {{- end }}
    images:
      harness: {{ include "ap.image" (dict "root" . "image" $c.images.harness) | quote }}
      bridge: {{ include "ap.image" (dict "root" . "image" $c.images.bridge) | quote }}
      {{- if eq $mode "kubernetes" }}
      # The preflight's netprobe pod: this controller's own image.
      probe: {{ include "ap.image" (dict "root" . "image" $c.image) | quote }}
      {{- end }}
    {{- with $c.egressProfiles }}
    egressProfiles:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
