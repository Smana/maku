{{- if and .Values.runController.enabled .Values.runPodPolicy.enabled }}
{{- $name := printf "maku-%s-run-pods" .Release.Namespace -}}
{{- $class := (include "ap.sandbox" . | fromJson).class -}}
{{- $c := .Values.runController -}}
{{- $images := list $c.images.harness.repository $c.images.bridge.repository $c.image.repository -}}
{{- if and $c.images.opencode $c.images.opencode.tag }}{{ $images = append $images $c.images.opencode.repository }}{{ end -}}
{{- if and $c.images.browser $c.images.browser.tag }}{{ $images = append $images $c.images.browser.repository }}{{ end -}}
{{- range $svc := list "postgres" "redis" }}{{ $img := index $c.images $svc }}{{ if and $img $img.tag }}{{ $images = append $images $img.repository }}{{ end }}{{ end -}}
{{- range .Values.runPodPolicy.extraImages }}{{ $images = append $images . }}{{ end -}}
{{- $quoted := list -}}
{{- /* Each value below is pasted into a CEL string: one that could close the quote is refused. */ -}}
{{- range (append $images $class) -}}
{{- if not (regexMatch "^[A-Za-z0-9._:/-]*$" .) -}}
{{- fail (printf "%q cannot go into the run-pod policy: an image repository or RuntimeClass name holds only letters, digits and . _ : / -" .) -}}
{{- end -}}
{{- end -}}
{{- range $images }}{{ $quoted = append $quoted (printf "'%s'" .) }}{{ end -}}
# The run pod's shape (v4 D17), held by the API server itself (Kubernetes 1.30+): no controller, no
# Kyverno. In runs.namespace only the run-controller creates pods, and every pod there runs in the
# sandbox, with a restricted securityContext, only emptyDir, configMap, secret and projected volumes
# (no hostPath), CPU and memory limits on every container, and images from the run-controller's own
# repositories (by digest unless e2e.unpinnedImages). No ephemeral container is ever added (no
# kubectl debug into a run), and a pod's maku.ogenki.io/egress annotation, which the egress proxy
# trusts, never changes after create; nor do its install set and deadline. The egress proxy may set
# maku.ogenki.io/egress-install-closed to "true" and change nothing else; once set, it stays.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels: {{- include "ap.labelsFor" (dict "root" . "name" "run-controller") | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: images
      expression: {{ printf "[%s]" (join ", " $quoted) | quote }}
    - name: pinned
      expression: {{ (not .Values.e2e.unpinnedImages) | toString | quote }}
    - name: egress
      expression: "has(object.metadata.annotations) && 'maku.ogenki.io/egress' in object.metadata.annotations ? object.metadata.annotations['maku.ogenki.io/egress'] : ''"
    - name: oldEgress
      expression: "request.operation == 'UPDATE' && has(oldObject.metadata.annotations) && 'maku.ogenki.io/egress' in oldObject.metadata.annotations ? oldObject.metadata.annotations['maku.ogenki.io/egress'] : ''"
    - name: annotations
      expression: "object.metadata.?annotations.orValue({})"
    - name: oldAnnotations
      expression: "request.operation == 'UPDATE' ? oldObject.metadata.?annotations.orValue({}) : {}"
  validations:
    - expression: "!has(request.subResource) || request.subResource != 'ephemeralcontainers'"
      message: "a run pod takes no ephemeral container: no kubectl debug into a run"
    - expression: {{ printf "request.operation != 'CREATE' || request.userInfo.username == 'system:serviceaccount:%s:run-controller'" .Release.Namespace | quote }}
      message: {{ printf "only the run-controller (system:serviceaccount:%s:run-controller) creates pods in %s" .Release.Namespace .Values.runs.namespace | quote }}
    - expression: "request.operation != 'UPDATE' || variables.egress == variables.oldEgress"
      message: "the maku.ogenki.io/egress annotation is set at create, by the run-controller, and never changes"
    - expression: >-
        request.operation != 'UPDATE' || ['maku.ogenki.io/egress-install', 'maku.ogenki.io/egress-install-until'].all(k,
        variables.annotations[?k].orValue('') == variables.oldAnnotations[?k].orValue(''))
      message: "the maku.ogenki.io/egress-install and egress-install-until annotations are set at create, by the run-controller, and never change"
    - expression: >-
        variables.annotations[?'maku.ogenki.io/egress-install-closed'].orValue('true') == 'true' &&
        (!('maku.ogenki.io/egress-install-closed' in variables.oldAnnotations) || 'maku.ogenki.io/egress-install-closed' in variables.annotations)
      message: "maku.ogenki.io/egress-install-closed is \"true\" or absent, and once set it stays: an install set never reopens"
    - expression: >-
        {{ printf "request.userInfo.username != 'system:serviceaccount:%s:egress-proxy'" .Release.Namespace }} ||
        (request.operation == 'UPDATE' && object.spec == oldObject.spec &&
        object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
        object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) &&
        object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
        variables.annotations.all(k, k == 'maku.ogenki.io/egress-install-closed' || (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.annotations[k])) &&
        variables.oldAnnotations.all(k, k in variables.annotations))
      message: "the egress proxy changes a run pod's maku.ogenki.io/egress-install-closed annotation and nothing else"
    {{- if $class }}
    - expression: {{ printf "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == '%s'" $class | quote }}
      message: {{ printf "a run pod runs under RuntimeClass %q (sandbox.runtimeClassName)" $class | quote }}
    {{- end }}
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "a run pod sets automountServiceAccountToken: false"
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: "a run pod shares no host namespace: no hostNetwork, hostPID or hostIPC"
    - expression: "!(has(object.spec.shareProcessNamespace) && object.spec.shareProcessNamespace)"
      message: "a run pod sets no shareProcessNamespace: containers do not share a PID namespace"
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) || has(v.configMap) || has(v.secret) || has(v.projected))
      message: "a run pod mounts only emptyDir, configMap, secret and projected volumes: no hostPath, no persistentVolumeClaim"
    {{- with include "ap.runModelGateway" . | fromJson }}
    {{- if not (regexMatch "^[a-z0-9.-]+$" $.Values.runController.modelSecret) }}
    {{- fail (printf "runController.modelSecret %q cannot go into the run-pod policy: a Secret name holds only a-z, 0-9, . and -" $.Values.runController.modelSecret) }}
    {{- end }}
    # model.mode gateway (v4 step 4, GW3): a run holds ServiceAccount tokens for the broker, its room
    # tools and the model gateway's aliases only, never one the apiserver or another service accepts,
    # and never the model Secret: no provider key enters the runs namespace.
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) ||
        v.projected.sources.all(s, !has(s.serviceAccountToken) || (has(s.serviceAccountToken.audience) &&
        (s.serviceAccountToken.audience in ['room-broker', 'room-tools'] || s.serviceAccountToken.audience.startsWith('{{ .audiencePrefix }}.public.') ||
        s.serviceAccountToken.audience.startsWith('{{ .audiencePrefix }}.internal.')))))
      message: {{ printf "a run pod's projected ServiceAccount tokens are for room-broker, room-tools or %s.<public|internal>.<alias> only" .audiencePrefix | quote }}
    {{- /* The model Secret by every way a pod reads a Secret: a volume, a projected source, an env var, envFrom. */}}
    {{- $s := $.Values.runController.modelSecret }}
    - expression: >-
        (!has(object.spec.volumes) || object.spec.volumes.all(v, (!has(v.secret) || v.secret.secretName != '{{ $s }}') &&
        (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(p, !has(p.secret) || p.secret.name != '{{ $s }}')))) &&
        variables.containers.all(c, (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || e.valueFrom.secretKeyRef.name != '{{ $s }}')) &&
        (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef) || f.secretRef.name != '{{ $s }}')))
      message: {{ printf "model.mode gateway: a run pod never reads the model Secret %s (volume, projected source, env or envFrom); the gateway holds the keys" $s | quote }}
    {{- else }}
    # model.mode secret: a run holds ServiceAccount tokens for the broker and its room tools only,
    # never one the apiserver or another service accepts.
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) ||
        v.projected.sources.all(s, !has(s.serviceAccountToken) || (has(s.serviceAccountToken.audience) &&
        s.serviceAccountToken.audience in ['room-broker', 'room-tools'])))
      message: "a run pod's projected ServiceAccount tokens are for room-broker or room-tools only"
    {{- end }}
    # The opt-in browser sidecar (v5 Q16, screenshots plan C3): the policy sees the pod only, so it keys
    # on the role label, which only the run-controller sets. The browser holds its own /tmp and cache
    # and nothing else: no workspace, no token volume, no env read from a Secret or ConfigMap.
    - expression: >-
        variables.containers.all(c, c.name != 'browser' ||
        (has(object.metadata.labels) && object.metadata.labels[?'agents.ogenki.io/role'].orValue('') in ['implementer', 'tester'] &&
        (!has(c.volumeMounts) || c.volumeMounts.all(m, m.name in ['browser-tmp', 'browser-cache'])) &&
        (!has(c.env) || c.env.all(e, !has(e.valueFrom))) && !has(c.envFrom)))
      message: "the browser sidecar runs on implementer and tester pods only, mounting its own /tmp and cache, with no secret, token or env from a source (v5 Q16)"
    - expression: "!has(object.spec.ephemeralContainers)"
      message: "a run pod takes no ephemeral container: no kubectl debug into a run"
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)
      message: "a run pod's containers are never privileged"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation)
      message: "every container of a run pod sets allowPrivilegeEscalation: false"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop &&
        (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0))
      message: "every container of a run pod drops ALL capabilities and adds none"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem)
      message: "every container of a run pod sets readOnlyRootFilesystem: true"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) ? c.securityContext.runAsNonRoot :
        has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot)
      message: "every container of a run pod runs as non-root (runAsNonRoot: true)"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.seccompProfile) ?
        c.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost'] :
        has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost'])
      message: "every container of a run pod has a RuntimeDefault or Localhost seccomp profile"
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits) && 'cpu' in c.resources.limits)
      message: "every container of a run pod sets limits.cpu"
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: "every container of a run pod sets limits.memory"
    - expression: >-
        variables.containers.all(c, (c.image.split('@')[0].lastIndexOf(':') > c.image.split('@')[0].lastIndexOf('/') ?
        c.image.split('@')[0].substring(0, c.image.split('@')[0].lastIndexOf(':')) : c.image.split('@')[0]) in variables.images)
      message: {{ printf "a run pod's images come from %s (runController.images, runController.image, runPodPolicy.extraImages)" (join ", " $images) | quote }}
    - expression: "!variables.pinned || variables.containers.all(c, c.image.matches('^[^@]+@sha256:[0-9a-f]{64}$'))"
      message: "a run pod's images are pinned by digest (@sha256:)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels: {{- include "ap.labelsFor" (dict "root" . "name" "run-controller") | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.runs.namespace }}
{{- end }}
