{{- /* netMode, or none when the platform owns the runs namespace's default-deny */ -}}
{{- $denyMode := ternary (include "ap.netMode" .) "none" (ne .Values.networkPolicies.runsNamespaceDefaultDeny false) }}
{{- if .Values.createRunsNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.runs.namespace }}
  {{- if .Values.runController.enabled }}
  labels:
    # Pod Security's restricted profile, under the run-pod policy: it also holds what the policy
    # does not (hostPort, SELinux type, AppArmor, sysctls, procMount). Run pods pass both.
    pod-security.kubernetes.io/enforce: restricted
  {{- end }}
  annotations:
    # Uninstall must not delete the runs and the Secrets in them.
    helm.sh/resource-policy: keep
{{- if ne $denyMode "none" }}
---
{{ end }}
{{- end }}
{{- if eq $denyMode "kubernetes" }}
# No rule in either direction: everything denied. Each run's own NetworkPolicy, created by the
# run-controller, adds its allowances (v4 D6).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.runs.namespace }}
  labels: {{- include "ap.labelsFor" (dict "root" . "name" "run-controller") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- end }}
{{- if eq $denyMode "cilium" }}
# An empty rule selects no peer: enforcement on in both directions, nothing allowed. Each run's own
# CiliumNetworkPolicy adds its allowances.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.runs.namespace }}
spec:
  endpointSelector: {}
  ingress: [{}]
  egress: [{}]
{{- end }}
