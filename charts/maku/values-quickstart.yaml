# Laptop install: no IdP, no issuer reachable from the apiserver. Pair with a port-forward to :8080.
broker:
  human:
    mode: local
  # No room tools on a laptop: no :8090 listener, and no ROOMS_MCP_KEY to invent.
  roomTools:
    enabled: false
  runIssuer:
    mode: tokenreview
  database:
    brokerSecret: rooms-broker-dsn
    ownerSecret: rooms-owner-dsn
  tls:
    issuerRef: {kind: Issuer, name: quickstart-ca}
# A laptop without a model gateway: the provider key sits in the sandbox (model.mode secret), which only
# a demo may do. The banner shows model_key_in_sandbox.
demoValues: true
runController:
  model:
    mode: secret
  createRuntimeClass: true
  # A laptop has one PAT (agent-git): every role shares it, so a reviewer could push. Unsafe
  # anywhere else; set runController.gitReadSecret to a read-only token instead.
  unsafeSharedGitToken: true
