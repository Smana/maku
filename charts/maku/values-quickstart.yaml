# Laptop install: no IdP, no issuer reachable from the apiserver. Pair with a port-forward to :8080.
broker:
  human:
    mode: local
  # No room tools on a laptop: no :8090 listener, and no ROOMS_MCP_KEY to invent.
  roomTools:
    enabled: false
  runIssuer:
    mode: tokenreview
  database:
    brokerSecret: rooms-broker-dsn
    ownerSecret: rooms-owner-dsn
  tls:
    issuerRef: {kind: Issuer, name: quickstart-ca}
# The quickstart's kind cluster runs Cilium (hack/quickstart/up.sh): CiliumNetworkPolicies, not the
# default mode kubernetes. E2E_NETPOL=kubernetes overrides it.
networkPolicies:
  mode: cilium
# A laptop without a model gateway: the provider key sits in the sandbox (model.mode secret), which only
# a demo may do. The banner shows model_key_in_sandbox.
demoValues: true
runController:
  model:
    mode: secret
  createRuntimeClass: true
  # A laptop has one PAT (agent-git), with no factory to mint per-run tokens: every role shares it,
  # so a reviewer could push. Demo-only (demoValues); the banner shows shared_git_token.
  gitSecret: agent-git
