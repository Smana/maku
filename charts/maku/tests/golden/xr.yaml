# Source: maku/templates/broker-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: room-broker-config
  labels:
    app.kubernetes.io/name: room-broker
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/version: "0.0.0"
data:
  # Strictly decoded by the broker (internal/config): an unknown key fails the rollout. tls is
  # left to its default, /etc/room-broker/tls/tls.{crt,key}, where the Deployment mounts the pair.
  config.yaml: |
    publicURL: "https://rooms.example.com"
    runs:
      group: cloud.ogenki.io
      namePrefix: xplane-run-
      namespace: agents
    runIssuers:
      - subPattern: '^system:serviceaccount:agents:xplane-run-([a-z2-7]{8})$'
        issuer: "https://oidc"
        jwksURL: "https://oidc/keys"
    human:
      clientIDFile: /c
      groups:
        admin: a
        member: m
      issuer: https://idp.example.com
      jwksURL: https://idp.example.com/keys
      origin: https://rooms.example.com
      projectIDFile: /p
    roomTools:
      enabled: true

---
# Source: maku/templates/broker-rbac.yaml
# Exactly the verbs the broker calls: the Room controller reads Rooms, updates their finalizer and
# merge-patches their status; the human API creates (new room, fork); leader election takes a Lease and emits Events.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: room-broker
  labels:
    app.kubernetes.io/name: room-broker
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/version: "0.0.0"
rules:
  - apiGroups: [maku.ogenki.io]
    resources: [rooms]
    verbs: [get, list, watch, create, update]
  - apiGroups: [maku.ogenki.io]
    resources: [rooms/status]
    verbs: [patch]
  - apiGroups: [maku.ogenki.io]
    resources: [rooms/finalizers]
    verbs: [update]
  # Coordination parents (v4 MR13): the human API reads a parent, its lineage and the day ledgers
  # live, to filter them per viewer. Read-only: never watch, never write.
  - apiGroups: [maku.ogenki.io]
    resources: [tasks]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]

