# Source: maku/templates/broker-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-broker
  labels:
    app.kubernetes.io/name: room-broker
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/version: "0.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: room-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: room-broker
        app.kubernetes.io/part-of: maku
        app.kubernetes.io/version: "0.0.0"
      annotations:
        # The broker reads its config once at start: a changed config must roll the pods.
        checksum/config: 013bc39ec0653e9f0618d72039ac1d6a968e3954a025db976ec4faef799aca18
    spec:
      # No runtimeClassName, ever: kubectl port-forward, local mode's only way in, cannot reach a runsc pod.
      serviceAccountName: room-broker
      automountServiceAccountToken: true # the Room and AgentRun watches, the leader lease
      terminationGracePeriodSeconds: 30 # the broker's shutdown drains fit 23 s of it
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Lets the nonroot broker read a 0400 Secret; also makes the optional oidc files readable.
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: room-broker
          image: ghcr.io/smana/maku-broker:v0.0.0@sha256:0000
          
          env:
            - name: ROOMS_CONFIG
              value: /etc/room-broker/config/config.yaml
            - name: ROOMS_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: dsn, key: uri}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          ports:
            - {name: bridge, containerPort: 8443}
            - {name: human, containerPort: 8080}
            - {name: ops, containerPort: 9090}
          # Probes are on the ops port: the broker answers them there for the kubelet only.
          startupProbe:
            httpGet: {path: /startupz, port: 9090}
            periodSeconds: 5
            failureThreshold: 120 # a first start waits for PostgreSQL and the migration
          livenessProbe:
            httpGet: {path: /healthz, port: 9090}
          readinessProbe:
            httpGet: {path: /readyz, port: 9090}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            # The config sits beside the TLS pair, not above it: a mount nested in a read-only
            # ConfigMap mount cannot create its mount point.
            - {name: config, mountPath: /etc/room-broker/config, readOnly: true}
            - {name: tls, mountPath: /etc/room-broker/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: room-broker-config}
        - name: tls
          secret: {secretName: broker-cert}
        - name: tmp
          emptyDir: {}

