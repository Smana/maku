{{- /* Factory resources D7: the built-in admin, edit and view roles take these, as they take a Deployment's.
They are the cluster's, one set for every install (D2, step 7 R10): agent-factory-crds renders them, and
the umbrella turns them off here (clusterRoles: false). This chart alone keeps them, as before. */}}
{{- if .Values.clusterRoles }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maku-factory-admin
  labels:
    {{- include "agent-factory.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [maku.ogenki.io]
    resources: [factories, repositories, mergepolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maku-mergepolicy-editor
  labels:
    {{- include "agent-factory.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: [maku.ogenki.io]
    resources: [mergepolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maku-viewer
  labels:
    {{- include "agent-factory.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [maku.ogenki.io]
    resources: [factories, repositories, mergepolicies]
    verbs: [get, list, watch]
{{- end }}
