apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-factory
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: agent-factory}
  template:
    metadata:
      labels: {{- include "agent-factory.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      serviceAccountName: agent-factory
      automountServiceAccountToken: true  # a controller: it watches Tasks and AgentRuns
      # The factory's drains (manager 20 s, then :9090) fit inside it.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The kubelet gives mounted Secrets this group: with defaultMode 0440 the App key is
        # readable by uid 65532 and nobody else (review C1).
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: agent-factory}}
      containers:
        - name: agent-factory
          image: {{ include "agent-factory.image" . | quote }}
          {{- if (.Values.e2e).unpinnedImages }}
          imagePullPolicy: Never
          {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: FACTORY_CONFIG, value: /etc/agent-factory/config/config.yaml}
            {{- if .Values.hardening.gitCache.sizeLimit }}
            - {name: MAKU_GIT_CACHE, value: /var/cache/maku/git}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: ops, containerPort: 9090, protocol: TCP}
            - {name: api, containerPort: 8082, protocol: TCP}
            - {name: intake, containerPort: 8080, protocol: TCP}
          startupProbe: {httpGet: {path: /startupz, port: ops}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /healthz, port: ops}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: ops}, periodSeconds: 10}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Sibling mounts, never one inside another's read-only volume.
          volumeMounts:
            - {name: config, mountPath: /etc/agent-factory/config, readOnly: true}
            - {name: broker-ca, mountPath: /etc/agent-factory/openbao-ca, readOnly: true}
            - {name: github, mountPath: /etc/agent-factory-github, readOnly: true}
            - {name: merger, mountPath: /etc/agent-factory-merger, readOnly: true}
            {{- if .Values.runTokens.enabled }}
            - {name: run-tokens, mountPath: /etc/agent-factory-run-tokens, readOnly: true}
            {{- end }}
            - {name: rooms-token, mountPath: /var/run/secrets/agents/rooms, readOnly: true}
            {{- if not .Values.demo }}
            - {name: oidc, mountPath: /etc/agent-factory-oidc, readOnly: true}
            {{- end }}
            - {name: intake, mountPath: /etc/agent-factory-intake, readOnly: true}
            - {name: zitadel-reader, mountPath: /etc/agent-factory-zitadel-reader, readOnly: true}
            - {name: sponsored, mountPath: /etc/agent-factory-sponsored, readOnly: true}
            {{- if .Values.api.tls.secretName }}
            - {name: api-tls, mountPath: /etc/agent-factory-api-tls, readOnly: true}
            {{- end }}
            {{- if .Values.hardening.publisher.audience }}
            - {name: octo-sts-token, mountPath: /var/run/secrets/octo-sts, readOnly: true}
            {{- end }}
            {{- if .Values.hardening.gitCache.sizeLimit }}
            - {name: git-cache, mountPath: /var/cache/maku/git}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: agent-factory-config}
        - name: broker-ca
          secret: {secretName: {{ .Values.brokerCASecret }}, items: [{key: ca.crt, path: ca.crt}]}
        - name: github
          secret: {secretName: {{ .Values.githubSecret }}, defaultMode: 0440}
        - name: merger
          # optional: a factory with every class off starts without the merger App (it fails closed); a
          # live or shadow class makes the binary refuse the start when the key is absent: a CrashLoop
          # with a log line, not ContainerCreating (values.yaml: hard prerequisite then).
          secret: {secretName: {{ .Values.mergerSecret }}, defaultMode: 0440, optional: true}
        {{- if .Values.runTokens.enabled }}
        - name: run-tokens
          # The App whose tokens fill agent-git and agent-git-read; 0440 with fsGroup, as the App keys.
          secret: {secretName: {{ required "runTokens.appSecret is required with runTokens.enabled" .Values.runTokens.appSecret }}, defaultMode: 0440}
        {{- end }}
        - name: rooms-token
          projected:
            sources:
              - serviceAccountToken: {audience: {{ .Values.roomsAudience }}, expirationSeconds: 3600, path: token}
        {{- if not .Values.demo }}
        - name: oidc
          secret: {secretName: {{ .Values.oidcSecret }}, defaultMode: 0444}
        {{- end }}
        - name: intake
          # 0440, not the plan's 0400: a 0400 Secret is root-only for uid 65532 — the chart's own
          # render test refuses it (review C1). Group bit plus fsGroup, as the App keys.
          # optional: without the token the intake refuses every request (503), never runs open (#57).
          secret: {secretName: {{ .Values.intakeSecret }}, defaultMode: 0440, optional: true}
        - name: zitadel-reader
          # optional: without it the run-request API cannot resolve a caller's GitHub login, and
          # refuses every human run (v2 D4); 0440 with fsGroup, as the other secrets.
          secret: {secretName: {{ .Values.zitadelReaderSecret }}, defaultMode: 0440, optional: true}
        - name: sponsored
          # optional: without it no sponsored client id or project id reads, and every sponsored
          # token is refused; 0440 with fsGroup, as the other secrets.
          secret: {secretName: {{ .Values.sponsoredSecret }}, defaultMode: 0440, optional: true}
        {{- if .Values.api.tls.secretName }}
        - name: api-tls
          # S-1: the run-request API's pair, re-read on renewal; 0440 with fsGroup, as the other secrets.
          secret: {secretName: {{ .Values.api.tls.secretName }}, defaultMode: 0440, items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]}
        {{- end }}
        {{- if .Values.hardening.publisher.audience }}
        - name: octo-sts-token
          # H2 (HR11): exchanged at octo-sts for the publisher's token, per enforced repository.
          projected:
            sources:
              - serviceAccountToken: {audience: {{ .Values.hardening.publisher.audience | quote }}, expirationSeconds: 3600, path: token}
        {{- end }}
        {{- if .Values.hardening.gitCache.sizeLimit }}
        - name: git-cache
          # H3 (HR24): the push applier's bare, blobless mirrors, one per enforced repository. A
          # cache: lost with the pod, re-cloned on the next push.
          emptyDir: {sizeLimit: {{ .Values.hardening.gitCache.sizeLimit | quote }}}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
