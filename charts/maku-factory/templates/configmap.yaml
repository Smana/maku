{{- $cfg := deepCopy .Values.config -}}
{{- if .Values.api.tls.secretName -}}
{{- $api := deepCopy (get $cfg "api" | default dict) -}}
{{- if hasKey $api "tls" -}}
{{- fail "config.api.tls and api.tls.secretName: set api.tls.secretName alone; the chart writes config.api.tls to read the mounted pair" -}}
{{- end -}}
{{- $_ := set $api "tls" (dict "certFile" "/etc/agent-factory-api-tls/tls.crt" "keyFile" "/etc/agent-factory-api-tls/tls.key") -}}
{{- $_ := set $cfg "api" $api -}}
{{- end -}}
{{- $apps := include "af.apps" . | fromJson -}}
{{- if or $apps.agents (not $apps.merger) -}}
{{- $gh := deepCopy (get $cfg "github" | default dict) -}}
{{- if $apps.agents -}}
{{- if or (hasKey $gh "agentsAppIDFile") (hasKey $gh "agentsKeyFile") -}}
{{- fail "config.github.agentsAppIDFile and apps.agents.existingSecret: set apps.agents.existingSecret alone; the chart writes config.github.agents* to read the mounted App" -}}
{{- end -}}
{{- $_ := set $gh "agentsAppIDFile" "/etc/agent-factory-agents/app_id" -}}
{{- $_ := set $gh "agentsKeyFile" "/etc/agent-factory-agents/private_key" -}}
{{- end -}}
{{- if not $apps.merger -}}
{{- if or (hasKey $gh "mergerAppIDFile") (hasKey $gh "mergerKeyFile") -}}
{{- fail "config.github.mergerAppIDFile and apps.merger.mode factory: set apps.merger.mode alone; the chart writes config.github.merger* as the factory App's files" -}}
{{- end -}}
{{- $_ := set $gh "mergerAppIDFile" (get $gh "appIDFile" | default "/etc/agent-factory-github/app_id") -}}
{{- $_ := set $gh "mergerKeyFile" (get $gh "privateKeyFile" | default "/etc/agent-factory-github/private_key") -}}
{{- end -}}
{{- $_ := set $cfg "github" $gh -}}
{{- end -}}
{{- if and .Values.runTokens.perRun (not .Values.runTokens.enabled) (not .Values.demo) -}}
{{- fail "runTokens.perRun needs runTokens.enabled: the agents App in apps.agents.existingSecret mints each run's token (the demo mints from the factory's)" -}}
{{- end -}}
{{- if or .Values.runTokens.enabled .Values.runTokens.perRun -}}
{{- if hasKey $cfg "runTokens" -}}
{{- fail "config.runTokens and runTokens.enabled: set runTokens.enabled alone; the chart writes config.runTokens to read the mounted App" -}}
{{- end -}}
{{- $rt := dict -}}
{{- if .Values.runTokens.enabled -}}
{{- $rt = dict "enabled" true -}}
{{- end -}}
{{- if .Values.runTokens.perRun -}}
{{- $_ := set $rt "perRun" true -}}
{{- end -}}
{{- $_ := set $cfg "runTokens" $rt -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-factory-config
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- tpl (toYaml $cfg) . | nindent 4 }}
