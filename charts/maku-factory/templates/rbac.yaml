{{- /* The AgentRun Role follows config.runs, as the binary does (runwatch.Kind); unset fields take runwatch.DefaultKind's. */}}
{{- $runs := .Values.config.runs | default dict }}
{{- $runsNamespace := $runs.namespace | default "agents" }}
{{- $runsGroup := $runs.group | default "cloud.ogenki.io" }}
---
# Tasks, their rooms, the stop object, the day ledgers (R50), leader election (§6.5).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-factory
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [maku.ogenki.io]
    resources: [tasks]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [maku.ogenki.io]
    resources: [tasks/status]
    verbs: [get, update, patch]
  - apiGroups: [maku.ogenki.io]
    resources: [factories, repositories, mergepolicies]
    verbs: [get, list, watch]
  - apiGroups: [maku.ogenki.io]
    resources: [factories/status, repositories/status, mergepolicies/status]
    verbs: [get, update, patch]
  - apiGroups: [maku.ogenki.io]
    resources: [rooms]
    verbs: [get, list, watch, create, delete]
  # ConfigMaps: the stop object, the meter heartbeat (agent-factory-meter), R50's day ledgers
  # (names carry the date, so resourceNames cannot bound them) and nothing else. The Role's namespace is the bound: the factory can read and
  # write every ConfigMap in it, its own config included, so the namespace holds no ConfigMap it
  # must not touch. watch is for the stop object's cache.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  {{- if .Values.preflight.enabled }}
  # The install's preflight (v4 D24): the factory's exposure check reads the namespace's routes, to
  # refuse one that reaches the broker around oauth2-proxy (F5). Read only.
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-factory
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-factory}
subjects:
  - {kind: ServiceAccount, name: agent-factory, namespace: {{ .Release.Namespace }}}
---
# AgentRuns: the factory creates them, meters them (annotations only, Kyverno-limited from
# phase 5), and deletes them. Never Secrets, never another namespace's objects, with one exception:
# demo or runTokens.enabled lets the factory keep the run-controller's agent-git and agent-git-read
# Secrets filled with tokens minted from a GitHub App. create cannot be scoped by name in
# Kubernetes; get and update can.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-factory
  namespace: {{ $runsNamespace }}
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [{{ $runsGroup }}]
    resources: [agentruns]
    verbs: [get, list, watch, create, patch, delete]
  {{- if .Values.runTokens.perRun }}
  # runTokens.perRun (v4 D10, plan PR3): each run's <run name>-git, written by server-side apply
  # and deleted at the run's end. No get, list or watch: the factory never reads a Secret back. A
  # patch or delete answers with the object, so the admission policy rendered beside this Role
  # (run-token-policy.yaml) bounds these verbs to the run token Secrets.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch, delete]
  {{- else if or .Values.demo .Values.runTokens.enabled }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [agent-git, agent-git-read]
    verbs: [get, update]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-factory
  namespace: {{ $runsNamespace }}
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-factory}
subjects:
  - {kind: ServiceAccount, name: agent-factory, namespace: {{ .Release.Namespace }}}
{{- if .Values.monitor.flux.enabled }}
---
# The post-merge monitor's Flux signal (merge gate classes MC7, R34): read-only, uncached, three
# kinds, no watch. The GitRepository is read by name; the other two are only listed. Nothing else of
# the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-factory-flux-reader
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-factory-flux-reader
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-factory-flux-reader}
subjects:
  - {kind: ServiceAccount, name: agent-factory, namespace: {{ .Release.Namespace }}}
{{- end }}
