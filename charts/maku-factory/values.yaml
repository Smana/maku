image:
  repository: ghcr.io/smana/maku-factory
  # Required: "<version>@sha256:<digest>". Never a bare tag.
  tag: ""
replicas: 2
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
# Secrets, their keys and mount paths, and the merger-key prerequisite: README.md#prerequisites.
# The GitHub Apps (v4 D12; docs/github-apps.md). apps.factory mounts the factory App (keys app_id,
# private_key) at /etc/agent-factory-github. apps.agents mounts the agents App at
# /etc/agent-factory-agents and writes config.github.agentsAppIDFile and agentsKeyFile.
# apps.merger.mode separate mounts the merger App from apps.merger.existingSecret (empty means
# agent-factory-merger) at /etc/agent-factory-merger; factory folds the merger into the factory App:
# no merger volume, and config.github.mergerAppIDFile and mergerKeyFile name the factory App's files
# (every repository's merge.mergerLogin is then factoryLogin). Each key that writes config fails the
# render when config already sets that key. The older githubSecret, mergerSecret and
# runTokens.appSecret are removed (v4 step 8): the render fails naming their apps.* replacement.
apps:
  factory:
    existingSecret: agent-factory-github
  agents:
    existingSecret: ""
  merger:
    mode: separate
    # HARD PREREQUISITE with mode separate when any merge class is live or in shadow:
    # README.md#prerequisites. Empty means agent-factory-merger; set it only with mode separate.
    existingSecret: ""
brokerCASecret: openbao-ca
# Audience of the projected token for the broker's system API.
roomsAudience: rooms-system
# The cluster's DNS domain, for the run-request API certificate's names.
clusterDomain: cluster.local
# TLS on the run-request API (S-1, D6). secretName set: the Secret (tls.crt, tls.key) is mounted
# at /etc/agent-factory-api-tls, config.api.tls is written to read it, and the Service port is
# named https; point the broker's factoryURL at https://agent-factory.<namespace>.svc:8082 and its
# broker.factoryCA at the issuing CA. A cert-manager Certificate is rendered for it only when
# issuerRef.name is set; otherwise bring the Secret yourself. Empty: plaintext, and the broker
# needs factoryInsecure: true to call it.
api:
  tls:
    secretName: ""
    issuerRef: {kind: ClusterIssuer, name: ""}
# The laptop demo: no OIDC volume (the factory takes no human tokens) and, in the runs namespace,
# the Secret access the run token writer needs for agent-git and agent-git-read, minted from the
# factory's App.
demo: false
# The run token writer outside the demo (v4 step 2): the factory keeps the run-controller's
# agent-git (write) and agent-git-read (read) Secrets filled with installation tokens of the agents
# App (apps.agents.existingSecret). The factory's config must name runs.group maku.ogenki.io.
runTokens:
  enabled: false
  # perRun (v4 D10): one token per run instead of the two shared Secrets, minted from the same App
  # for the run's repository and role, written as the run's own Secret <run name>-git. The
  # factory's Role in the runs namespace then holds create, patch and delete on Secrets, never get,
  # and an admission policy (always rendered with it) bounds those verbs to run token Secrets it
  # labels and the run owns. Needs enabled (or demo), maku's runController.gitTokens: perRun, and
  # config.runs.group maku.ogenki.io.
  perRun: false
oidcSecret: agent-factory-oidc
intakeSecret: agent-factory-intake
# v2 D4: the ZITADEL reader ({"pat", "githubIdpId"}) that resolves an API caller to their GitHub
# login, read at config.api.access.readerFile. Optional: without it every human run is refused.
# Deprecated (v4 D8): set config.api.access.links: broker to read each human's GitHub account link
# from the broker instead; with both, the reader is read only for an account with no link. v4 step 8
# removes it.
zitadelReaderSecret: agent-factory-zitadel-reader
# Factory interfaces F4: the sponsored principals' ZITADEL client ids, one key `<name>-client-id`
# each, and `project-id`, the project every sponsored token's audience must hold. Read at
# config.api.sponsored[].clientIDFile and config.api.projectIDFile. Optional: without it no
# sponsored client id reads, and every sponsored token is refused.
sponsoredSecret: agent-factory-sponsored
# Test-only env, volumes and mounts, with the same shapes as the maku broker chart.
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
# The post-merge monitor (merge gate classes MC7, R34). `flux.enabled` renders the read-only
# The cluster's shared roles (D2, step 7 R10): maku-factory-admin, maku-mergepolicy-editor and
# maku-viewer, aggregated into the built-in admin, edit and view roles, and agent-factory-flux-reader
# (with monitor.flux). One set serves every install in a cluster, so agent-factory-crds renders them and
# the umbrella sets false here. true: this chart renders them, as it did before the CRD chart.
clusterRoles: true
# ClusterRole that lets a class's `monitor.flux` read Flux's objects: get on gitrepositories, list
# on kustomizations and helmreleases, no watch. Off by default; enable it with the first
# monitored class that declares `monitor.flux`.
monitor:
  flux:
    enabled: false
# Untrusted-input hardening H2 (HR11): with publisher.audience set, the factory pod mounts a
# projected ServiceAccount token of that audience at /var/run/secrets/octo-sts/token, where
# config.hardening.publisher.octoSTS.tokenFile reads it by default. octo-sts exchanges it for the
# publisher's token under each enforced repository's .github/chainguard/publisher.sts.yaml. Empty:
# no token, and config.hardening.enforceOutputs must stay empty unless the minter publishes.
# Unused with config.hardening.publisher.minter: true (v4 D10), where the factory mints the
# publisher's token from the agents App (apps.agents.existingSecret) and reads no projected token.
hardening:
  publisher:
    audience: ""
  # H3 (HR24): with sizeLimit set (e.g. 2Gi), the factory pod mounts an emptyDir of that limit at
  # /var/cache/maku/git and sets MAKU_GIT_CACHE to it: the push applier's bare, blobless mirrors.
  # Empty: no cache, and a repository whose config.hardening.enforceOutputs names push refuses the
  # factory's start.
  gitCache:
    sizeLimit: ""
# The factory config, passed through `tpl` (so `{{ .Release.Namespace }}` works): README.md#config, docs/factory.md#the-config-file.
# With runs.group maku.ogenki.io, set config.runs.gatewayIdentity: true once the run-controller runs
# in model.mode gateway (docs/gateway.md, GW10): the meter then prices the runs, and loops.<class>.models
# and split are accepted. Not defaulted: the runs carry the identity only in gateway mode.
config: {}

# CI only: images loaded into the node have no registry digest. Accepts a bare tag and never pulls.
e2e:
  unpinnedImages: false

# The install's preflight (v4 D24): enabled serves the factory's checks at GET /preflight on :9090,
# and grants its Role get and list on the namespace's HTTPRoutes, GRPCRoutes, TLSRoutes and
# Ingresses, which the exposure check reads. Off, there is no /preflight. Set it with
# maku.preflight.enabled.
preflight:
  enabled: false
