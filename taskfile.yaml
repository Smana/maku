version: "3"

tasks:
  check:
    desc: Every gate CI runs. Cite its exit code as evidence.
    cmds:
      - task: check:static
      - task: test

  check:static:
    desc: Every gate of check but the Go tests (CI runs those as test:shard, on several runners).
    cmds:
      - task: spdx
      - task: tidy
      - task: lint
      - task: vuln
      - task: crd:check
      - task: chart:check
      - task: quickstart:check
      - task: demo:check
      - task: migrations
      - task: docs
      - task: names
      - task: scripts
      - task: ui:test
      - task: ui:check

  spdx:
    desc: Every .go file opens with the SPDX license line.
    cmds:
      - hack/spdx.sh

  tidy:
    desc: Fail if go.mod or go.sum would change under go mod tidy.
    cmds:
      - go mod tidy -diff

  lint:
    desc: golangci-lint v2 (the mise pin, never a stale v1 on PATH) under go.mod's toolchain.
    cmds:
      - hack/lint.sh

  docs:
    desc: Reader pages carry no per-row status tags, and every relative link and anchor resolves.
    cmds:
      - bash hack/docs_test.sh
      - bash hack/docs.sh

  names:
    desc: No artifact name from before the maku rebrand outside the historical docs (hack/names.sh).
    cmds:
      - bash hack/names_test.sh
      - bash hack/names.sh

  scripts:
    desc: The operator scripts under scripts/, against fakes.
    cmds:
      - bash scripts/shadow-merge-tally_test.sh
      - bash scripts/stall-steps_test.sh

  vuln:
    desc: Known vulnerabilities reachable from our code, the stdlib included.
    # go run builds govulncheck with the current Go: a binary built by an older Go
    # cannot load packages that need a newer one. Same version as mise.toml.
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test:
    cmds:
      - go test -race -count=1 ./...
    env:
      # envtest's kube-apiserver and etcd, downloaded once per version into the user cache.
      KUBEBUILDER_ASSETS:
        sh: go tool setup-envtest use -p path 1.36.x

  test:shard:
    desc: "One of N disjoint slices of test, by test name (hack/test-shard.sh): task test:shard SHARD=1 SHARDS=3"
    requires:
      vars: [SHARD, SHARDS]
    cmds:
      - bash hack/test-shard.sh {{.SHARD}} {{.SHARDS}}
    env:
      KUBEBUILDER_ASSETS:
        sh: go tool setup-envtest use -p path 1.36.x

  intent:eval:
    desc: The synthetic intent set against a live model (INTENT_EVAL_URL, INTENT_EVAL_KEY_FILE); prints the confusion matrix, fails under 95 % write-intent precision.
    cmds:
      - go test -count=1 -run TestSyntheticSetLive -v ./internal/intent

  migrations:
    desc: atlas.sum matches the migration directory, as the Atlas operator checks it. Offline.
    cmds:
      - atlas migrate validate --dir file://internal/store/migrations

  crd:gen:
    cmds:
      - go tool controller-gen object crd:allowDangerousTypes=true paths=./api/... paths=./internal/factory/config/... output:crd:dir=./config/crd
      # controller-gen always writes //go:build first, and hack/spdx.sh wants the
      # license line there; Go allows line comments before the constraint.
      - |
        for f in api/v1alpha1/zz_generated.deepcopy.go api/factory/v1alpha1/zz_generated.deepcopy.go internal/factory/config/zz_generated.deepcopy.go; do
          { printf '// SPDX-License-Identifier: Apache-2.0\n\n'; cat "$f"; } > "$f.tmp" && mv "$f.tmp" "$f"
        done
      # The factory chart ships the Task CRD: Tasks are runtime objects, never in Git.
      - cp config/crd/maku.ogenki.io_tasks.yaml config/crd/maku.ogenki.io_factories.yaml config/crd/maku.ogenki.io_repositories.yaml config/crd/maku.ogenki.io_mergepolicies.yaml charts/maku-factory/crds/
      # The umbrella chart ships the broker's two: Rooms and the AgentRuns it watches.
      - mkdir -p charts/maku/crds
      - cp config/crd/maku.ogenki.io_rooms.yaml config/crd/maku.ogenki.io_agentruns.yaml charts/maku/crds/
      # agent-factory-crds ships all six as templates (every tool upgrades them); files/ is what they render.
      - mkdir -p charts/agent-factory-crds/files
      - cp config/crd/maku.ogenki.io_*.yaml charts/agent-factory-crds/files/

  crd:check:
    desc: The committed CRD is exactly what the types generate.
    cmds:
      - task: crd:gen
      - git diff --exit-code -- config/crd api charts

  chart:deps:
    desc: Check the vendored agentgateway CRDs and controller chart against hack/agentgateway.sha256 (offline)
    cmds:
      - bash hack/agentgateway-vendor.sh check

  chart:check:
    desc: Lint and render the CRD, factory, gateway and umbrella charts; the umbrella's alerts under promtool.
    cmds:
      - task: chart:deps
      - helm lint --strict charts/agent-factory-crds
      - bash charts/agent-factory-crds/tests/render.sh
      - helm lint --strict charts/maku-gateway
      - bash charts/maku-gateway/tests/render.sh
      - helm lint --strict charts/maku-factory --set image.tag='v0.0.0@sha256:0000'
      - bash charts/maku-factory/tests/render.sh
      - helm lint --strict charts/maku -f charts/maku/values-quickstart.yaml --set broker.image.tag='v0.0.0@sha256:0000' --set runController.image.tag='v0.0.0@sha256:0000' --set runController.images.harness.tag='v0.0.0@sha256:0000' --set runController.images.bridge.tag='v0.0.0@sha256:0000'
      - bash charts/maku/tests/render.sh
      - helm dependency build charts/agent-factory
      - helm lint --strict charts/agent-factory --set maku.broker.image.tag='v0.0.0@sha256:0000' --set maku.runController.image.tag='v0.0.0@sha256:0000' --set maku.runController.images.harness.tag='v0.0.0@sha256:0000' --set maku.runController.images.bridge.tag='v0.0.0@sha256:0000' --set maku-factory.image.tag='v0.0.0@sha256:0000' -f charts/agent-factory/values-demo.yaml --set demo.model.baseURL=http://model.example.test/v1 --set demo.model.name=m --set demo.model.apiKey=k --set demo.githubApp.id=1 --set demo.githubApp.privateKey=pem
      - bash charts/agent-factory/tests/render.sh
      - bash charts/agent-factory/tests/schema.sh
      - bash charts/agent-factory/tests/monitoring.sh
      - bash charts/agent-factory/tests/promql-only.sh
      - bash charts/agent-factory/tests/monitoring/dashboards.sh
      - git diff --exit-code -- config/crd api

  chart:install:k3d:
    desc: Install the demo profile on a throwaway k3d cluster and assert it (docker, k3d; not part of check)
    cmds:
      - bash charts/agent-factory/tests/install.sh k3d

  chart:install:k3d:external-db:
    desc: The demo on k3d against a plain postgres:16 outside the chart, bootstrapped with docs/database.md (v4 D9)
    cmds:
      - EXTERNAL_DB=1 bash charts/agent-factory/tests/install.sh k3d

  chart:install:k3d:netpol:
    desc: The demo on k3d in networkPolicies.mode kubernetes, enforced (the preflight passes) and unenforced (it refuses runs)
    cmds:
      - NETPOL=kubernetes bash charts/agent-factory/tests/install.sh k3d
      - NETPOL=unenforced bash charts/agent-factory/tests/install.sh k3d

  chart:gateway:k3d:
    desc: The gateway demo on k3d (values-demo-gateway.yaml, agentgateway, its CRDs); a run-like token reaches its alias only, and a run in model.mode gateway reaches its model with its own token
    cmds:
      - GATEWAY=1 bash charts/agent-factory/tests/install.sh k3d

  chart:metering:k3d:
    desc: The gateway demo with a meter on k3d (tests/metering-values.yaml, a test-only VictoriaMetrics); a run's tokens are read under agentgateway's names and priced
    cmds:
      - GATEWAY=1 METERING=1 bash charts/agent-factory/tests/install.sh k3d

  chart:tracing:k3d:
    desc: The gateway demo with run traces on k3d; the e2e stub is the OTLP sink, and a run's span reaches it under its task's trace id (NETPOL=kubernetes also asserts the run's collector rule, once the gateway leg runs in that mode)
    cmds:
      - GATEWAY=1 TRACING=1 bash charts/agent-factory/tests/install.sh k3d

  chart:gateway:probe:
    desc: Assert what maku-gateway relies on against agentgateway on a throwaway k3d (docker, k3d; not part of check)
    cmds:
      - bash charts/maku-gateway/tests/probe/probe.sh

  chart:install:kind:
    desc: Install the demo profile on a throwaway kind cluster and assert it (docker, kind; not part of check)
    cmds:
      - bash charts/agent-factory/tests/install.sh kind

  chart:identity:k3d:
    desc: Prove the broker in preset generic against the in-cluster stub issuer on throwaway k3d (docker, k3d; not part of check)
    cmds:
      - bash charts/agent-factory/tests/identity.sh

  chart:intake:k3d:
    desc: Prove planner revisions against in-cluster stubs on throwaway k3d (docker, k3d; not part of check)
    cmds:
      - bash charts/agent-factory/tests/intake.sh

  quickstart:
    desc: kind + Cilium + gVisor + cert-manager + CNPG + the chart + maku (Linux, docker; MODEL_API_KEY, GITHUB_TOKEN, REPO)
    cmds:
      - hack/quickstart/up.sh

  quickstart:down:
    desc: Delete the quickstart kind cluster
    cmds:
      - hack/quickstart/down.sh

  quickstart:check:
    desc: Offline drift check of the quickstart scripts against the chart (no cluster, no docker)
    cmds:
      - bash hack/quickstart/check.sh

  demo:
    desc: The Agent Factory on your laptop in one command (kind or k3d, Docker, Helm, kubectl); resumes where it stopped
    interactive: true
    cmds:
      - hack/demo/up.sh

  demo:down:
    desc: Stop the demo's port-forward and delete its cluster; keeps the GitHub App unless `-- --all`
    cmds:
      - hack/demo/down.sh {{.CLI_ARGS}}

  demo:check:
    desc: Offline check of the demo scripts (shellcheck and the unit tests of hack/demo/lib.sh)
    cmds:
      - shellcheck -x hack/demo/*.sh
      - bash hack/demo/lib_test.sh

  harness:test:
    desc: The agent harness image's test stage (needs docker; kept out of check, which does not)
    cmds:
      - docker build --target test images/maku-harness

  harness:checks:
    desc: "v3 feature 3, offline proof 4: the harness under runsc runs both repositories' checks behind an allowlist proxy (docker with runsc; TOKEN_FILE=<a GitHub token file>)"
    cmds:
      - docker build -t maku-harness:checks images/maku-harness
      - images/maku-harness/tests/checks/run.sh maku-harness:checks Smana/ai-native-ref golang,pypi {{.TOKEN_FILE}}
      - images/maku-harness/tests/checks/run.sh maku-harness:checks Smana/cloud-native-ref pypi {{.TOKEN_FILE}}

  # web/ builds on the nodejs mise.toml pins, from package-lock.json only (npm ci).
  ui:build:
    dir: web
    cmds:
      - npm ci --no-audit --no-fund
      - npm run build

  ui:test:
    dir: web
    cmds:
      - npm ci --no-audit --no-fund
      - npm run typecheck
      - npm test

  ui:check:
    desc: The committed UI bundle is exactly what web/ builds.
    cmds:
      - task: ui:build
      - git diff --exit-code -- internal/humanapi/ui/dist
      # A file the build adds is untracked, which git diff does not see.
      - test -z "$(git ls-files --others --exclude-standard -- internal/humanapi/ui/dist)"
