factory: "aws-0"
classes:
  a-docs:
    description: "Keep the docs links working"
    mode: "live"
    author: "agents"
    harness: "docs-standard"
  z-oracle:
    mode: "shadow"
    author: "adopt"
    adopt:
      logins: ["renovate[bot]"]
      branches: ["^renovate/"]
    harness: "docs-standard"
    harnessAllowed: ["docs-search", "docs-frontier"]
    escalation:
      outOfBudget: "docs-frontier"
      notConverged: "docs-search"
    conditions:
      all:
        - oracle:
            probe: "links"
            workflow: "detect.yaml"
            maxFindings: 4
        - allowedFiles: ["^docs/.+$"]
        - modifyOnly: true
        - maxPatchFiles: 5
        - maxModifiedLines: 50
        - diffShape: "links-only"
        - holdoutChecks: ["links 🔗"]
        - releaseAgeCheck: "renovate/stability-days"
      any:
        - - requiredLabel: "safe"
        - - companionFiles: ["^CHANGELOG\\.md$"]
      deny:
        - protectedFiles: ["^docs/security/.+$"]
    requiresApproval:
      - changedFiles: ["^docs/architecture/.+$"]
    limits:
      maxPerDay: 3
    monitor:
      oracleRuns: 2
      flux:
        source: "flux-system/flux-system"
        within: "1h"
      verification:
        within: "24h"
      followUpWindow: "168h"
