factory: "aws-0"
classes:
  docs-or-tests:
    description: "One class for two kinds of small change, documentation or tests, each with its own check. A pull request that mixes the two is not this class's."
    mode: "shadow"
    author: "agents"
    harness: "docs-standard"
    conditions:
      all:
        - maxPatchFiles: 10
        - maxModifiedLines: 200
      any:
        - - allowedFiles: ["^docs/.+\\.md$"]
          - holdoutChecks: ["Check the documentation links 🔗"]
        - - allowedFiles: ["^test/.+$", "^.+_test\\.go$"]
          - holdoutChecks: ["Tests"]
    limits:
      maxPerDay: 2
    monitor:
      followUpWindow: "168h"
