apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: alert-rules
  namespace: agent-system
spec:
  monitor:
    followUpWindow: 2h0m0s
    verification:
      within: 2h0m0s
  requires:
  - allowedFiles
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: dashboards
  namespace: agent-system
spec: {}
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: dead-links
  namespace: agent-system
spec:
  diffShape: links-only
  holdoutChecks:
  - "External links \U0001F517"
  maxModifiedLines: 20
  maxPerDay: 1
  modifyOnly: true
  monitor:
    followUpWindow: 168h0m0s
    oracleRuns: 2
  oracle:
    maxFindings: 10
    probe: dead-links
  protectedFiles:
  - ^docs/(superpowers|specs)/
  - ^website/content/docs/decisions/
  requires:
  - allowedFiles
  - oracleWorkflow
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: deps-minor
  namespace: agent-system
spec:
  author:
    adopt:
      branches:
      - ^renovate/
      logins:
      - renovate[bot]
  diffShape: semver-minor
  maxModifiedLines: 10
  maxPatchFiles: 3
  modifyOnly: true
  monitor:
    flux:
      within: 1h0m0s
    followUpWindow: 168h0m0s
  protectedFiles:
  - ^security/base/zitadel/
  - ^security/(aws|gcp)-0/zitadel/
  - ^flux/sources/helmrepo-zitadel\.yaml$
  - ^infrastructure/base/crossplane/configuration-core/
  - ^flux/sources/gitrepo-gateway-api\.yaml$
  - ^observability/base/victoria-metrics-k8s-stack/vm-common-helm-values-configmap\.yaml$
  releaseAgeCheck: renovate/stability-days
  requires:
  - allowedFiles
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: deps-patch
  namespace: agent-system
spec:
  author:
    adopt:
      branches:
      - ^renovate/
      logins:
      - renovate[bot]
  diffShape: semver-patch
  maxModifiedLines: 10
  maxPatchFiles: 3
  maxPerDay: 2
  modifyOnly: true
  monitor:
    flux:
      within: 1h0m0s
    followUpWindow: 168h0m0s
  protectedFiles:
  - ^security/base/zitadel/
  - ^security/(aws|gcp)-0/zitadel/
  - ^flux/sources/helmrepo-zitadel\.yaml$
  - ^infrastructure/base/crossplane/configuration-core/
  - ^flux/sources/gitrepo-gateway-api\.yaml$
  - ^observability/base/victoria-metrics-k8s-stack/vm-common-helm-values-configmap\.yaml$
  releaseAgeCheck: renovate/stability-days
  requires:
  - allowedFiles
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: docs
  namespace: agent-system
spec:
  checks: true
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: docs-links
  namespace: agent-system
spec:
  requires:
  - holdoutChecks
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: kb-entries
  namespace: agent-system
spec:
  author:
    adopt:
      branches:
      - ^runlore/kb-
      logins:
      - runlore[bot]
  diffShape: added-entry
  holdoutChecks:
  - validate
  maxPerDay: 5
  requires:
  - allowedFiles
  - companionFiles
  - requiredLabel
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: revert
  namespace: agent-system
spec:
  requires:
  - holdoutChecks
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: review
  namespace: agent-system
spec: {}
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: scripts
  namespace: agent-system
spec: {}
---
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: tests
  namespace: agent-system
spec: {}
