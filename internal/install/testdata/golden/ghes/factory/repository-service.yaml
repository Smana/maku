apiVersion: maku.ogenki.io/v1alpha1
kind: Repository
metadata:
  name: service
  namespace: factory
spec:
  factoryRef: agent-factory
  maintainers:
  - carol
  merge:
    checkReruns: 1
    fixRuns: 2
    gateStatus: true
    leakScanCheck: ci
    maxPerDay: 5
    policyBot: false
    requiredChecks:
    - ci
    verifyChecks:
    - ci
  mergePolicies:
  - allowedFiles:
    - ^.+\.(md|mdx|adoc|rst)$
    mode: shadow
    name: docs-links
  - allowedFiles:
    - ^.+$
    mode: shadow
    name: revert
  repository: platform/service
  triggerLabel: factory/ready
