# Argo CD 2.12 or later: register ghcr.io as a Helm OCI repository first. Argo CD runs no Helm
# test hook: run helm test (the preflight) by hand once the umbrella is synced.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "0"
  name: agent-factory-crds
  namespace: argocd
spec:
  destination:
    namespace: factory
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: agent-factory-crds
    helm:
      valuesObject:
        keep: true
    repoURL: ghcr.io/smana/charts
    targetRevision: 0.48.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "1"
  name: agentgateway-crds
  namespace: argocd
spec:
  destination:
    namespace: factory
    server: https://kubernetes.default.svc
  project: default
  source:
    path: config/agentgateway
    repoURL: https://github.com/Smana/maku
    targetRevision: v0.48.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - Prune=false
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "2"
  name: agent-factory
  namespace: argocd
spec:
  destination:
    namespace: factory
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: agent-factory
    helm:
      releaseName: agent-factory
      skipCrds: true
      valuesObject:
        agentgateway:
          enabled: true
        expose:
          ingress:
            className: nginx
          mode: ingress
          networkPolicy:
            from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx
          web:
            hostnames:
            - rooms.example.com
            tls:
            - hosts:
              - rooms.example.com
              secretName: rooms-tls
        maku:
          agentRunPolicies:
            creators:
            - system:serviceaccount:factory:agent-factory
            factoryServiceAccount: agent-factory
          broker:
            database:
              brokerSecret: rooms-broker-dsn
              ownerSecret: rooms-owner-dsn
              retentionSecret: rooms-retention-dsn
              secretKey: uri
            extraEnv:
            - name: ROOMS_GITHUB_APP_DIR
              value: /etc/maku/github-app
            - name: ROOMS_GITHUB_API_URL
              value: https://ghe.example.com/api/v3/
            extraVolumeMounts:
            - mountPath: /etc/maku/github-app
              name: github-app
              readOnly: true
            extraVolumes:
            - name: github-app
              secret:
                defaultMode: 288
                secretName: agent-factory-github
            factoryCA:
              secretName: agent-factory-ca
            factoryURL: https://agent-factory.factory.svc:8082
            githubLink:
              existingSecret: maku-github-link
              webURL: https://ghe.example.com
            human:
              access:
                ttl: 5m
              groups:
                admin: agents-admin
                member: agents-member
              issuer: https://login.example.com/realms/eng
              mode: oidc
              origin: https://rooms.example.com
              preset: generic
              rolesClaim: groups
              tokenUse: id
            image:
              tag: v0.48.0@sha256:1111111111111111111111111111111111111111111111111111111111111111
            oidc:
              existingSecret: rooms-oidc
            publicURL: https://rooms.example.com
            runIssuer:
              issuer: https://oidc.eks.eu-west-1.amazonaws.com/id/ABC
              jwksURL: https://oidc.eks.eu-west-1.amazonaws.com/id/ABC/keys
            systemIssuer:
              issuer: https://oidc.eks.eu-west-1.amazonaws.com/id/ABC
              jwksURL: https://oidc.eks.eu-west-1.amazonaws.com/id/ABC/keys
            systemPrincipals:
              system:serviceaccount:factory:agent-factory: system:factory
            tls:
              issuerRef:
                kind: ClusterIssuer
                name: internal-ca
            webProxy: true
          enabled: true
          networkPolicies:
            mode: kubernetes
          preflight:
            enabled: true
          runController:
            image:
              tag: v0.48.0@sha256:2222222222222222222222222222222222222222222222222222222222222222
            images:
              bridge:
                tag: v0.48.0@sha256:4444444444444444444444444444444444444444444444444444444444444444
              harness:
                tag: v0.48.0@sha256:3333333333333333333333333333333333333333333333333333333333333333
            model:
              gateway:
                aliases:
                  internal: []
                  public:
                  - agent-default
                  - tier-light
              mode: gateway
          sandbox:
            runtimeClassName: kata
        maku-factory:
          api:
            tls:
              issuerRef:
                kind: ClusterIssuer
                name: internal-ca
              secretName: agent-factory-api-tls
          apps:
            agents:
              existingSecret: agent-factory-agents
            factory:
              existingSecret: agent-factory-github
            merger:
              mode: factory
          config:
            agentsLogin: maku-platform-agents[bot]
            api:
              clientIDFiles:
              - /etc/agent-factory-oidc/web-client-id
              - /etc/agent-factory-oidc/cli-client-id
              groups:
                admin: agents-admin
                member: agents-member
              humanIssuer: https://login.example.com/realms/eng
              listen: :8082
              preset: generic
              rolesClaim: groups
              tokenUse: id
            broker:
              caFile: /etc/agent-factory/openbao-ca/ca.crt
              tokenFile: /var/run/secrets/agents/rooms/token
              url: https://room-broker.factory.svc.cluster.local:8443
            factory: agent-factory
            factoryLogin: maku-platform-factory[bot]
            github:
              appIDFile: /etc/agent-factory-github/app_id
              privateKeyFile: /etc/agent-factory-github/private_key
            meter:
              query: sum by (ar_agent, gen_ai_request_model, gen_ai_token_type, pod)
                (agentgateway_gen_ai_client_token_usage_sum{ar_agent=~"system:serviceaccount:agents:run-.+"})
              throttle:
                promQuery: sum by (ar_agent) (increase(agentgateway_requests_total{status="429",
                  reason="RateLimit", ar_agent=~"system:serviceaccount:agents:run-.+"}[5m]))
                  > 0
              url: https://prometheus.example.com
            poll:
              issues: 60s
              meter: 30s
              tasks: 30s
            roomsURL: https://rooms.example.com
            runs:
              gatewayIdentity: true
              group: maku.ogenki.io
              namePrefix: run-
              namespace: agents
          enabled: true
          extraEnv:
          - name: ROOMS_GITHUB_API_URL
            value: https://ghe.example.com/api/v3/
          image:
            tag: v0.48.0@sha256:5555555555555555555555555555555555555555555555555555555555555555
          oidcSecret: agent-factory-oidc
          preflight:
            enabled: true
          runTokens:
            enabled: true
            perRun: true
        maku-gateway:
          aliases:
            public:
              agent-default:
                model: gpt-5.1
                provider: openai
              tier-light:
                model: gpt-5.1
                provider: openai
          enabled: true
          identity:
            issuer: https://oidc.eks.eu-west-1.amazonaws.com/id/ABC
            jwks:
              url: https://oidc.eks.eu-west-1.amazonaws.com/id/ABC/keys
          providers:
            openai:
              existingSecret: model-provider
              key: apiKey
              preset: openai
          runs:
            namePrefix: run-
            namespace: agents
        monitoring:
          dashboards:
            enabled: false
          prometheusRule:
            enabled: false
          serviceMonitor:
            enabled: false
        networkPolicies:
          factory:
            enabled: true
        profile: production
        slack:
          enabled: false
        webProxy:
          enabled: true
          existingSecret: rooms-web-proxy
    repoURL: ghcr.io/smana/charts
    targetRevision: 0.48.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
