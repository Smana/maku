apiVersion: maku.ogenki.io/v1alpha1
kind: Repository
metadata:
  name: platform
  namespace: agent-system
spec:
  factoryRef: agent-factory
  maintainers:
  - alice
  merge:
    autoMergesPerDay: 5
    breaker:
      maxReverts: 1
      window: 10
    checkReruns: 1
    fixRuns: 2
    gateStatus: true
    leakScanCheck: lint
    mergerLogin: example-factory[bot]
    policyBot: false
    requiredChecks:
    - lint
    - test
    revertWindow: 168h
    verifyChecks:
    - lint
    - test
    verifyFor: 30m
  mergePolicies:
  - allowedFiles:
    - ^.+\.(md|mdx|adoc|rst)$
    mode: shadow
    name: docs-links
  - allowedFiles:
    - ^.+$
    mode: shadow
    name: revert
  repository: Example/platform
  triggerLabel: factory/ready
