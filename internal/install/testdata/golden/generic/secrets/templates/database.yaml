# Role rooms_broker (docs/database.md): postgresql://rooms_broker:<password>@<host>:5432/rooms?sslmode=verify-full&sslrootcert=/etc/room-broker/db-ca/ca.crt
apiVersion: v1
kind: Secret
metadata:
  name: rooms-broker-dsn
  namespace: maku
type: Opaque
stringData:
  uri: ""
