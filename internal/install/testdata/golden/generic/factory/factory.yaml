apiVersion: maku.ogenki.io/v1alpha1
kind: Factory
metadata:
  name: agent-factory
  namespace: maku
spec:
  caps:
    activeTasks: 3
    awaitingHumanWIP: 5
    concurrentRuns: 2
    maxTextBytes: 14336
    tasksPerDay: 20
  defaults:
    dataClass: public
    predictedClass: review
  loops:
    careful:
      ask: true
      judge: tier-light
      plan: true
      review: true
      search: true
      stallSteps: 80
      tests: true
    default:
      ask: true
      judge: none
      review: true
      stallSteps: 80
    quick:
      ask: true
      judge: none
      review: false
      stallSteps: 80
  mergeDefaults:
    breaker:
      maxReverts: 1
      window: 10
    mergerLogin: example-factory[bot]
    revertWindow: 168h
    verifyFor: 30m
  scoper:
    planTier: frontier
  templates:
    investigate:
      roles:
      - triager
    pair:
      maxReviewRounds: 2
      roles:
      - implementer
      - reviewer
    solo:
      roles:
      - implementer
  tiers:
    frontier:
      model: agent-default
      runMinutes: 90
      runTokens: 4000000
      taskTokens: 8000000
    light:
      model: tier-light
      runMinutes: 20
      runTokens: 300000
      taskTokens: 600000
    standard:
      model: agent-default
      runMinutes: 45
      runTokens: 1500000
      taskTokens: 3000000
  workflows:
    careful:
      description: Scoped first, judged before review. For wide or unclear tasks.
      loop: careful
      template: pair
      tier: frontier
    none:
      template: none
    quick:
      description: One implementer. For changes a check can verify.
      stepUp: standard
      template: solo
    standard:
      description: An implementer and a reviewer. The default.
      stepUp: careful
      template: pair
