apiVersion: maku.ogenki.io/v1alpha1
kind: Factory
metadata:
  name: agent-factory
  namespace: maku
spec:
  caps:
    activeTasks: 3
    awaitingHumanWIP: 5
    concurrentRuns: 2
    maxTextBytes: 14336
    tasksPerDay: 20
  defaults:
    dataClass: public
    predictedClass: review
  mergeDefaults:
    breaker:
      maxReverts: 1
      window: 10
    mergerLogin: example-factory[bot]
    revertWindow: 168h
    verifyFor: 30m
  scoper:
    planTier: frontier
  tiers:
    frontier:
      model: agent-default
      runMinutes: 90
      runTokens: 4000000
      taskTokens: 8000000
    light:
      model: tier-light
      runMinutes: 20
      runTokens: 300000
      taskTokens: 600000
    standard:
      model: agent-default
      runMinutes: 45
      runTokens: 1500000
      taskTokens: 3000000
  workflows:
    careful:
      budget: frontier
      description: Scoped first, judged before review. For wide or unclear tasks.
      stages:
      - gate:
          when: plan-first
        role: scoper
      - role: tester
        when: repository.testFirst
      - judge: evidence
        role: implementer
        search: true
        stall: true
      - maxRounds: 2
        role: reviewer
    none:
      template: none
    quick:
      budget: standard
      description: One implementer. For changes a check can verify.
      stages:
      - role: implementer
        stall: true
      stepUp: standard
    standard:
      budget: standard
      description: An implementer and a reviewer. The default.
      stages:
      - role: implementer
        stall: true
      - maxRounds: 2
        role: reviewer
      stepUp: careful
