apiVersion: maku.ogenki.io/v1alpha1
kind: Repository
metadata:
  name: docs
  namespace: maku
spec:
  factoryRef: agent-factory
  maintainers:
  - alice
  - bob
  merge:
    autoMergesPerDay: 5
    breaker:
      maxReverts: 1
      window: 10
    checkReruns: 1
    fixRuns: 2
    gateStatus: true
    leakScanCheck: ci
    mergerLogin: example-factory[bot]
    policyBot: false
    requiredChecks:
    - ci
    revertWindow: 168h
    verifyChecks:
    - ci
    verifyFor: 30m
  mergePolicies:
  - allowedFiles:
    - ^.+\.(md|mdx|adoc|rst)$
    mode: shadow
    name: docs-links
  - allowedFiles:
    - ^.+$
    mode: shadow
    name: revert
  repository: example/docs
  triggerLabel: factory/ready
