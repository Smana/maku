# What an agent runs before it pushes: the CI's fast subset. Read from the default branch only.
# The Maven wrapper (./mvnw, committed with .mvn/wrapper/) downloads Maven and the dependencies from
# Maven Central: the repository's Repository object grants the maven registry access.
version: 1
timeoutMinutes: 15
tools: [java]
definedBy: [mise.toml, pom.xml, .mvn/wrapper/maven-wrapper.properties, .github/workflows/ci.yaml]
steps:
  - {name: resolve, run: ./mvnw -B -q dependency:go-offline, ci: test, stopOnFailure: true}
  - {name: unit, run: ./mvnw -B -o test, ci: test}
ciOnly:
  - {check: test, part: "mvnw verify (Testcontainers)", why: "needs Docker; the sandbox has none"}
