name: release
on:
  push:
    tags: ["v*"]
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag can point at a commit that never passed CI: the gate runs once, before any image.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # No cache on the release path: a PR-written cache must not reach a published image.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
      - run: task check
      # The harness's suites, before anything is pushed. amd64 only: the arm64 image is published
      # untested, as it was in cloud-native-ref.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/maku-harness
          target: test
          push: false

  # Each image on native amd64 and arm64 runners, joined and signed (image.yaml).
  release:
    needs: gate
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [maku-broker, maku-bridge, maku-factory, maku-harness, maku-run-controller, maku-slack]
    uses: ./.github/workflows/image.yaml
    with:
      image: ${{ matrix.image }}
      version: ${{ github.ref_name }}

  # Signs each joined index here, not in image.yaml: the signature's identity stays this workflow's.
  # The digest, never the tag, so a re-pushed tag cannot inherit the signature.
  sign:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        image: [maku-broker, maku-bridge, maku-factory, maku-harness, maku-run-controller, maku-slack]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index-${{ matrix.image }}
          path: ${{ runner.temp }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ghcr.io/smana/${{ matrix.image }}
        run: |
          set -euo pipefail
          digest="$(cat "$RUNNER_TEMP/index-digest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest '$digest'" >&2; exit 1; }
          cosign sign --yes "${IMAGE}@${digest}"

  # The factory and umbrella charts at the tag's version, its appVersion the image of the same tag.
  chart-release:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
          install_args: helm aqua:mikefarah/yq
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # cosign reads Docker's credentials, not helm's registry config: without this the signature
      # upload is refused after the chart is pushed.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package, push and sign
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          app="$GITHUB_REF_NAME"
          export v app
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          # publish DIR NAME: package DIR at $v, push it, sign the digest, print it in the summary.
          publish() {
            helm package "$1" --version "$v" --app-version "$app"
            # Print the output whether or not the push fails: under bash -e a bare assignment
            # exits first and the error is lost.
            # ghcr intermittently answers a fresh push with "failed to perform Tag ... not found":
            # retry the push (it is idempotent: same content, same digest) before failing.
            for attempt in 1 2 3; do
              rc=0; out="$(helm push "$2-${v}.tgz" oci://ghcr.io/smana/charts 2>&1)" || rc=$?
              [ "$rc" -eq 0 ] && break
              echo "$out"; echo "helm push attempt $attempt failed (exit $rc), retrying" >&2; sleep $((attempt * 15))
            done
            echo "$out"
            [ "$rc" -eq 0 ] || { echo "helm push failed (exit $rc)" >&2; exit "$rc"; }
            digest="$(sed -n 's/^Digest: //p' <<<"$out")"
            [ -n "$digest" ] || { echo "helm push printed no digest" >&2; exit 1; }
            cosign sign --yes "ghcr.io/smana/charts/$2@${digest}"
            echo "### chart $2" >> "$GITHUB_STEP_SUMMARY"
            echo "oci://ghcr.io/smana/charts/$2:${v}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          }
          publish charts/maku-factory maku-factory
          # broker and run controller, same version, no dependency.
          publish charts/maku maku
          # the model gateway's objects (D7), consumed alone or through the umbrella.
          publish charts/maku-gateway maku-gateway
          # the CRDs, installed before agent-factory, with agentgateway's vendored CRDs (optional),
          # checked against their pins.
          bash hack/agentgateway-vendor.sh check
          publish charts/agent-factory-crds agent-factory-crds
          # The umbrella carries its subcharts at $v: on a copy (never committed), the sibling subcharts
          # and their file:// constraints take $v (the vendored agentgateway keeps v1.6.0), the copy's
          # vendored files are checked against the pins, then the dependencies are built into it.
          work="$RUNNER_TEMP/charts"
          cp -r charts "$work"
          for c in maku maku-factory maku-gateway; do yq -i '.version = env(v) | .appVersion = env(app)' "$work/$c/Chart.yaml"; done
          yq -i '(.dependencies[] | select(.repository | test("^file://\.\./"))).version = env(v)' "$work/agent-factory/Chart.yaml"
          rm -f "$work/agent-factory/Chart.lock"
          bash hack/agentgateway-vendor.sh check "$work"
          helm dependency build "$work/agent-factory"
          publish "$work/agent-factory" agent-factory

  # maku's binaries and their checksums, on the tag's GitHub release (P33), and the Room CRD:
  # cloud-native-ref vendors it from the release asset, not from a branch (ruling P16).
  cli:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release and its assets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/Smana/maku/internal/version.Version=${VERSION}" \
              -o "maku-${os}-${arch}" ./cmd/maku
          done
          sha256sum maku-* > maku.sha256
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          cp config/crd/maku.ogenki.io_rooms.yaml crd-rooms.yaml
          cp config/crd/maku.ogenki.io_agentruns.yaml crd-agentruns.yaml
          gh release upload "$TAG" maku-* maku.sha256 crd-rooms.yaml crd-agentruns.yaml --clobber
