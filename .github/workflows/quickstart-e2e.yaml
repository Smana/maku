# The whole quickstart in CI: this checkout's images and maku in kind, a stub model, one run to Succeeded through maku run.
# Needs the owner's secrets QUICKSTART_REPO (a throwaway owner/name) and QUICKSTART_GITHUB_TOKEN (a
# fine-grained PAT scoped to it: Contents read; the stub model never pushes). The repo needs a `main` branch with at least
# one commit: the harness branches from it. Without them (a fork PR) every step is skipped, not failed.
name: quickstart-e2e
on:
  pull_request:
    paths:
      - charts/**
      - hack/quickstart/**
      - cmd/**
      - internal/**
      - api/**
      - config/crd/**
      - images/**
      - go.mod
      - go.sum
      - mise.toml
      - .dockerignore
      - .github/workflows/quickstart-e2e.yaml
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: quickstart-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The four Go images are small enough to hand to both legs as one artifact. The much larger harness
  # stays built locally in each leg, avoiding a multi-GB upload and download.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QUICKSTART_REPO: ${{ secrets.QUICKSTART_REPO }}
    steps:
      - if: env.QUICKSTART_REPO != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - if: env.QUICKSTART_REPO != ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: env.QUICKSTART_REPO != ''
        run: |
          set -euo pipefail
          for i in maku-broker maku-bridge maku-run-controller; do
            docker build -q -f "images/$i/Dockerfile" -t "ghcr.io/smana/$i:e2e" . >/dev/null
          done
          docker build -q -f hack/quickstart/stub-model/Dockerfile -t ghcr.io/smana/stub-model:e2e . >/dev/null
          docker save ghcr.io/smana/maku-broker:e2e ghcr.io/smana/maku-bridge:e2e \
            ghcr.io/smana/maku-run-controller:e2e ghcr.io/smana/stub-model:e2e -o "$RUNNER_TEMP/images.tar"
      - if: env.QUICKSTART_REPO != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickstart-e2e-images
          path: ${{ runner.temp }}/images.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    needs: images
    # cilium: the default mode. kubernetes: plain NetworkPolicies and the egress proxy (v4 D6) on the
    # same Cilium, which enforces standard policies, under gVisor.
    name: e2e (${{ matrix.netpol }})
    strategy:
      fail-fast: false
      matrix:
        netpol: [cilium, kubernetes]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      QUICKSTART_REPO: ${{ secrets.QUICKSTART_REPO }}
      E2E_NETPOL: ${{ matrix.netpol }}
      PREBUILT: "1"
    steps:
      - if: env.QUICKSTART_REPO == ''
        run: |
          echo "::warning title=quickstart-e2e skipped::QUICKSTART_REPO is absent: nothing ran, so this green check proves nothing about the quickstart."
          {
            echo "### quickstart-e2e skipped: nothing ran"
            echo
            echo "A green check here is **not** a pass. Add these Actions secrets (a fork PR never receives them):"
            echo "- \`QUICKSTART_REPO\`: a throwaway \`owner/name\` with a \`main\` branch and one commit"
            echo "- \`QUICKSTART_GITHUB_TOKEN\`: a fine-grained PAT, Contents read on that repository"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: env.QUICKSTART_REPO != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - if: env.QUICKSTART_REPO != ''
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: go kubectl aqua:kubernetes-sigs/kind helm aqua:mikefarah/yq # go builds maku; kubectl is the mise.toml pin, within the kind node's skew
      - if: env.QUICKSTART_REPO != ''
        # ~14 GB free is less than the harness image takes once built, saved and loaded into kind.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - if: env.QUICKSTART_REPO != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quickstart-e2e-images
          path: ${{ runner.temp }}
      - if: env.QUICKSTART_REPO != ''
        run: docker load -i "$RUNNER_TEMP/images.tar" && rm "$RUNNER_TEMP/images.tar"
      - if: env.QUICKSTART_REPO != ''
        run: hack/quickstart/e2e.sh
        env:
          GITHUB_TOKEN: ${{ secrets.QUICKSTART_GITHUB_TOKEN }}
          REPO: ${{ secrets.QUICKSTART_REPO }}
