name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: {}

# A new push to a PR supersedes its running build; pushes to main each run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the pull request touches (hack/ci-changes.sh), for the path-gated jobs below that no
  # ruleset requires. A required job never hangs on this one: a failure here would skip it, and a
  # skipped job passes; the required harness-test reads the same script in its own steps instead.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      harness: ${{ steps.c.outputs.harness }}
      deployable: ${{ steps.c.outputs.deployable }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2 # the pull request's merge commit and its base
          persist-credentials: false
      - id: c
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash hack/ci-changes.sh

  # `task check` on four runners: check-static (every gate but the Go tests) and the Go tests in three
  # disjoint slices (hack/test-shard.sh), joined by the required `check` below. release.yaml's gate
  # still runs `task check` whole, on one runner.
  check-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: The Go caches, outside the checkout
        run: |
          {
            echo "GOCACHE=$HOME/.cache/go-build"
            echo "GOMODCACHE=$HOME/go/pkg/mod"
            echo "GOLANGCI_LINT_CACHE=$HOME/.cache/golangci-lint"
          } >> "$GITHUB_ENV"
      # Written by each of main's pushes (keyed by its sha), restored everywhere by prefix, the newest
      # first: a pull request never writes a cache another branch reads, and release.yaml restores none.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-static-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            go-static-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-
            go-static-${{ runner.os }}-
      - run: task check:static
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-static-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}

  check-test:
    name: check-test (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: The Go caches, outside the checkout
        run: |
          {
            echo "GOCACHE=$HOME/.cache/go-build"
            echo "GOMODCACHE=$HOME/go/pkg/mod"
          } >> "$GITHUB_ENV"
      # As check-static's: main writes, everyone reads. envtest's binaries too (setup-envtest's store).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.local/share/kubebuilder-envtest
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-
            go-test-${{ runner.os }}-
      - run: task test:shard SHARD=${{ matrix.shard }} SHARDS=3
      - if: github.event_name == 'push' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.local/share/kubebuilder-envtest
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}

  # The required check: `task check`, every slice of it. It runs whatever its needs did, so a failed or
  # skipped slice fails it rather than skipping it (a skipped required check would pass).
  check:
    if: ${{ !cancelled() }}
    needs: [check-static, check-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          STATIC: ${{ needs.check-static.result }}
          TEST: ${{ needs.check-test.result }}
        run: |
          echo "check-static: $STATIC, check-test: $TEST"
          [[ $STATIC == success && $TEST == success ]]

  # The harness's suites live in its Dockerfile's test stage; `task check` needs no docker.
  # They run on amd64 only: the arm64 image is published untested, as it was in cloud-native-ref.
  # Required, so the job always runs and reports: on a pull request that leaves images/maku-harness/
  # alone its steps are skipped (main's push ran them on that tree), never the job.
  harness-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2 # the pull request's merge commit and its base, for hack/ci-changes.sh
          persist-credentials: false
      - id: c
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash hack/ci-changes.sh
      - if: steps.c.outputs.harness != 'true'
        run: echo "::notice title=harness-test::images/maku-harness/ is unchanged by this pull request; its suites did not run"
      - if: steps.c.outputs.harness == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: steps.c.outputs.harness == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/maku-harness
          target: test
          push: false

  # v3 feature 3, offline proof 4: the harness image under gVisor, behind a proxy allowing exactly a
  # check-enabled run's hosts, runs both repositories' declared checks on their main. Not required:
  # it reads two other repositories and the network. A repository that declares nothing yet skips.
  # It fails on the harness's faults only; a check that ran and failed on a repository's main is that
  # repository's verdict, a warning here (tests/checks/verdict.py).
  # On a pull request, only when it touches images/maku-harness/; main's pushes always run it.
  harness-checks:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install gVisor (release-20261005.0)
        run: |
          set -eux
          curl -fsSLo /tmp/gvisor.tar.zstd https://storage.googleapis.com/gvisor/releases/release/20261005.0/x86_64/gvisor.tar.zstd
          echo "27fed731b432d6a39d908956623fd273979fda66b3ccf4b9c12413ea417c516e18a9dc3cced403fb28efe495d64dce4251f51cf8c4d9f4a72f9833bd96b6bb35  /tmp/gvisor.tar.zstd" | sha512sum -c -
          mkdir /tmp/gvisor && tar --zstd -xf /tmp/gvisor.tar.zstd -C /tmp/gvisor
          sudo install -m 0755 "$(find /tmp/gvisor -name runsc -type f | head -1)" /usr/local/bin/runsc
          sudo runsc install
          sudo systemctl restart docker
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/maku-harness
          load: true
          push: false
          tags: maku-harness:checks
      - name: The run's token, a file as the run-controller mounts it
        env:
          GH_TOKEN: ${{ github.token }}
        run: install -m 0644 /dev/null "$RUNNER_TEMP/token" && printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/token"
      - run: images/maku-harness/tests/checks/run.sh maku-harness:checks Smana/ai-native-ref golang,pypi "$RUNNER_TEMP/token"
      - run: images/maku-harness/tests/checks/run.sh maku-harness:checks Smana/cloud-native-ref pypi "$RUNNER_TEMP/token"

  # One throwaway image per PR push, tagged v<next-patch>-pr<N>.<sha8>: it sorts after
  # the last release and before the next, and each push is its own immutable tag.
  # Never `latest`, never the release tag (the same channel as crossplane-configuration).
  # <sha8> is the PR head's, not the synthetic merge commit a pull_request checks out,
  # so a tag names a commit that exists on the branch (review M1).
  # Dependabot's PRs get a read-only token, so they cannot push and are skipped, and so is a
  # pull request that changes documentation only (hack/ci-changes.sh: nothing to deploy).
  # The builds start at once; only prerelease-publish and chart-prerelease wait for a green check.
  prerelease-version:
    needs: changes
    if: >-
      needs.changes.outputs.deployable == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive the pre-release version
        id: v
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          [ -n "$latest" ] || latest="v0.0.0"
          base="${latest#v}"; major="${base%%.*}"; rest="${base#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
          echo "version=v${major}.${minor}.$((patch + 1))-pr${PR_NUMBER}.$(printf '%.8s' "${HEAD_SHA}")" >> "$GITHUB_OUTPUT"

  # Each image on native amd64 and arm64 runners, joined and signed (image.yaml).
  # Each image on native amd64 and arm64 runners, pushed by digest only (image.yaml, join: false):
  # no tag yet. Two images at a time, so the builds leave runners to the check-test slices.
  prerelease:
    needs: prerelease-version
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 2
      matrix:
        image: [maku-broker, maku-bridge, maku-factory, maku-harness, maku-run-controller, maku-slack]
    uses: ./.github/workflows/image.yaml
    with:
      image: ${{ matrix.image }}
      version: ${{ needs.prerelease-version.outputs.version }}
      join: false

  # Publishes the builds once the pull request is green: joins each image's two platform digests
  # under the pre-release tag and signs the index. A red check or harness-test leaves only untagged,
  # unsigned digests, which ghcr-cleanup.yaml deletes. It signs here, not in image.yaml: the
  # signature's identity stays this workflow's. The digest, never the tag, so a re-pushed tag cannot
  # inherit the signature. ghcr's read-after-write "not found" and Sigstore's 5xx are retried.
  prerelease-publish:
    needs: [prerelease-version, prerelease, check, harness-test]
    # Green check and harness-test, a version (none on a fork, Dependabot or documentation-only PR:
    # then nothing was built and this skips), and builds that ran: those that pushed both platforms
    # are published even when another image's build failed (hack/prerelease-publish.sh).
    if: >-
      !cancelled() &&
      needs.prerelease-version.result == 'success' &&
      needs.check.result == 'success' &&
      needs.harness-test.result == 'success' &&
      (needs.prerelease.result == 'success' || needs.prerelease.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # prerelease's matrix: an image with no digests here was not built and is skipped.
      - env:
          VERSION: ${{ needs.prerelease-version.outputs.version }}
        run: >-
          bash hack/prerelease-publish.sh "$RUNNER_TEMP/digests" "$VERSION"
          maku-broker maku-bridge maku-factory maku-harness maku-run-controller maku-slack

  # One signed chart per PR push, <next-patch>-pr<N>.g<sha8>, whose appVersion is the image
  # pre-release of the same push. The `g` keeps a digits-only sha a valid semver identifier
  # (R20). Only the factory has a chart here: the broker's lives in cloud-native-ref.
  # Published once the pull request is green, as the images are.
  chart-prerelease:
    needs: [changes, check, harness-test]
    if: >-
      needs.changes.outputs.deployable == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: helm aqua:mikefarah/yq
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # cosign reads Docker's credentials, not helm's registry config: without this the signature
      # upload is refused after the chart is pushed.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package, push and sign
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The PR head, as the images name it (review M1), not the synthetic merge commit the
          # checkout holds: image and chart then carry the same sha8.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          [ -n "$latest" ] || latest="v0.0.0"
          base="${latest#v}"; major="${base%%.*}"; rest="${base#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
          next="${major}.${minor}.$((patch + 1))-pr${PR_NUMBER}"
          sha8="$(printf '%.8s' "${HEAD_SHA}")"
          v="${next}.g${sha8}"
          app="v${next}.${sha8}"
          export v app
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          # publish DIR NAME: package DIR at $v, push it, sign the digest, print it in the summary.
          publish() {
            helm package "$1" --version "$v" --app-version "$app"
            # Print the output whether or not the push fails: under bash -e a bare assignment
            # exits first and the error is lost.
            # ghcr intermittently answers a fresh push with "failed to perform Tag ... not found":
            # retry the push (it is idempotent: same content, same digest) before failing.
            for attempt in 1 2 3; do
              rc=0; out="$(helm push "$2-${v}.tgz" oci://ghcr.io/smana/charts 2>&1)" || rc=$?
              [ "$rc" -eq 0 ] && break
              echo "$out"; echo "helm push attempt $attempt failed (exit $rc), retrying" >&2; sleep $((attempt * 15))
            done
            echo "$out"
            [ "$rc" -eq 0 ] || { echo "helm push failed (exit $rc)" >&2; exit "$rc"; }
            digest="$(sed -n 's/^Digest: //p' <<<"$out")"
            [ -n "$digest" ] || { echo "helm push printed no digest" >&2; exit 1; }
            # Signs the digest, never the version, as the images do; Sigstore's intermittent 5xx is retried.
            for attempt in 1 2 3 4; do
              cosign sign --yes "ghcr.io/smana/charts/$2@${digest}" && break
              [ "$attempt" -lt 4 ] || { echo "cosign sign $2 failed" >&2; exit 1; }
              echo "cosign sign $2 attempt $attempt failed, retrying" >&2; sleep $((attempt * 20))
            done
            echo "### chart $2" >> "$GITHUB_STEP_SUMMARY"
            echo "oci://ghcr.io/smana/charts/$2:${v}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          }
          publish charts/maku-factory maku-factory
          # the model gateway's objects (D7), consumed alone or through the umbrella.
          publish charts/maku-gateway maku-gateway
          # the CRDs, installed before agent-factory. The vendored agentgateway (its CRDs in
          # config/agentgateway, its controller chart under the umbrella) is checked against its pins.
          bash hack/agentgateway-vendor.sh check
          publish charts/agent-factory-crds agent-factory-crds
          # The umbrella carries its subcharts at $v: on a copy (never committed), the sibling subcharts
          # and their file:// constraints take $v (the vendored agentgateway keeps v1.6.0), the copy's
          # vendored files are checked against the pins, then the dependencies are built into it.
          work="$RUNNER_TEMP/charts"
          cp -r charts "$work"
          for c in maku maku-factory maku-gateway; do yq -i '.version = env(v) | .appVersion = env(app)' "$work/$c/Chart.yaml"; done
          yq -i '(.dependencies[] | select(.repository | test("^file://\.\./"))).version = env(v)' "$work/agent-factory/Chart.yaml"
          rm -f "$work/agent-factory/Chart.lock"
          bash hack/agentgateway-vendor.sh check-copy "$work"
          helm dependency build "$work/agent-factory"
          publish "$work/agent-factory" agent-factory
