name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: {}

# A new push to a PR supersedes its running build; pushes to main each run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - run: task check

  # The harness's suites live in its Dockerfile's test stage; `task check` needs no docker.
  # They run on amd64 only: the arm64 image is published untested, as it was in cloud-native-ref.
  harness-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/maku-harness
          target: test
          push: false

  # v3 feature 3, offline proof 4: the harness image under gVisor, behind a proxy allowing exactly a
  # check-enabled run's hosts, runs both repositories' declared checks on their main. Not required:
  # it reads two other repositories and the network. A repository that declares nothing yet skips.
  # It fails on the harness's faults only; a check that ran and failed on a repository's main is that
  # repository's verdict, a warning here (tests/checks/verdict.py).
  harness-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install gVisor (release-20261005.0)
        run: |
          set -eux
          curl -fsSLo /tmp/gvisor.tar.zstd https://storage.googleapis.com/gvisor/releases/release/20261005.0/x86_64/gvisor.tar.zstd
          echo "27fed731b432d6a39d908956623fd273979fda66b3ccf4b9c12413ea417c516e18a9dc3cced403fb28efe495d64dce4251f51cf8c4d9f4a72f9833bd96b6bb35  /tmp/gvisor.tar.zstd" | sha512sum -c -
          mkdir /tmp/gvisor && tar --zstd -xf /tmp/gvisor.tar.zstd -C /tmp/gvisor
          sudo install -m 0755 "$(find /tmp/gvisor -name runsc -type f | head -1)" /usr/local/bin/runsc
          sudo runsc install
          sudo systemctl restart docker
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/maku-harness
          load: true
          push: false
          tags: maku-harness:checks
      - name: The run's token, a file as the run-controller mounts it
        env:
          GH_TOKEN: ${{ github.token }}
        run: install -m 0644 /dev/null "$RUNNER_TEMP/token" && printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/token"
      - run: images/maku-harness/tests/checks/run.sh maku-harness:checks Smana/ai-native-ref golang,pypi "$RUNNER_TEMP/token"
      - run: images/maku-harness/tests/checks/run.sh maku-harness:checks Smana/cloud-native-ref pypi "$RUNNER_TEMP/token"

  # One throwaway image per PR push, tagged v<next-patch>-pr<N>.<sha8>: it sorts after
  # the last release and before the next, and each push is its own immutable tag.
  # Never `latest`, never the release tag (the same channel as crossplane-configuration).
  # <sha8> is the PR head's, not the synthetic merge commit a pull_request checks out,
  # so a tag names a commit that exists on the branch (review M1).
  # Dependabot's PRs get a read-only token, so they cannot push and are skipped.
  prerelease-version:
    needs: [check, harness-test]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derive the pre-release version
        id: v
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          [ -n "$latest" ] || latest="v0.0.0"
          base="${latest#v}"; major="${base%%.*}"; rest="${base#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
          echo "version=v${major}.${minor}.$((patch + 1))-pr${PR_NUMBER}.$(printf '%.8s' "${HEAD_SHA}")" >> "$GITHUB_OUTPUT"

  # Each image on native amd64 and arm64 runners, joined and signed (image.yaml).
  prerelease:
    needs: prerelease-version
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [maku-broker, maku-bridge, maku-factory, maku-harness, maku-run-controller, maku-slack]
    uses: ./.github/workflows/image.yaml
    with:
      image: ${{ matrix.image }}
      version: ${{ needs.prerelease-version.outputs.version }}

  # Signs each joined index here, not in image.yaml: the signature's identity stays this workflow's.
  # The digest, never the tag, so a re-pushed tag cannot inherit the signature.
  prerelease-sign:
    needs: prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        image: [maku-broker, maku-bridge, maku-factory, maku-harness, maku-run-controller, maku-slack]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index-${{ matrix.image }}
          path: ${{ runner.temp }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ghcr.io/smana/${{ matrix.image }}
        run: |
          set -euo pipefail
          digest="$(cat "$RUNNER_TEMP/index-digest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest '$digest'" >&2; exit 1; }
          cosign sign --yes "${IMAGE}@${digest}"

  # One signed chart per PR push, <next-patch>-pr<N>.g<sha8>, whose appVersion is the image
  # pre-release of the same push. The `g` keeps a digits-only sha a valid semver identifier
  # (R20). Only the factory has a chart here: the broker's lives in cloud-native-ref.
  chart-prerelease:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: helm aqua:mikefarah/yq
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # cosign reads Docker's credentials, not helm's registry config: without this the signature
      # upload is refused after the chart is pushed.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package, push and sign
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The PR head, as the images name it (review M1), not the synthetic merge commit the
          # checkout holds: image and chart then carry the same sha8.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          [ -n "$latest" ] || latest="v0.0.0"
          base="${latest#v}"; major="${base%%.*}"; rest="${base#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
          next="${major}.${minor}.$((patch + 1))-pr${PR_NUMBER}"
          sha8="$(printf '%.8s' "${HEAD_SHA}")"
          v="${next}.g${sha8}"
          app="v${next}.${sha8}"
          export v app
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          # publish DIR NAME: package DIR at $v, push it, sign the digest, print it in the summary.
          publish() {
            helm package "$1" --version "$v" --app-version "$app"
            # Print the output whether or not the push fails: under bash -e a bare assignment
            # exits first and the error is lost.
            # ghcr intermittently answers a fresh push with "failed to perform Tag ... not found":
            # retry the push (it is idempotent: same content, same digest) before failing.
            for attempt in 1 2 3; do
              rc=0; out="$(helm push "$2-${v}.tgz" oci://ghcr.io/smana/charts 2>&1)" || rc=$?
              [ "$rc" -eq 0 ] && break
              echo "$out"; echo "helm push attempt $attempt failed (exit $rc), retrying" >&2; sleep $((attempt * 15))
            done
            echo "$out"
            [ "$rc" -eq 0 ] || { echo "helm push failed (exit $rc)" >&2; exit "$rc"; }
            digest="$(sed -n 's/^Digest: //p' <<<"$out")"
            [ -n "$digest" ] || { echo "helm push printed no digest" >&2; exit 1; }
            # Signs the digest, never the version, as the images do.
            cosign sign --yes "ghcr.io/smana/charts/$2@${digest}"
            echo "### chart $2" >> "$GITHUB_STEP_SUMMARY"
            echo "oci://ghcr.io/smana/charts/$2:${v}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          }
          publish charts/maku-factory maku-factory
          # the model gateway's objects (D7), consumed alone or through the umbrella.
          publish charts/maku-gateway maku-gateway
          # the CRDs, installed before agent-factory. The vendored agentgateway (its CRDs in
          # config/agentgateway, its controller chart under the umbrella) is checked against its pins.
          bash hack/agentgateway-vendor.sh check
          publish charts/agent-factory-crds agent-factory-crds
          # The umbrella carries its subcharts at $v: on a copy (never committed), the sibling subcharts
          # and their file:// constraints take $v (the vendored agentgateway keeps v1.6.0), the copy's
          # vendored files are checked against the pins, then the dependencies are built into it.
          work="$RUNNER_TEMP/charts"
          cp -r charts "$work"
          for c in maku maku-factory maku-gateway; do yq -i '.version = env(v) | .appVersion = env(app)' "$work/$c/Chart.yaml"; done
          yq -i '(.dependencies[] | select(.repository | test("^file://\.\./"))).version = env(v)' "$work/agent-factory/Chart.yaml"
          rm -f "$work/agent-factory/Chart.lock"
          bash hack/agentgateway-vendor.sh check-copy "$work"
          helm dependency build "$work/agent-factory"
          publish "$work/agent-factory" agent-factory
