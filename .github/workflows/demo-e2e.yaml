# The laptop demo in CI.
#   k3d:     on pull requests touching the demo, `task chart:install:k3d` (this checkout's broker,
#            run-controller and factory images, the latest release's harness and bridge, a dummy App).
#   nightly: `task demo` headless on kind with a real, capped model and a test GitHub App, then the
#            seeded docs-links issue is labelled and the job waits up to 30 minutes for a pull request
#            by <slug>[bot] bearing a `maku/merge-gate` commit status. `task demo:down` always runs.
#            The nightly installs this checkout's chart with the LATEST RELEASE's images (up.sh has no
#            way to load images built in CI), so it proves released images, not the checkout's.
#
# The nightly's Actions secrets (all required; one missing and the job skips, loudly, in its summary):
#   DEMO_MODEL_BASE_URL  an OpenAI-compatible base URL (https://.../v1)
#   DEMO_MODEL_NAME      the model's name; pick a cheap one
#   DEMO_MODEL_API_KEY   its key: give it a spend cap at the provider
#   DEMO_APP_ID          the test GitHub App's id
#   DEMO_APP_KEY         the App's private key (PEM), installed on DEMO_REPO; permissions: docs/factory.md,
#                        "The demo runs on one GitHub App"
#   DEMO_APP_SLUG        the App's slug (github.com/apps/<slug>); its pull requests are by <slug>[bot]
#   DEMO_REPO            owner/name of a PUBLIC repository created from Smana/maku-demo, App installed
#   DEMO_LABEL_TOKEN     a fine-grained PAT of the repository's owner, on DEMO_REPO only: Issues write,
#                        Administration write (the ruleset), Metadata read. It seeds the issues and
#                        labels the docs-links one factory/ready; its owner is the demo's maintainer,
#                        because the factory acts only on a label set by a user with write access
#                        (a bot's `write` answer is not something to rely on).
name: demo-e2e
on:
  pull_request:
    paths:
      - charts/**
      - hack/demo/**
      - internal/runctl/**
      - internal/factory/**
      - cmd/maku/**
      - .github/workflows/demo-e2e.yaml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: demo-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  k3d:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }} # install.sh asks the API for the latest release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          # k3d is fetched by mise from its aqua-registry entry: a pinned version, checksum-verified.
          install_args: aqua:go-task/task go kubectl helm aqua:k3d-io/k3d@5.9.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: task chart:install:k3d

  nightly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      DEMO_MODEL_BASE_URL: ${{ secrets.DEMO_MODEL_BASE_URL }}
      DEMO_MODEL_NAME: ${{ secrets.DEMO_MODEL_NAME }}
      DEMO_MODEL_API_KEY: ${{ secrets.DEMO_MODEL_API_KEY }}
      DEMO_APP_ID: ${{ secrets.DEMO_APP_ID }}
      DEMO_APP_KEY: ${{ secrets.DEMO_APP_KEY }}
      DEMO_APP_SLUG: ${{ secrets.DEMO_APP_SLUG }}
      DEMO_REPO: ${{ secrets.DEMO_REPO }}
      DEMO_LABEL_TOKEN: ${{ secrets.DEMO_LABEL_TOKEN }}
    steps:
      - id: gate
        run: |
          missing=()
          for s in DEMO_MODEL_BASE_URL DEMO_MODEL_NAME DEMO_MODEL_API_KEY DEMO_APP_ID DEMO_APP_KEY DEMO_APP_SLUG DEMO_REPO DEMO_LABEL_TOKEN; do
            [[ -n ${!s} ]] || missing+=("$s")
          done
          if ((${#missing[@]})); then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::warning title=demo-e2e nightly skipped::nothing ran, so this green check proves nothing about the demo. Missing: ${missing[*]}"
            {
              echo "### demo-e2e nightly skipped: nothing ran"
              echo
              echo "A green check here is **not** a pass. Missing Actions secrets: ${missing[*]}"
              echo
              echo "All of them, and what each holds, are listed at the top of \`.github/workflows/demo-e2e.yaml\`."
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - if: steps.gate.outputs.run == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: aqua:go-task/task go kubectl helm aqua:kubernetes-sigs/kind
      - if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: steps.gate.outputs.run == 'true'
        # The PAT is gh's login: up.sh then seeds the labels, the issues and the ruleset, and its owner is
        # the maintainer allowed to file work.
        name: task demo
        run: |
          umask 077
          printf '%s' "$DEMO_APP_KEY" >"$RUNNER_TEMP/app-key.pem"
          export GH_TOKEN="$DEMO_LABEL_TOKEN"
          DEMO_LOGIN=$(gh api user --jq .login)
          export DEMO_LOGIN
          MODEL_BASE_URL="$DEMO_MODEL_BASE_URL" MODEL_NAME="$DEMO_MODEL_NAME" MODEL_API_KEY="$DEMO_MODEL_API_KEY" \
          GITHUB_APP_ID="$DEMO_APP_ID" GITHUB_APP_KEY_FILE="$RUNNER_TEMP/app-key.pem" DEMO_SLUG="$DEMO_APP_SLUG" \
          CLUSTER=kind task demo
      - if: steps.gate.outputs.run == 'true'
        name: label the seeded issue, wait for the pull request and its gate status
        env:
          GH_TOKEN: ${{ secrets.DEMO_LABEL_TOKEN }}
        run: |
          issue=$(gh issue list -R "$DEMO_REPO" --label class:docs-links --state open --limit 1 --json number --jq '.[0].number')
          [[ -n $issue && $issue != null ]] || { echo "::error::no open class:docs-links issue on $DEMO_REPO"; exit 1; }
          gh issue edit "$issue" -R "$DEMO_REPO" --add-label factory/ready
          echo "labelled $DEMO_REPO#$issue factory/ready"
          bot="${DEMO_APP_SLUG}[bot]"
          deadline=$((SECONDS + 1800))
          while ((SECONDS < deadline)); do
            sha=$(gh api "repos/$DEMO_REPO/pulls?state=all&sort=created&direction=desc&per_page=20" \
              --jq "[.[] | select(.user.login == \"$bot\")][0].head.sha // empty")
            if [[ -n $sha ]] && gh api "repos/$DEMO_REPO/commits/$sha/statuses" --jq '.[].context' | grep -qxF maku/merge-gate; then
              echo "a pull request by $bot has the status maku/merge-gate on $sha"
              {
                echo "### demo-e2e nightly passed"
                echo
                echo "$DEMO_REPO#$issue labelled, a pull request by \`$bot\` with \`maku/merge-gate\` on \`${sha:0:12}\` within $((SECONDS / 60)) min of the whole job."
              } >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::no pull request by $bot with a maku/merge-gate status within 30 minutes of labelling $DEMO_REPO#$issue"
          echo "### demo-e2e nightly FAILED: no pull request by \`$bot\` with \`maku/merge-gate\` within 30 minutes" >>"$GITHUB_STEP_SUMMARY"
          exit 1
      - if: failure() && steps.gate.outputs.run == 'true'
        name: diagnostics
        run: |
          [[ -s .demo/kubeconfig ]] || exit 0
          export KUBECONFIG="$PWD/.demo/kubeconfig"
          kubectl get pods,runs -A -o wide || true
          for d in room-broker run-controller agent-factory; do kubectl -n maku logs "deploy/$d" --all-containers --tail=120 || true; done
      - if: always() && steps.gate.outputs.run == 'true'
        name: task demo:down
        run: |
          task demo:down -- --all
          rm -f "$RUNNER_TEMP/app-key.pem"
