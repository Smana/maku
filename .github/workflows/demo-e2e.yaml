# The laptop demo in CI.
#   k3d:     on pull requests touching the demo, `task chart:install:k3d` (this checkout's broker,
#            run-controller and factory images, the latest release's harness and bridge, a dummy App),
#            in three network legs (install.sh's NETPOL): none, the demo as shipped; kubernetes, the
#            NetworkPolicy mode on kube-router, whose preflight passes; unenforced, the same mode on a
#            k3s with no NetworkPolicy controller, whose preflight refuses runs.
#   nightly: `task demo` headless on kind with a real, capped model and a test GitHub App, then the
#            seeded docs-links issue is labelled and the job waits up to 30 minutes for a pull request
#            by <slug>[bot] bearing a `maku/merge-gate` commit status. `task demo:down` always runs.
#            The nightly installs this checkout's chart with the LATEST RELEASE's images (up.sh has no
#            way to load images built in CI), so it proves released images, not the checkout's.
#            It stays RED until a release carries the chart's requirements (the release's run-controller
#            decodes its values strictly and refuses a chart newer than itself). It passes MAKU_VERSION
#            explicitly, resolved with the job's read-only token.
#
# The nightly's Actions secrets (all required; one missing and the job skips, loudly, in its summary):
#   DEMO_MODEL_BASE_URL  an OpenAI-compatible base URL (https://.../v1)
#   DEMO_MODEL_NAME      the model's name; pick a cheap one
#   DEMO_MODEL_API_KEY   its key: give it a spend cap at the provider
#   DEMO_APP_ID          the test GitHub App's id
#   DEMO_APP_KEY         the App's private key (PEM), installed on DEMO_REPO; permissions: docs/factory.md,
#                        "The demo runs on one GitHub App"
#   DEMO_APP_SLUG        the App's slug (github.com/apps/<slug>); its pull requests are by <slug>[bot]
#   DEMO_REPO            owner/name of a PUBLIC repository created from Smana/maku-demo, App installed
#   DEMO_LABEL_TOKEN     a fine-grained PAT of the repository's owner, on DEMO_REPO only: Issues write, Pull requests
#                        write (to close the last night's PRs), Metadata read. No Administration. Its owner is the
#                        demo's maintainer: the factory acts only on a label set by a user with write access
#                        (a bot's `write` answer is not something to rely on).
#
# One-time setup by the repository's owner, before adding the secrets: run `task demo` once by hand against
# DEMO_REPO with your own gh login (it creates the labels, the seeded issues and the `maku-demo` ruleset),
# then install the test App on DEMO_REPO. The nightly itself runs `task demo` with DEMO_NO_GH=1 (no seeding,
# which needs admin) and does its own issue, label and pull request steps with the PAT. Each night it closes the
# bot's open PRs and the `nightly` issues, files a fresh docs-links issue, labels it, and accepts only a PR
# created after that and referencing that issue.
name: demo-e2e
on:
  pull_request:
    paths:
      - charts/**
      - hack/demo/**
      - internal/runctl/**
      - internal/factory/**
      - internal/app/**
      - internal/broker/**
      - images/**
      - hack/quickstart/versions.env
      - examples/demo-repo/**
      - cmd/maku/**
      - .github/workflows/demo-e2e.yaml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: demo-e2e-${{ github.event_name == 'pull_request' && github.ref || 'nightly' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  k3d:
    if: github.event_name == 'pull_request'
    name: k3d (${{ matrix.netpol }})
    strategy:
      fail-fast: false
      matrix:
        netpol: [none, kubernetes, unenforced]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }} # install.sh asks the API for the latest release
      NETPOL: ${{ matrix.netpol }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          # k3d is fetched by mise from its aqua-registry entry: a pinned version, checksum-verified.
          install_args: aqua:go-task/task go kubectl helm aqua:k3d-io/k3d@5.9.0
      # Installed is not active: the repository's mise.toml names no k3d, so its shim has no version
      # ("No version is set for shim: k3d") until the runner's global config names one.
      - run: mise use -g aqua:k3d-io/k3d@5.9.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: task chart:install:k3d

  nightly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - id: gate
        env:
          DEMO_MODEL_BASE_URL: ${{ secrets.DEMO_MODEL_BASE_URL }}
          DEMO_MODEL_NAME: ${{ secrets.DEMO_MODEL_NAME }}
          DEMO_MODEL_API_KEY: ${{ secrets.DEMO_MODEL_API_KEY }}
          DEMO_APP_ID: ${{ secrets.DEMO_APP_ID }}
          DEMO_APP_KEY: ${{ secrets.DEMO_APP_KEY }}
          DEMO_APP_SLUG: ${{ secrets.DEMO_APP_SLUG }}
          DEMO_REPO: ${{ secrets.DEMO_REPO }}
          DEMO_LABEL_TOKEN: ${{ secrets.DEMO_LABEL_TOKEN }}
        run: |
          missing=()
          for s in DEMO_MODEL_BASE_URL DEMO_MODEL_NAME DEMO_MODEL_API_KEY DEMO_APP_ID DEMO_APP_KEY DEMO_APP_SLUG DEMO_REPO DEMO_LABEL_TOKEN; do
            [[ -n ${!s} ]] || missing+=("$s")
          done
          if ((${#missing[@]})); then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::warning title=demo-e2e nightly skipped::nothing ran, so this green check proves nothing about the demo. Missing: ${missing[*]}"
            {
              echo "### demo-e2e nightly skipped: nothing ran"
              echo
              echo "A green check here is **not** a pass. Missing Actions secrets: ${missing[*]}"
              echo
              echo "All of them, and what each holds, are listed at the top of \`.github/workflows/demo-e2e.yaml\`."
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - if: steps.gate.outputs.run == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: aqua:go-task/task go kubectl helm aqua:kubernetes-sigs/kind
      - if: steps.gate.outputs.run == 'true'
        run: mise use -g aqua:kubernetes-sigs/kind # as k3d above: installed is not active
      - if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: steps.gate.outputs.run == 'true'
        name: task demo
        env:
          MODEL_BASE_URL: ${{ secrets.DEMO_MODEL_BASE_URL }}
          MODEL_NAME: ${{ secrets.DEMO_MODEL_NAME }}
          MODEL_API_KEY: ${{ secrets.DEMO_MODEL_API_KEY }}
          GITHUB_APP_ID: ${{ secrets.DEMO_APP_ID }}
          DEMO_APP_KEY: ${{ secrets.DEMO_APP_KEY }}
          DEMO_SLUG: ${{ secrets.DEMO_APP_SLUG }}
          DEMO_REPO: ${{ secrets.DEMO_REPO }}
          GH_TOKEN: ${{ secrets.DEMO_LABEL_TOKEN }}
          READ_TOKEN: ${{ github.token }} # read-only (contents: read): the unauthenticated rate limit is shared
        run: |
          umask 077
          MAKU_VERSION=$(curl -fsS -H "Authorization: Bearer $READ_TOKEN" https://api.github.com/repos/Smana/maku/releases/latest | sed -n -E 's/.*"tag_name": *"([^"]*)".*/\1/p' | head -1)
          [[ -n $MAKU_VERSION ]] || { echo "::error::could not resolve the latest release"; exit 1; }
          export MAKU_VERSION GITHUB_TOKEN=$READ_TOKEN
          printf '%s' "$DEMO_APP_KEY" >"$RUNNER_TEMP/app-key.pem"
          unset DEMO_APP_KEY
          DEMO_LOGIN=$(gh api user --jq .login)
          export DEMO_LOGIN
          unset GH_TOKEN READ_TOKEN # up.sh must not use gh: DEMO_NO_GH keeps it off, this keeps it out
          export GITHUB_APP_KEY_FILE="$RUNNER_TEMP/app-key.pem" CLUSTER=kind DEMO_NO_GH=1
          task demo
      - if: steps.gate.outputs.run == 'true'
        name: file a fresh issue, label it, wait for its pull request and the gate status
        env:
          GH_TOKEN: ${{ secrets.DEMO_LABEL_TOKEN }}
          DEMO_APP_SLUG: ${{ secrets.DEMO_APP_SLUG }}
          DEMO_REPO: ${{ secrets.DEMO_REPO }}
        run: |
          bot="${DEMO_APP_SLUG}[bot]"
          # Last night's leftovers must not pass for tonight's work.
          for n in $(gh api "repos/$DEMO_REPO/pulls?state=open&per_page=100" --jq ".[] | select(.user.login == \"$bot\") | .number"); do
            gh pr close "$n" -R "$DEMO_REPO" -c "closed by the nightly demo run" || true
          done
          for n in $(gh issue list -R "$DEMO_REPO" --label nightly --state open --limit 100 --json number --jq '.[].number'); do
            gh issue close "$n" -R "$DEMO_REPO" -c "closed by the nightly demo run" || true
          done
          gh label create nightly -R "$DEMO_REPO" >/dev/null 2>&1 || true
          # shellcheck source=hack/demo/lib.sh
          . hack/demo/lib.sh
          f=examples/demo-repo/ISSUES.md
          for ((i = 1; i <= $(demo_issue_count "$f"); i++)); do
            labels=$(demo_issue_field "$f" "$i" labels)
            grep -qxF class:docs-links <<<"$labels" && break
          done
          title=$(demo_issue_field "$f" "$i" title)
          body=$(demo_issue_field "$f" "$i" body)
          start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          url=$(gh issue create -R "$DEMO_REPO" -t "$title" -b "$body" -l class:docs-links -l nightly)
          issue=${url##*/}
          [[ $issue =~ ^[0-9]+$ ]] || { echo "::error::could not file the issue: $url"; exit 1; }
          gh issue edit "$issue" -R "$DEMO_REPO" --add-label factory/ready # its own step: the label event must fire
          echo "filed and labelled $DEMO_REPO#$issue factory/ready at $start"
          deadline=$((SECONDS + 1800))
          while ((SECONDS < deadline)); do
            sha=$(gh api "repos/$DEMO_REPO/pulls?state=all&sort=created&direction=desc&per_page=30" \
              --jq "[.[] | select(.user.login == \"$bot\" and .created_at > \"$start\" and ((.body // \"\") | test(\"#$issue\\\\b\")))][0].head.sha // empty" 2>/dev/null || true)
            if [[ -n $sha ]] && { gh api "repos/$DEMO_REPO/commits/$sha/statuses" --jq '.[].context' 2>/dev/null || true; } | grep -qxF maku/merge-gate; then
              echo "a new pull request by $bot for #$issue has the status maku/merge-gate on $sha"
              {
                echo "### demo-e2e nightly passed"
                echo
                echo "$DEMO_REPO#$issue filed and labelled; a pull request by \`$bot\` created after that, referencing it, has \`maku/merge-gate\` on \`${sha:0:12}\`."
              } >>"$GITHUB_STEP_SUMMARY"
              echo "This nightly proves the latest released images, not this commit's." >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::no new pull request by $bot for #$issue with a maku/merge-gate status within 30 minutes"
          {
            echo "### demo-e2e nightly FAILED: no new pull request by \`$bot\` for #$issue with \`maku/merge-gate\` within 30 minutes"
            echo "This nightly proves the latest released images, not this commit's."
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1
      - if: failure() && steps.gate.outputs.run == 'true'
        name: diagnostics
        run: |
          [[ -s .demo/kubeconfig ]] || exit 0
          export KUBECONFIG="$PWD/.demo/kubeconfig"
          kubectl get pods,runs -A -o wide || true
          for d in room-broker run-controller agent-factory; do kubectl -n maku logs "deploy/$d" --all-containers --tail=120 || true; done
      - if: always() && steps.gate.outputs.run == 'true'
        name: task demo:down
        run: |
          rm -f "$RUNNER_TEMP/app-key.pem"
          task demo:down -- --all
